name: Publish Forge3D Web Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full protected-main release target SHA
        required: true
        type: string
      readinessRunId:
        description: Exact successful browser hardware release-readiness run ID
        required: true
        type: string
      tag:
        description: Package-version-matching SemVer tag
        required: true
        type: string

permissions: {}

jobs:
  observe-release-publication-trust:
    name: Web Release / Observe Publication Trust
    runs-on: ubuntu-latest
    environment: forge3d-trust-observer
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
    outputs:
      observation_artifact_id: ${{ steps.upload-observation.outputs.artifact-id }}
      observation_artifact_name: ${{ steps.emit-observation.outputs.artifact-name }}
      observation_artifact_digest: ${{ steps.upload-observation.outputs.artifact-digest }}
      observation_content_sha256: ${{ steps.emit-observation.outputs.content-sha256 }}

    steps:
      - name: Reject non-main or mismatched target
        if: github.ref != 'refs/heads/main' || inputs.target_sha != github.sha
        run: exit 1

      - name: Check out protected observer code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Mint short-lived trust-observer token
        id: observer-token
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_APP_ID: ${{ secrets.TRUST_OBSERVER_APP_ID }}
          TRUST_OBSERVER_INSTALLATION_ID: ${{ secrets.TRUST_OBSERVER_INSTALLATION_ID }}
          TRUST_OBSERVER_PRIVATE_KEY: ${{ secrets.TRUST_OBSERVER_PRIVATE_KEY }}
        run: node scripts/mint-github-app-token.mjs

      - name: Verify live protected-main trust
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: node scripts/verify-repository-trust.mjs > repository-trust-verification.json

      - name: Emit observation for validation and protected publisher
        id: emit-observation
        working-directory: crates/forge3d-web
        run: |
          node scripts/emit-repository-trust-observation.mjs \
            --verification repository-trust-verification.json \
            --operation publish-web-release \
            --consumer validate-release-candidate@none \
            --consumer publish-release@forge3d-web-release \
            --workflow-path .github/workflows/publish-web-release.yml \
            --workflow-ref refs/heads/main \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ inputs.target_sha }}" \
            --target-sha "${{ inputs.target_sha }}" \
            --output repository-trust-observation.json
          name="repository-trust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish-web-release"
          echo "artifact-name=${name}" >> "$GITHUB_OUTPUT"
          echo "content-sha256=$(sha256sum repository-trust-observation.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Revoke observer token
        if: always() && steps.observer-token.outputs.token != ''
        working-directory: crates/forge3d-web
        env:
          OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: |
          node --input-type=module --eval '
            const response = await fetch("https://api.github.com/installation/token", {
              method: "DELETE",
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.OBSERVER_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" }
            });
            if (response.status !== 204) throw new Error(`token revocation failed: ${response.status}`);
          '

      - name: Upload exact observation
        id: upload-observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.emit-observation.outputs.artifact-name }}
          path: crates/forge3d-web/repository-trust-observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Attest observation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/repository-trust-observation.json

  validate-release-candidate:
    name: Web Release / Validate Candidate
    needs: observe-release-publication-trust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      preflight_artifact_id: ${{ steps.upload-preflight.outputs.artifact-id }}
      preflight_artifact_digest: ${{ steps.upload-preflight.outputs.artifact-digest }}
      preflight_sha256: ${{ steps.preflight.outputs.preflight-sha256 }}

    steps:
      - name: Check out protected validation code only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify observation and strict post-epoch target
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-release-publication-trust.outputs.observation_content_sha256 }}
          EXPECTED_OPERATION: publish-web-release
          EXPECTED_CONSUMER_JOB: validate-release-candidate
          EXPECTED_CONSUMER_ENVIRONMENT: none
          EXPECTED_TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.target_sha }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/publish-web-release.yml
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ inputs.target_sha }}" = "${GITHUB_SHA}"
          node scripts/verify-repository-trust-observation.mjs
          epoch="$(node -p "require('./tests/infrastructure/repository-trust-policy.json').trustEpochSha")"
          test "${{ inputs.target_sha }}" != "${epoch}"
          git merge-base --is-ancestor "${epoch}" "${{ inputs.target_sha }}"

      - name: Resolve exact attested release-readiness record
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_RUN_ID: ${{ inputs.readinessRunId }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${READINESS_RUN_ID}" > readiness-run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${READINESS_RUN_ID}/jobs?per_page=100" > readiness-jobs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${READINESS_RUN_ID}/artifacts?per_page=100" > readiness-artifacts.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const run = JSON.parse(readFileSync("readiness-run.json", "utf8"));
            const jobs = JSON.parse(readFileSync("readiness-jobs.json", "utf8")).jobs;
            const artifacts = JSON.parse(readFileSync("readiness-artifacts.json", "utf8")).artifacts;
            if (
              run.path !== ".github/workflows/browser-hardware-release-readiness.yml" ||
              run.head_sha !== process.env.TARGET_SHA ||
              run.head_branch !== "main" ||
              run.status !== "completed" ||
              run.conclusion !== "success" ||
              jobs.filter((job) =>
                job.name === "browser-hardware-release-readiness" &&
                job.conclusion === "success"
              ).length !== 1
            ) throw new Error("release-readiness run/job mismatch");
            const matches = artifacts.filter((artifact) =>
              artifact.name === "browser-hardware-release-readiness"
            );
            if (matches.length !== 1 || matches[0].expired) throw new Error("release-readiness artifact mismatch");
            writeFileSync("readiness-artifact.json", JSON.stringify(matches[0]));
          '
          artifact_id="$(node -p "require('./readiness-artifact.json').id")"
          expected="$(node -p "require('./readiness-artifact.json').digest")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > readiness.zip
          test "$(sha256sum readiness.zip | cut -d ' ' -f 1)" = "${expected#sha256:}"
          mkdir readiness
          unzip -q readiness.zip -d readiness
          test "$(find readiness -name browser-hardware-release-readiness.json -type f | wc -l)" -eq 1
          gh attestation verify "$(find readiness -name browser-hardware-release-readiness.json -type f)" \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/browser-hardware-release-readiness.yml \
            --source-ref refs/heads/main \
            --source-digest "${TARGET_SHA}" \
            --deny-self-hosted-runners

      - name: Validate SemVer tag, immutable setting, and absent release
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}" > repository-settings.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            import { validateReleaseCandidate } from "./scripts/release-publication.mjs";
            const settings = JSON.parse(readFileSync("repository-settings.json", "utf8"));
            const readiness = JSON.parse(readFileSync(
              process.argv[1], "utf8"
            ));
            validateReleaseCandidate({
              targetSha: process.env.TARGET_SHA,
              tag: process.env.RELEASE_TAG,
              packageVersion: JSON.parse(readFileSync("package.json", "utf8")).version,
              readiness,
              repositorySettings: {
                immutableReleases:
                  settings.immutable_releases === true ||
                  settings.immutable_releases?.enabled === true
              },
              existingRelease: null,
              existingTag: null,
              repositoryTrust: {
                verified: true,
                targetSha: process.env.TARGET_SHA,
                currentMainSha: process.env.GITHUB_SHA
              }
            });
          ' "$(find readiness -name browser-hardware-release-readiness.json -type f)"
          node --input-type=module --eval '
            import { assertGitHubResourceAbsent } from "./scripts/release-publication.mjs";
            for (const resourcePath of [
              `releases/tags/${process.env.RELEASE_TAG}`,
              `git/ref/tags/${process.env.RELEASE_TAG}`
            ]) {
              await assertGitHubResourceAbsent({
                apiBase: process.env.GITHUB_API_URL,
                repository: process.env.GITHUB_REPOSITORY,
                resourcePath,
                token: process.env.GITHUB_TOKEN
              });
            }
          '

      - name: Copy exact package and evidence assets by numeric artifact ID
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          mkdir release-assets evidence-assets
          readiness_path="$(find readiness -name browser-hardware-release-readiness.json -type f)"
          package_run_id="$(node -p "require('./${readiness_path}').packageRunId")"
          node scripts/resolve-hardware-promotion.mjs \
            --package-run-id "${package_run_id}" \
            --trusted-sha "${TARGET_SHA}" \
            --output package-run.json
          package_artifact_id="$(node -p "require('./package-run.json').packageArtifactId")"
          package_expected="$(node -p "require('./package-run.json').packageArtifactDigest")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${package_artifact_id}/zip" > package-assets.zip
          test "$(sha256sum package-assets.zip | cut -d ' ' -f 1)" = "${package_expected#sha256:}"
          mkdir package-assets
          unzip -q package-assets.zip -d package-assets
          gh attestation verify package-assets/browser-package-manifest.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/browser-package.yml \
            --source-ref refs/heads/main \
            --source-digest "${TARGET_SHA}" \
            --deny-self-hosted-runners
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            import { verifyPackageManifestProvenance } from "./scripts/resolve-hardware-promotion.mjs";
            verifyPackageManifestProvenance({
              manifest: JSON.parse(readFileSync("package-assets/browser-package-manifest.json", "utf8")),
              packageRun: JSON.parse(readFileSync("package-run.json", "utf8"))
            });
          '
          for asset in package-assets/*; do
            cp "${asset}" "release-assets/package-$(basename "${asset}")"
          done

          node -e '
            const value = require(process.argv[1]);
            for (const record of value.recordDigests) {
              process.stdout.write(`${record.artifactId}:${record.workflowRunId}:${record.sha256}\n`);
            }
          ' "${readiness_path}" > record-specs.txt
          while IFS=: read -r artifact_id run_id record_sha; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "evidence-assets/${artifact_id}-metadata.json"
            expected="$(node -p "require('./evidence-assets/${artifact_id}-metadata.json').digest")"
            test "$(node -p "require('./evidence-assets/${artifact_id}-metadata.json').workflow_run.id")" = "${run_id}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "evidence-assets/${artifact_id}.zip"
            test "$(sha256sum "evidence-assets/${artifact_id}.zip" | cut -d ' ' -f 1)" = "${expected#sha256:}"
            mkdir "evidence-assets/${artifact_id}"
            unzip -q "evidence-assets/${artifact_id}.zip" -d "evidence-assets/${artifact_id}"
            source_record="$(find "evidence-assets/${artifact_id}" -name browser-matrix-record-source.json -type f)"
            test -f "${source_record}"
            test "$(find "evidence-assets/${artifact_id}" -name browser-matrix-record-source.json -type f | wc -l)" -eq 1
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "evidence-assets/${artifact_id}-run.json"
            workflow_path="$(node -p "require('./evidence-assets/${artifact_id}-run.json').path")"
            test "$(node -p "require('./evidence-assets/${artifact_id}-run.json').head_sha")" = "${TARGET_SHA}"
            test "$(node -p "require('./evidence-assets/${artifact_id}-run.json').head_branch")" = "main"
            test "$(node -p "require('./evidence-assets/${artifact_id}-run.json').conclusion")" = "success"
            case "${workflow_path}" in
              .github/workflows/browser-hardware.yml|.github/workflows/submit-browser-manual-evidence.yml) ;;
              *) echo "unexpected evidence signer workflow: ${workflow_path}" >&2; exit 1 ;;
            esac
            gh attestation verify "${source_record}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow "milos-agathon/forge3d-web/${workflow_path}" \
              --source-ref refs/heads/main \
              --source-digest "${TARGET_SHA}" \
              --deny-self-hosted-runners
            if test "${workflow_path}" = ".github/workflows/submit-browser-manual-evidence.yml"; then
              for subject in "evidence-assets/${artifact_id}"/*; do
                test -f "${subject}" || continue
                gh attestation verify "${subject}" \
                  --repo milos-agathon/forge3d-web \
                  --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
                  --source-ref refs/heads/main \
                  --source-digest "${TARGET_SHA}" \
                  --deny-self-hosted-runners
              done
            fi
            node --input-type=module --eval '
              import { readFileSync, writeFileSync } from "node:fs";
              import { sha256Hex } from "./scripts/canonical-json.mjs";
              import { finalizeMatrixRecord } from "./scripts/create-browser-matrix-record.mjs";
              const selectedRun = JSON.parse(readFileSync(process.argv[4], "utf8"));
              const final = finalizeMatrixRecord({
                source: JSON.parse(readFileSync(process.argv[1], "utf8")),
                artifactId: Number(process.argv[2]),
                attestation: { verified: true, denySelfHostedRunners: true },
                selectedRun: {
                  id: selectedRun.id,
                  attempt: selectedRun.run_attempt,
                  path: selectedRun.path
                }
              });
              if (sha256Hex(final) !== process.argv[3]) throw new Error("readiness record digest mismatch");
              writeFileSync("verified-record.json", JSON.stringify(final));
            ' \
              "${source_record}" \
              "${artifact_id}" \
              "${record_sha}" \
              "evidence-assets/${artifact_id}-run.json"
            for asset in "evidence-assets/${artifact_id}"/*; do
              test -f "${asset}" || continue
              if test "${workflow_path}" = ".github/workflows/submit-browser-manual-evidence.yml" &&
                [[ "$(basename "${asset}")" =~ ^[1-9][0-9]*$ ]]; then
                continue
              fi
              cp "${asset}" "release-assets/evidence-${artifact_id}-$(basename "${asset}")"
            done
          done < record-specs.txt
          cp "${readiness_path}" release-assets/browser-hardware-release-readiness.json

      - name: Re-fetch exact still-draft manual media by numeric release-asset ID
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          mkdir manual-current
          node --input-type=module --eval '
            import { readFileSync, readdirSync, statSync, writeFileSync } from "node:fs";
            const specifications = readdirSync("evidence-assets")
              .filter((name) => /^[1-9][0-9]*$/.test(name) && statSync(`evidence-assets/${name}`).isDirectory())
              .flatMap((artifactId) => {
                const directory = `evidence-assets/${artifactId}`;
                const names = new Set(readdirSync(directory));
                if (!names.has("manual-evidence.json")) return [];
                if (!names.has("intake-manifest.json")) throw new Error("manual evidence has no attested intake manifest");
                const evidence = JSON.parse(readFileSync(`${directory}/manual-evidence.json`, "utf8"));
                return [{
                  evidenceArtifactId: Number(artifactId),
                  evidencePath: `${directory}/manual-evidence.json`,
                  intakePath: `${directory}/intake-manifest.json`,
                  releaseId: evidence.intakeReleaseId,
                  mediaAssetIds: evidence.media.map((asset) => asset.id)
                }];
              });
            if (specifications.length < 1) throw new Error("supported release has no authenticated manual media");
            if (new Set(specifications.map((value) => value.releaseId)).size !== specifications.length) {
              throw new Error("manual intake release is reused by multiple evidence records");
            }
            writeFileSync("manual-current/specifications.json", JSON.stringify(specifications));
            process.stdout.write(specifications.map((value) => value.releaseId).join("\n"));
          ' > manual-current/release-ids.txt
          while IFS= read -r release_id; do
            test -n "${release_id}" || continue
            gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "manual-current/release-${release_id}.json"
          done < manual-current/release-ids.txt
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const specifications = JSON.parse(readFileSync("manual-current/specifications.json", "utf8"));
            for (const specification of specifications) {
              const release = JSON.parse(readFileSync(`manual-current/release-${specification.releaseId}.json`, "utf8"));
              const manifests = release.assets.filter((asset) => asset.name === "intake-manifest.json");
              if (manifests.length !== 1) throw new Error("manual intake manifest asset is not unique");
              process.stdout.write(`${specification.releaseId}\t${manifests[0].id}\n`);
              for (const assetId of specification.mediaAssetIds) {
                process.stdout.write(`${specification.releaseId}\t${assetId}\n`);
              }
            }
          ' > manual-current/asset-ids.tsv
          while IFS=$'\t' read -r release_id asset_id; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "manual-current/${release_id}-${asset_id}.json"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "manual-current/${release_id}-${asset_id}"
          done < manual-current/asset-ids.tsv
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            import {
              createManualMediaSourcePlan,
              validateManualMediaIntake
            } from "./scripts/release-publication.mjs";
            const specifications = JSON.parse(readFileSync("manual-current/specifications.json", "utf8"));
            const intakes = specifications.map((specification) => {
              const evidence = JSON.parse(readFileSync(specification.evidencePath, "utf8"));
              const intake = JSON.parse(readFileSync(specification.intakePath, "utf8"));
              const release = JSON.parse(readFileSync(`manual-current/release-${specification.releaseId}.json`, "utf8"));
              const manifest = release.assets.filter((asset) => asset.name === "intake-manifest.json");
              const result = validateManualMediaIntake({
                targetSha: process.env.TARGET_SHA,
                evidenceArtifactId: specification.evidenceArtifactId,
                evidence,
                intake,
                intakeRelease: release,
                intakeManifestAssetId: manifest[0].id,
                attestedIntakeBytes: readFileSync(specification.intakePath),
                currentIntakeBytes: readFileSync(`manual-current/${specification.releaseId}-${manifest[0].id}`),
                mediaMetadata: evidence.media.map((asset) =>
                  JSON.parse(readFileSync(`manual-current/${specification.releaseId}-${asset.id}.json`, "utf8"))
                ),
                attestedMediaBytes: Object.fromEntries(evidence.media.map((asset) => [
                  String(asset.id), readFileSync(`evidence-assets/${specification.evidenceArtifactId}/${asset.id}`)
                ])),
                currentMediaBytes: Object.fromEntries(evidence.media.map((asset) => [
                  String(asset.id), readFileSync(`manual-current/${specification.releaseId}-${asset.id}`)
                ]))
              });
              for (const media of result.media) {
                writeFileSync(
                  `release-assets/${media.finalName}`,
                  readFileSync(`manual-current/${specification.releaseId}-${media.assetId}`)
                );
              }
              return result;
            });
            const plan = createManualMediaSourcePlan({ targetSha: process.env.TARGET_SHA, intakes });
            writeFileSync("release-assets/manual-media-sources.json", `${plan.canonical}\n`);
          '

      - name: Resolve implementation actors and create closed preflight
        id: preflight
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          READINESS_RUN_ID: ${{ inputs.readinessRunId }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-release-publication-trust.outputs.observation_content_sha256 }}
        run: |
          node scripts/resolve-implementation-actors.mjs \
            --target-sha "${TARGET_SHA}" \
            --output implementation-actors.json
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            import {
              createBrowserReleaseCandidate,
              createPublicationPreflight
            } from "./scripts/release-publication.mjs";
            import { sha256Hex } from "./scripts/canonical-json.mjs";
            const readinessPath = "release-assets/browser-hardware-release-readiness.json";
            const readiness = JSON.parse(readFileSync(readinessPath, "utf8"));
            const assets = readdirSync("release-assets").map((name, index) => ({
              sourceId: index + 1,
              name,
              sha256: createHash("sha256").update(readFileSync(`release-assets/${name}`)).digest("hex")
            }));
            const mediaPlan = JSON.parse(readFileSync("release-assets/manual-media-sources.json", "utf8"));
            const releaseManifest = createBrowserReleaseCandidate({
              targetSha: process.env.TARGET_SHA,
              tag: process.env.RELEASE_TAG,
              readiness: {
                runId: Number(process.env.READINESS_RUN_ID),
                sha256: createHash("sha256").update(readFileSync(readinessPath)).digest("hex")
              },
              assets,
              manualMediaPlanSha256: sha256Hex(mediaPlan)
            });
            writeFileSync("release-assets/browser-release-manifest.json", releaseManifest.canonical);
            assets.push({
              sourceId: assets.length + 1,
              name: "browser-release-manifest.json",
              sha256: createHash("sha256").update(readFileSync("release-assets/browser-release-manifest.json")).digest("hex")
            });
            const readinessArtifact = JSON.parse(readFileSync("readiness-artifact.json", "utf8"));
            const result = createPublicationPreflight({
              mode: "supported-release",
              supportClaim: true,
              targetSha: process.env.TARGET_SHA,
              tag: process.env.RELEASE_TAG,
              readiness: {
                runId: Number(process.env.READINESS_RUN_ID),
                artifactId: readinessArtifact.id,
                sha256: releaseManifest.record.readiness.sha256,
                status: readiness.status
              },
              assets,
              observation: {
                artifactId: Number(process.env.OBSERVATION_ARTIFACT_ID),
                artifactName: process.env.OBSERVATION_ARTIFACT_NAME,
                artifactDigest: `sha256:${process.env.OBSERVATION_ARTIFACT_DIGEST}`,
                contentSha256: process.env.OBSERVATION_CONTENT_SHA256
              },
              run: {
                id: Number(process.env.GITHUB_RUN_ID),
                attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                workflow: ".github/workflows/publish-web-release.yml"
              },
              workflowSha: process.env.GITHUB_WORKFLOW_SHA,
              publisher: { actor: process.env.GITHUB_ACTOR, job: "publish-release" },
              implementationActors: JSON.parse(readFileSync("implementation-actors.json", "utf8")).actors
            });
            writeFileSync("release-publication-preflight.json", result.canonical);
            writeFileSync(process.env.GITHUB_OUTPUT, `preflight-sha256=${result.sha256}\n`, { flag: "a" });
          '

          mkdir -p \
            publication-validator/scripts \
            publication-validator/tests/browser \
            publication-validator/tests/infrastructure
          cp scripts/release-publication.mjs scripts/canonical-json.mjs publication-validator/scripts/
          cp tests/browser/json-schema-validator.mjs publication-validator/tests/browser/
          cp \
            tests/infrastructure/browser-release-manifest.schema.json \
            tests/infrastructure/browser-release-publication-record.schema.json \
            tests/infrastructure/manual-evidence.schema.json \
            tests/infrastructure/manual-evidence-intake.schema.json \
            tests/infrastructure/manual-media-sources.schema.json \
            publication-validator/tests/infrastructure/

      - name: Attest preflight, publisher validator, and every exact release asset
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            crates/forge3d-web/release-publication-preflight.json
            crates/forge3d-web/release-assets/*
            crates/forge3d-web/publication-validator/scripts/*
            crates/forge3d-web/publication-validator/tests/browser/*
            crates/forge3d-web/publication-validator/tests/infrastructure/*

      - name: Upload preflight and exact release assets
        id: upload-preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crates/forge3d-web/release-publication-preflight.json
            crates/forge3d-web/release-assets/
            crates/forge3d-web/publication-validator/
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  publish-release:
    name: Web Release / Publish Immutable Evidence
    needs:
      - observe-release-publication-trust
      - validate-release-candidate
    runs-on: ubuntu-latest
    environment: forge3d-web-release
    permissions:
      actions: read
      attestations: read
      contents: write
    outputs:
      publication_artifact_id: ${{ steps.upload-publication.outputs.artifact-id }}
      publication_artifact_digest: ${{ steps.upload-publication.outputs.artifact-digest }}

    steps:
      - name: Download and verify exact preflight without source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -d .git
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.validate-release-candidate.outputs.preflight_artifact_id }}/zip" > preflight.zip
          expected="${{ needs.validate-release-candidate.outputs.preflight_artifact_digest }}"
          test "$(sha256sum preflight.zip | cut -d ' ' -f 1)" = "${expected#sha256:}"
          mkdir preflight
          unzip -q preflight.zip -d preflight
          test -f preflight/release-publication-preflight.json
          gh attestation verify preflight/release-publication-preflight.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-web-release.yml \
            --source-ref refs/heads/main \
            --source-digest "${{ github.workflow_sha }}" \
            --deny-self-hosted-runners
          while IFS= read -r subject; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-web-release.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done < <(find preflight/publication-validator -type f | sort)

      - name: Reapply exact observation and preflight handoffs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREFLIGHT_SHA256: ${{ needs.validate-release-candidate.outputs.preflight_sha256 }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-release-publication-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-release-publication-trust.outputs.observation_content_sha256 }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${OBSERVATION_ARTIFACT_ID}/zip" > observation.zip
          test "$(sha256sum observation.zip | cut -d ' ' -f 1)" = "${OBSERVATION_ARTIFACT_DIGEST#sha256:}"
          mkdir observation
          unzip -q observation.zip -d observation
          gh attestation verify observation/repository-trust-observation.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-web-release.yml \
            --source-ref refs/heads/main \
            --source-digest "${{ github.workflow_sha }}" \
            --deny-self-hosted-runners
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const observationBytes = readFileSync("observation/repository-trust-observation.json");
            const observation = JSON.parse(observationBytes);
            const preflightBytes = readFileSync("preflight/release-publication-preflight.json");
            const preflight = JSON.parse(preflightBytes);
            if (
              createHash("sha256").update(observationBytes).digest("hex") !== process.env.OBSERVATION_CONTENT_SHA256 ||
              observation.operation !== "publish-web-release" ||
              observation.targetSha !== process.env.TARGET_SHA ||
              !observation.consumers.some((value) =>
                value.job === "publish-release" &&
                value.environment === "forge3d-web-release"
              ) ||
              createHash("sha256").update(preflightBytes).digest("hex") !== process.env.PREFLIGHT_SHA256 ||
              preflight.targetSha !== process.env.TARGET_SHA ||
              preflight.tag !== process.env.RELEASE_TAG ||
              preflight.publisher.job !== "publish-release" ||
              preflight.publisher.environment !== "forge3d-web-release" ||
              new Date(preflight.expiresAt) <= new Date()
            ) throw new Error("publisher handoff mismatch or expiry");
          '

      - name: Require independent approval and unchanged immutability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > approvals.json
          gh api "/repos/${GITHUB_REPOSITORY}" > repository-settings.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const approvals = JSON.parse(readFileSync("approvals.json", "utf8"))
              .filter((value) => value.state === "approved");
            const settings = JSON.parse(readFileSync("repository-settings.json", "utf8"));
            if (
              !(settings.immutable_releases === true || settings.immutable_releases?.enabled === true) ||
              preflight.implementationActors.includes(process.env.GITHUB_ACTOR) ||
              approvals.length < 1 ||
              approvals.some((value) =>
                value.user.login === process.env.GITHUB_ACTOR ||
                preflight.implementationActors.includes(value.user.login)
              )
            ) throw new Error("publisher identity, approval, or immutable setting failed");
          '

      - name: Re-fetch and re-attest exact manual bytes immediately before assembly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          mkdir publisher-intakes
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync("preflight/release-assets/manual-media-sources.json", "utf8"));
            for (const intake of plan.intakes) process.stdout.write(`${intake.releaseId}\n`);
          ' > publisher-intakes/release-ids.txt
          while IFS= read -r release_id; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "publisher-intakes/release-${release_id}.json"
          done < publisher-intakes/release-ids.txt
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync("preflight/release-assets/manual-media-sources.json", "utf8"));
            for (const intake of plan.intakes) {
              process.stdout.write(`${intake.releaseId}\t${intake.intakeManifest.assetId}\tintake-manifest\n`);
              for (const media of intake.media) {
                process.stdout.write(`${intake.releaseId}\t${media.assetId}\t${media.finalName}\n`);
              }
            }
          ' > publisher-intakes/assets.tsv
          while IFS=$'\t' read -r release_id asset_id destination; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "publisher-intakes/${release_id}-${asset_id}.json"
            if test "${destination}" = "intake-manifest"; then
              gh api -H "Accept: application/octet-stream" \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "publisher-intakes/${release_id}-intake-manifest.json"
            else
              gh api -H "Accept: application/octet-stream" \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "preflight/release-assets/${destination}"
            fi
          done < publisher-intakes/assets.tsv
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync } from "node:fs";
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const plan = JSON.parse(readFileSync("preflight/release-assets/manual-media-sources.json", "utf8"));
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            for (const intake of plan.intakes) {
              const release = JSON.parse(readFileSync(`publisher-intakes/release-${intake.releaseId}.json`, "utf8"));
              const expectedIds = [intake.intakeManifest.assetId, ...intake.media.map((asset) => asset.assetId)]
                .sort((left, right) => left - right);
              const actualIds = release.assets.map((asset) => asset.id).sort((left, right) => left - right);
              const intakeBytes = readFileSync(`publisher-intakes/${intake.releaseId}-intake-manifest.json`);
              const intakeRecord = JSON.parse(intakeBytes);
              const manifestAsset = release.assets.find(
                (asset) => asset.id === intake.intakeManifest.assetId
              );
              const manifestMetadata = JSON.parse(readFileSync(
                `publisher-intakes/${intake.releaseId}-${intake.intakeManifest.assetId}.json`,
                "utf8"
              ));
              if (
                release.id !== intake.releaseId ||
                release.tag_name !== intake.tagName ||
                release.target_commitish !== process.env.TARGET_SHA ||
                release.draft !== true ||
                release.prerelease !== false ||
                intakeRecord.trustedSha !== process.env.TARGET_SHA ||
                `manual-evidence-intake-${intakeRecord.prepareRun.id}` !== intake.tagName ||
                digest(intakeBytes) !== intake.intakeManifest.sha256 ||
                manifestMetadata.id !== intake.intakeManifest.assetId ||
                manifestMetadata.name !== "intake-manifest.json" ||
                manifestMetadata.digest !== `sha256:${intake.intakeManifest.sha256}` ||
                manifestMetadata.size !== intakeBytes.length ||
                manifestAsset?.name !== manifestMetadata.name ||
                manifestAsset?.digest !== manifestMetadata.digest ||
                manifestAsset?.size !== manifestMetadata.size ||
                expectedIds.length !== actualIds.length ||
                expectedIds.some((id, index) => id !== actualIds[index])
              ) throw new Error(`manual intake changed before publication: ${intake.releaseId}`);
              for (const expected of intake.media) {
                const releaseAsset = release.assets.find((asset) => asset.id === expected.assetId);
                const metadata = JSON.parse(readFileSync(`publisher-intakes/${intake.releaseId}-${expected.assetId}.json`, "utf8"));
                const bytes = readFileSync(`preflight/release-assets/${expected.finalName}`);
                if (
                  metadata.id !== expected.assetId ||
                  metadata.name !== expected.originalName ||
                  metadata.uploader?.login !== expected.uploader ||
                  metadata.size !== expected.size ||
                  metadata.content_type !== expected.mimeType ||
                  metadata.created_at !== expected.createdAt ||
                  metadata.digest !== `sha256:${expected.apiSha256}` ||
                  releaseAsset?.name !== metadata.name ||
                  releaseAsset?.uploader?.login !== metadata.uploader.login ||
                  releaseAsset?.size !== metadata.size ||
                  releaseAsset?.content_type !== metadata.content_type ||
                  releaseAsset?.created_at !== metadata.created_at ||
                  releaseAsset?.digest !== metadata.digest ||
                  bytes.length !== expected.size ||
                  digest(bytes) !== expected.sha256 ||
                  expected.apiSha256 !== expected.sha256
                ) throw new Error(`manual media changed before publication: ${expected.assetId}`);
              }
            }
            const expectedNames = preflight.assets.map((asset) => asset.name).sort();
            const actualNames = readdirSync("preflight/release-assets").sort();
            if (
              expectedNames.length !== actualNames.length ||
              expectedNames.some((name, index) => name !== actualNames[index])
            ) throw new Error("release asset inventory changed after preflight");
            for (const asset of preflight.assets) {
              if (digest(readFileSync(`preflight/release-assets/${asset.name}`)) !== asset.sha256) {
                throw new Error(`re-fetched release asset digest mismatch: ${asset.name}`);
              }
            }
          '
          for subject in preflight/release-assets/*; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-web-release.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done

      - name: Create draft, byte-verify closed assets, and publish exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module --eval '
            import { assertGitHubResourceAbsent } from "./preflight/publication-validator/scripts/release-publication.mjs";
            for (const resourcePath of [
              `releases/tags/${process.env.RELEASE_TAG}`,
              `git/ref/tags/${process.env.RELEASE_TAG}`
            ]) {
              await assertGitHubResourceAbsent({
                apiBase: process.env.GITHUB_API_URL,
                repository: process.env.GITHUB_REPOSITORY,
                resourcePath,
                token: process.env.GH_TOKEN
              });
            }
          '
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "Forge3D Web ${RELEASE_TAG}" \
            --notes "Exact-head browser support evidence and package artifacts." \
            --draft
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > draft-release.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("draft-release.json", "utf8"));
            if (
              release.tag_name !== process.env.RELEASE_TAG ||
              release.target_commitish !== process.env.TARGET_SHA ||
              release.draft !== true ||
              release.prerelease !== false
            ) throw new Error("created draft release identity is invalid");
          '
          gh release upload "${RELEASE_TAG}" preflight/release-assets/* --repo "${GITHUB_REPOSITORY}"
          mkdir draft-download
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir draft-download
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync } from "node:fs";
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const expected = preflight.assets.map((asset) => asset.name).sort();
            const actual = readdirSync("draft-download").sort();
            if (
              expected.length !== actual.length ||
              expected.some((name, index) => name !== actual[index])
            ) throw new Error("draft release asset inventory is not closed");
            for (const asset of preflight.assets) {
              const digest = createHash("sha256").update(readFileSync(`draft-download/${asset.name}`)).digest("hex");
              if (digest !== asset.sha256) throw new Error(`draft asset digest mismatch: ${asset.name}`);
            }
          '
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Retain exact CLI JSON and verify immutable published bytes and API digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p publication-proof/asset-verification published-download
          gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --format json > publication-proof/release-verify.json
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > publication-proof/release.json
          published_release_id="$(node -p "require('./publication-proof/release.json').id")"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${published_release_id}/assets?per_page=100" \
            > publication-proof/release-assets-pages.json
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir published-download
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const map = preflight.assets
              .map((asset, index) => ({
                name: asset.name,
                path: `publication-proof/asset-verification/${String(index + 1).padStart(4, "0")}.json`
              }))
              .sort((left, right) => left.name.localeCompare(right.name));
            writeFileSync("publication-proof/asset-verification-map.json", JSON.stringify(map));
            for (const entry of map) {
              process.stdout.write(`${entry.name}\t${entry.path}\n`);
            }
          ' > publication-proof/asset-verification.tsv
          while IFS=$'\t' read -r asset_name proof_path; do
            gh release verify-asset "${RELEASE_TAG}" "published-download/${asset_name}" --repo "${GITHUB_REPOSITORY}" --format json > "${proof_path}"
          done < publication-proof/asset-verification.tsv
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const release = JSON.parse(readFileSync("publication-proof/release.json", "utf8"));
            const releaseAssets = JSON.parse(readFileSync(
              "publication-proof/release-assets-pages.json", "utf8"
            )).flat();
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const expectedNames = preflight.assets.map((asset) => asset.name).sort();
            const actualNames = releaseAssets.map((asset) => asset.name).sort();
            const downloadedNames = readdirSync("published-download").sort();
            if (
              release.tag_name !== process.env.RELEASE_TAG ||
              release.target_commitish !== process.env.TARGET_SHA ||
              release.draft !== false ||
              release.prerelease !== false ||
              release.immutable !== true ||
              !release.published_at ||
              expectedNames.length !== actualNames.length ||
              expectedNames.some((name, index) => name !== actualNames[index]) ||
              expectedNames.length !== downloadedNames.length ||
              expectedNames.some((name, index) => name !== downloadedNames[index])
            ) throw new Error("published release identity, immutability, or asset inventory is invalid");
            const assets = preflight.assets.map((expected) => {
              const actual = releaseAssets.find((asset) => asset.name === expected.name);
              const bytes = readFileSync(`published-download/${expected.name}`);
              const sha256 = digest(bytes);
              if (
                actual?.digest !== `sha256:${expected.sha256}` ||
                actual?.size !== bytes.length ||
                sha256 !== expected.sha256
              ) throw new Error(`published asset API/byte digest mismatch: ${expected.name}`);
              return {
                id: actual.id,
                name: actual.name,
                size: actual.size,
                apiDigest: actual.digest,
                sha256
              };
            });
            JSON.parse(readFileSync("publication-proof/release-verify.json", "utf8"));
            const proofMap = JSON.parse(readFileSync("publication-proof/asset-verification-map.json", "utf8"));
            for (const proof of proofMap) JSON.parse(readFileSync(proof.path, "utf8"));
            writeFileSync("publication-proof/published-assets.json", JSON.stringify(assets));
            writeFileSync("publication-proof/verified-at.txt", new Date().toISOString());
          '

      - name: Delete exact manual intakes only after every final verification succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync("preflight/release-assets/manual-media-sources.json", "utf8"));
            for (const intake of plan.intakes) {
              process.stdout.write(`${intake.releaseId}\t${intake.tagName}\n`);
            }
          ' > publication-proof/intakes.tsv
          : > publication-proof/intake-deletions.jsonl
          while IFS=$'\t' read -r intake_id intake_tag; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" > publication-proof/intake-before-delete.json
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const release = JSON.parse(readFileSync("publication-proof/intake-before-delete.json", "utf8"));
              if (
                release.id !== Number(process.argv[1]) ||
                release.tag_name !== process.argv[2] ||
                release.draft !== true
              ) throw new Error("manual intake identity changed before deletion");
            ' "${intake_id}" "${intake_tag}"
            gh release delete "${intake_tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            node --input-type=module --eval '
              import { assertGitHubResourceAbsent } from "./preflight/publication-validator/scripts/release-publication.mjs";
              for (const resourcePath of [
                `releases/${process.argv[1]}`,
                `git/ref/tags/${process.argv[2]}`
              ]) {
                await assertGitHubResourceAbsent({
                  apiBase: process.env.GITHUB_API_URL,
                  repository: process.env.GITHUB_REPOSITORY,
                  resourcePath,
                  token: process.env.GH_TOKEN
                });
              }
            ' "${intake_id}" "${intake_tag}"
            node --input-type=module --eval '
              process.stdout.write(`${JSON.stringify({
                releaseId: Number(process.argv[1]),
                tagName: process.argv[2],
                deletedAfterVerification: true,
                deletedAt: new Date().toISOString()
              })}\n`);
            ' "${intake_id}" "${intake_tag}" >> publication-proof/intake-deletions.jsonl
          done < publication-proof/intakes.tsv
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const lines = readFileSync("publication-proof/intake-deletions.jsonl", "utf8").trim().split("\n");
            writeFileSync("publication-proof/intake-deletions.json", JSON.stringify(lines.map((line) => JSON.parse(line))));
          '

      - name: Create checked-schema post-publication record without release mutation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, writeFileSync } from "node:fs";
            const candidateBytes = readFileSync("preflight/release-assets/browser-release-manifest.json");
            const proofMap = JSON.parse(readFileSync("publication-proof/asset-verification-map.json", "utf8"));
            writeFileSync("publication-record-input.json", JSON.stringify({
              candidate: JSON.parse(candidateBytes),
              candidateSha256: createHash("sha256").update(candidateBytes).digest("hex"),
              manualMediaPlan: JSON.parse(readFileSync("preflight/release-assets/manual-media-sources.json", "utf8")),
              publicationRun: {
                id: Number(process.env.GITHUB_RUN_ID),
                attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                workflowPath: ".github/workflows/publish-web-release.yml"
              },
              release: JSON.parse(readFileSync("publication-proof/release.json", "utf8")),
              assets: JSON.parse(readFileSync("publication-proof/published-assets.json", "utf8")),
              releaseVerification: { path: "publication-proof/release-verify.json" },
              assetVerifications: proofMap.map((proof) => ({ name: proof.name, path: proof.path })),
              intakeDeletions: JSON.parse(readFileSync("publication-proof/intake-deletions.json", "utf8")),
              verifiedAt: readFileSync("publication-proof/verified-at.txt", "utf8").trim()
            }));
          '
          node preflight/publication-validator/scripts/release-publication.mjs \
            publication-record-input.json \
            create-publication-record \
            release-publication-record.json

      - name: Retain post-publication verification
        id: upload-publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-publication-record.json
            publication-proof/
            preflight/publication-validator/tests/infrastructure/browser-release-publication-record.schema.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  attest-postpublication-record:
    name: Web Release / Attest Postpublication Record
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download exact postpublication artifact without source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.publish-release.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.publish-release.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: web-release-publication-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test ! -d .git
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > publication-artifact.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const artifact = JSON.parse(readFileSync("publication-artifact.json", "utf8"));
            if (
              artifact.id !== Number(process.env.ARTIFACT_ID) ||
              artifact.name !== process.env.ARTIFACT_NAME ||
              artifact.digest !== process.env.ARTIFACT_DIGEST ||
              artifact.expired === true ||
              artifact.workflow_run?.id !== Number(process.env.GITHUB_RUN_ID)
            ) throw new Error("postpublication artifact identity mismatch");
          '
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > publication.zip
          test "$(sha256sum publication.zip | cut -d ' ' -f 1)" = "${ARTIFACT_DIGEST#sha256:}"
          unzip -Z1 publication.zip > publication-entries.txt
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const entries = readFileSync("publication-entries.txt", "utf8").trim().split("\n");
            if (
              entries.length < 2 ||
              new Set(entries).size !== entries.length ||
              entries.some((entry) => entry.startsWith("/") || entry.split("/").includes(".."))
            ) throw new Error("postpublication artifact archive inventory is unsafe");
          '
          mkdir verified-publication
          unzip -q publication.zip -d verified-publication
          test -z "$(find verified-publication -type l -print -quit)"
          test "$(find verified-publication -name release-publication-record.json -type f | wc -l)" -eq 1
          test -f verified-publication/release-publication-record.json
          test -f verified-publication/preflight/publication-validator/tests/infrastructure/browser-release-publication-record.schema.json

      - name: Verify exact schema and canonical record content without repository source execution
        shell: bash
        env:
          SCHEMA_SHA256: 04d88be1949207c17d2dba22a4d6fe7582f29b2f5d5b089bacd54994ef9c9d1a
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          schema_path=verified-publication/preflight/publication-validator/tests/infrastructure/browser-release-publication-record.schema.json
          test "$(sha256sum "${schema_path}" | cut -d ' ' -f 1)" = "${SCHEMA_SHA256}"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const recordPath = "verified-publication/release-publication-record.json";
            const schemaPath = "verified-publication/preflight/publication-validator/tests/infrastructure/browser-release-publication-record.schema.json";
            const bytes = readFileSync(recordPath, "utf8");
            const record = JSON.parse(bytes);
            const schema = JSON.parse(readFileSync(schemaPath, "utf8"));
            const object = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            const resolveReference = (reference) => reference.slice(2).split("/").reduce(
              (value, encoded) => value[encoded.replaceAll("~1", "/").replaceAll("~0", "~")], schema
            );
            const validate = (value, rule, path = "$") => {
              if (rule.$ref) return validate(value, resolveReference(rule.$ref), path);
              if (rule.const !== undefined && !Object.is(value, rule.const)) throw new Error(`${path}: const mismatch`);
              const types = rule.type === undefined ? [] : Array.isArray(rule.type) ? rule.type : [rule.type];
              const matches = (type) => type === "object" ? object(value) : type === "array" ? Array.isArray(value) :
                type === "integer" ? Number.isInteger(value) : type === "number" ? typeof value === "number" && Number.isFinite(value) :
                type === "null" ? value === null : typeof value === type;
              if (types.length && !types.some(matches)) throw new Error(`${path}: type mismatch`);
              if (typeof value === "string") {
                if (rule.minLength !== undefined && value.length < rule.minLength) throw new Error(`${path}: minLength`);
                if (rule.pattern !== undefined && !new RegExp(rule.pattern, "u").test(value)) throw new Error(`${path}: pattern`);
              }
              if (typeof value === "number" && rule.minimum !== undefined && value < rule.minimum) throw new Error(`${path}: minimum`);
              if (Array.isArray(value)) {
                if (rule.minItems !== undefined && value.length < rule.minItems) throw new Error(`${path}: minItems`);
                for (let index = 0; index < value.length; index += 1) validate(value[index], rule.items, `${path}[${index}]`);
              } else if (object(value)) {
                for (const key of rule.required ?? []) if (!Object.hasOwn(value, key)) throw new Error(`${path}.${key}: required`);
                for (const [key, child] of Object.entries(value)) {
                  if (rule.properties?.[key]) validate(child, rule.properties[key], `${path}.${key}`);
                  else if (rule.additionalProperties === false) throw new Error(`${path}.${key}: additional property`);
                }
              }
            };
            const canonical = (value) => {
              if (value === null || typeof value !== "object") return JSON.stringify(value);
              if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
            };
            validate(record, schema);
            if (
              bytes !== `${canonical(record)}\n` ||
              record.targetSha !== process.env.TARGET_SHA ||
              record.tag !== process.env.RELEASE_TAG ||
              record.publicationRun.id !== Number(process.env.GITHUB_RUN_ID) ||
              record.publicationRun.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              record.publicationRun.workflowPath !== ".github/workflows/publish-web-release.yml"
            ) throw new Error("postpublication record content or run binding mismatch");
          '

      - name: Attest exact schema-checked postpublication record
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: verified-publication/release-publication-record.json
