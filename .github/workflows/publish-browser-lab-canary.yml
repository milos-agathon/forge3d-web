                --repo milos-agathon/forge3d-web \
                --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
                --source-ref refs/heads/main \
                --source-digest "${GITHUB_SHA}" \
                --deny-self-hosted-runners
            fi
          done < publisher-intake/assets.tsv
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" \
            > publisher-intake/release.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "publisher-intake/verification-input.json";
            const input = JSON.parse(readFileSync(path, "utf8"));
            input.release = JSON.parse(readFileSync("publisher-intake/release.json", "utf8"));
            writeFileSync(path, JSON.stringify(input));
          '
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, writeFileSync } from "node:fs";
            const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const input = JSON.parse(readFileSync("publisher-intake/verification-input.json", "utf8"));
            const manifestBytes = readFileSync(input.intakeManifest.path);
            const manifest = JSON.parse(manifestBytes);
            const expectedAssets = [input.binding.intakeManifest, ...input.binding.media]
              .sort((left, right) => left.id - right.id);
            const releaseAssets = [...(input.release.assets ?? [])]
              .sort((left, right) => left.id - right.id);
            const manifestReleaseAsset = input.release.assets?.find(
              (asset) => asset.id === input.binding.intakeManifest.id
            );
            if (
              !/^[0-9a-f]{40}$/u.test(input.candidateSha ?? "") ||
              input.binding.schemaVersion !== 1 ||
              input.binding.recordType !== "lab-canary-manual-intake-binding" ||
              input.binding.supportClaim !== false ||
              input.binding.candidateSha !== input.candidateSha ||
              input.release.id !== input.binding.release.id ||
              input.release.tag_name !== input.binding.release.tagName ||
              input.release.target_commitish !== input.candidateSha ||
              input.release.draft !== true || input.release.prerelease !== false ||
              expectedAssets.length !== releaseAssets.length ||
              expectedAssets.some((asset, index) => asset.id !== releaseAssets[index].id) ||
              input.intakeManifestMetadata.id !== input.binding.intakeManifest.id ||
              input.intakeManifestMetadata.name !== input.binding.intakeManifest.name ||
              input.intakeManifestMetadata.size !== input.binding.intakeManifest.size ||
              input.intakeManifestMetadata.digest !== input.binding.intakeManifest.apiDigest ||
              manifestReleaseAsset?.name !== input.intakeManifestMetadata.name ||
              manifestReleaseAsset?.size !== input.intakeManifestMetadata.size ||
              manifestReleaseAsset?.digest !== input.intakeManifestMetadata.digest ||
              manifestBytes.length !== input.binding.intakeManifest.size ||
              hash(manifestBytes) !== input.binding.intakeManifest.sha256 ||
              manifest.trustedSha !== input.candidateSha || manifest.supportClaim !== false ||
              `manual-evidence-intake-${manifest.prepareRun?.id}` !== input.binding.release.tagName ||
              !Array.isArray(input.media) || !Array.isArray(input.retainedMedia) ||
              input.media.length !== input.binding.media.length
            ) throw new Error("manual canary intake identity or manifest bytes changed");
            const media = new Map(input.media.map((asset) => [asset.metadata.id, asset]));
            const retained = new Map(input.retainedMedia.map((asset) => [asset.name, asset]));
            if (
              media.size !== input.binding.media.length ||
              input.retainedMedia.length !== input.binding.media.length ||
              retained.size !== input.binding.media.length
            ) throw new Error("manual canary media inventory changed");
            for (const expected of input.binding.media) {
              const actual = media.get(expected.id);
              const retainedAsset = retained.get(expected.releaseName);
              const releaseAsset = input.release.assets.find((asset) => asset.id === expected.id);
              if (!actual || !retainedAsset || !releaseAsset) throw new Error(`manual canary media is missing: ${expected.id}`);
              const bytes = readFileSync(actual.bytes.path);
              const retainedBytes = readFileSync(retainedAsset.bytes.path);
              if (
                expected.releaseName !== `manual-media-${expected.id}` ||
                retainedAsset.name !== expected.releaseName ||
                actual.metadata.id !== expected.id || actual.metadata.name !== expected.name ||
                actual.metadata.uploader?.login !== expected.uploader ||
                actual.metadata.size !== expected.size ||
                actual.metadata.content_type !== expected.mimeType ||
                actual.metadata.created_at !== expected.createdAt ||
                actual.metadata.digest !== expected.apiDigest ||
                releaseAsset.name !== actual.metadata.name ||
                releaseAsset.uploader?.login !== actual.metadata.uploader.login ||
                releaseAsset.size !== actual.metadata.size ||
                releaseAsset.content_type !== actual.metadata.content_type ||
                releaseAsset.created_at !== actual.metadata.created_at ||
                releaseAsset.digest !== actual.metadata.digest ||
                bytes.length !== expected.size || hash(bytes) !== expected.sha256 ||
                retainedBytes.length !== expected.size || hash(retainedBytes) !== expected.sha256 ||
                expected.apiDigest !== `sha256:${expected.sha256}`
              ) throw new Error(`manual canary media bytes or metadata changed: ${expected.id}`);
            }
            writeFileSync("publisher-intake/verification.json", "{\"verified\":true}\n", { mode: 0o600 });
          '

      - name: Create draft, byte-verify closed assets, and publish exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-lab-canary.outputs.release_tag }}
        run: |
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const requireFreshHandoffs = () => {
              const observation = JSON.parse(readFileSync("observation/repository-trust-observation.json", "utf8"));
              const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
              const now = Date.now();
              const observedAt = Date.parse(observation.observedAt);
              const observationExpiresAt = Date.parse(observation.expiresAt);
              const preflightCreatedAt = Date.parse(preflight.createdAt);
              const preflightExpiresAt = Date.parse(preflight.expiresAt);
              if (
                observation.repositorySettings?.immutableReleases?.enabled !== true ||
                typeof observation.repositorySettings.immutableReleases.enforcedByOwner !== "boolean" ||
                !Number.isFinite(observedAt) || !Number.isFinite(observationExpiresAt) ||
                observationExpiresAt <= observedAt || observationExpiresAt - observedAt > 30 * 60 * 1000 ||
                now < observedAt || now >= observationExpiresAt ||
                !Number.isFinite(preflightCreatedAt) || !Number.isFinite(preflightExpiresAt) ||
                preflightExpiresAt <= preflightCreatedAt || preflightExpiresAt - preflightCreatedAt > 30 * 60 * 1000 ||
                now < preflightCreatedAt || now >= preflightExpiresAt
              ) throw new Error("publication handoff expired before mutation");
            };
            const requireAbsent = async (path) => {
              let response;
              try {
                response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {
                  headers: {
                    Accept: "application/vnd.github+json",
                    Authorization: `Bearer ${process.env.GH_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28"
                  }
                });
              } catch {
                throw new Error("GitHub resource absence could not be proven");
              }
              if (response.status !== 404) throw new Error(`GitHub resource absence is not proven: HTTP ${response.status}`);
            };
            requireFreshHandoffs();
            const tag = encodeURIComponent(process.env.RELEASE_TAG);
            await requireAbsent(`releases/tags/${tag}`);
            await requireAbsent(`git/ref/tags/${tag}`);
          '
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const observation = JSON.parse(readFileSync("observation/repository-trust-observation.json", "utf8"));
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const now = Date.now();
            const observedAt = Date.parse(observation.observedAt);
            const observationExpiresAt = Date.parse(observation.expiresAt);
            const preflightCreatedAt = Date.parse(preflight.createdAt);
            const preflightExpiresAt = Date.parse(preflight.expiresAt);
            if (
              observation.repositorySettings?.immutableReleases?.enabled !== true ||
              typeof observation.repositorySettings.immutableReleases.enforcedByOwner !== "boolean" ||
              !Number.isFinite(observedAt) || !Number.isFinite(observationExpiresAt) ||
              observationExpiresAt <= observedAt || observationExpiresAt - observedAt > 30 * 60 * 1000 ||
              now < observedAt || now >= observationExpiresAt ||
              !Number.isFinite(preflightCreatedAt) || !Number.isFinite(preflightExpiresAt) ||
              preflightExpiresAt <= preflightCreatedAt || preflightExpiresAt - preflightCreatedAt > 30 * 60 * 1000 ||
              now < preflightCreatedAt || now >= preflightExpiresAt
            ) throw new Error("publication handoff expired immediately before mutation");
          '
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Forge3D browser laboratory canary" \
            --notes "Infrastructure-only canary. This release makes no browser support claim." \
            --draft
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > draft-release.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("draft-release.json", "utf8"));
            if (
              release.tag_name !== process.env.RELEASE_TAG ||
              release.target_commitish !== process.env.GITHUB_SHA ||
              release.draft !== true ||
              release.prerelease !== false
            ) throw new Error("created canary draft identity is invalid");
          '
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            preflight/canary-assets/*
          mkdir draft-download
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir draft-download
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync } from "node:fs";
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const expected = preflight.assets.map((asset) => asset.name).sort();
            const actual = readdirSync("draft-download").sort();
            if (
              expected.length !== actual.length ||
              expected.some((name, index) => name !== actual[index])
            ) throw new Error("draft canary asset inventory is not closed");
            for (const asset of preflight.assets) {
              const digest = createHash("sha256").update(readFileSync(`draft-download/${asset.name}`)).digest("hex");
              if (digest !== asset.sha256) throw new Error(`draft asset digest mismatch: ${asset.name}`);
            }
          '
          for subject in draft-download/*; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-browser-lab-canary.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

      - name: Retain CLI JSON and verify fresh immutable API and byte closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-lab-canary.outputs.release_tag }}
        run: |
          mkdir -p \
            publication-proof/asset-api \
            publication-proof/asset-verification \
            published-download
          gh release verify "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format json \
            > publication-proof/release-verify.json
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > publication-proof/release.json
          published_release_id="$(node -p "require('./publication-proof/release.json').id")"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${published_release_id}/assets?per_page=100" \
            > publication-proof/release-assets-pages.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const preflight = JSON.parse(readFileSync(
              "preflight/release-publication-preflight.json", "utf8"
            ));
            const pages = JSON.parse(readFileSync(
              "publication-proof/release-assets-pages.json", "utf8"
            ));
            const assets = pages.flat();
            const rows = preflight.assets
              .map((expected, index) => {
                const actual = assets.filter((asset) => asset.name === expected.name);
                if (actual.length !== 1) throw new Error(`published API asset is not unique: ${expected.name}`);
                return {
                  id: actual[0].id,
                  name: expected.name,
                  apiPath: `publication-proof/asset-api/${String(index + 1).padStart(4, "0")}.json`,
                  proofPath: `publication-proof/asset-verification/${String(index + 1).padStart(4, "0")}.json`
                };
              })
              .sort((left, right) => left.name.localeCompare(right.name));
            writeFileSync("publication-proof/assets-map.json", JSON.stringify(rows));
            for (const row of rows) {
              process.stdout.write(`${row.id}\t${row.name}\t${row.apiPath}\t${row.proofPath}\n`);
            }
          ' > publication-proof/assets.tsv
          while IFS=$'\t' read -r asset_id asset_name api_path proof_path; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${api_path}"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "published-download/${asset_name}"
            gh release verify-asset "${RELEASE_TAG}" \
              "published-download/${asset_name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format json > "${proof_path}"
          done < publication-proof/assets.tsv
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const release = JSON.parse(readFileSync("publication-proof/release.json", "utf8"));
            const pages = JSON.parse(readFileSync(
              "publication-proof/release-assets-pages.json", "utf8"
            ));
            const releaseAssets = pages.flat();
            const preflight = JSON.parse(readFileSync(
              "preflight/release-publication-preflight.json", "utf8"
            ));
            const map = JSON.parse(readFileSync("publication-proof/assets-map.json", "utf8"));
            const expectedNames = preflight.assets.map((asset) => asset.name).sort();
            const apiNames = releaseAssets.map((asset) => asset.name).sort();
            const downloadedNames = readdirSync("published-download").sort();
            if (
              release.tag_name !== process.env.RELEASE_TAG ||
              release.target_commitish !== process.env.GITHUB_SHA ||
              release.draft !== false ||
              release.prerelease !== false ||
              release.immutable !== true ||
              !release.published_at ||
              expectedNames.length !== apiNames.length ||
              expectedNames.some((name, index) => name !== apiNames[index]) ||
              expectedNames.length !== downloadedNames.length ||
              expectedNames.some((name, index) => name !== downloadedNames[index])
            ) throw new Error("published canary identity, immutability, or inventory is invalid");
            const assets = preflight.assets.map((expected) => {
              const actual = releaseAssets.find((asset) => asset.name === expected.name);
              const row = map.find((entry) => entry.name === expected.name);
              const metadata = JSON.parse(readFileSync(row.apiPath, "utf8"));
              const bytes = readFileSync(`published-download/${expected.name}`);
              const sha256 = digest(bytes);
              if (
                metadata.id !== actual.id ||
                metadata.name !== actual.name ||
                metadata.size !== actual.size ||
                metadata.digest !== actual.digest ||
                actual.digest !== `sha256:${expected.sha256}` ||
                actual.size !== bytes.length ||
                sha256 !== expected.sha256
              ) throw new Error(`published canary API/byte digest mismatch: ${expected.name}`);
              JSON.parse(readFileSync(row.proofPath, "utf8"));
              return {
                id: actual.id,
                name: actual.name,
                size: actual.size,
                apiDigest: actual.digest,
                sha256
              };
            });
            JSON.parse(readFileSync("publication-proof/release-verify.json", "utf8"));
            writeFileSync("publication-proof/published-assets.json", JSON.stringify(assets));
            writeFileSync("publication-proof/verified-at.txt", new Date().toISOString());
          '

