          gh attestation verify deletion-intake/intake-manifest \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/prepare-browser-manual-evidence.yml \
            --source-ref refs/heads/main \
            --source-digest "${intake_source_sha}" \
            --deny-self-hosted-runners
          while IFS=$'\t' read -r asset_id destination; do
            if test "${destination}" != "intake-manifest"; then
              gh attestation verify "deletion-intake/${destination}" \
                --repo milos-agathon/forge3d-web \
                --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
                --source-ref refs/heads/main \
                --source-digest "${GITHUB_SHA}" \
                --deny-self-hosted-runners
            fi
          done < deletion-intake/assets.tsv
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" \
            > deletion-intake/release.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "deletion-intake/verification-input.json";
            const input = JSON.parse(readFileSync(path, "utf8"));
            input.release = JSON.parse(readFileSync("deletion-intake/release.json", "utf8"));
            writeFileSync(path, JSON.stringify(input));
          '
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, writeFileSync } from "node:fs";
            const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const input = JSON.parse(readFileSync("deletion-intake/verification-input.json", "utf8"));
            const manifestBytes = readFileSync(input.intakeManifest.path);
            const manifest = JSON.parse(manifestBytes);
            const expectedAssets = [input.binding.intakeManifest, ...input.binding.media]
              .sort((left, right) => left.id - right.id);
            const releaseAssets = [...(input.release.assets ?? [])]
              .sort((left, right) => left.id - right.id);
            const manifestReleaseAsset = input.release.assets?.find(
              (asset) => asset.id === input.binding.intakeManifest.id
            );
            if (
              !/^[0-9a-f]{40}$/u.test(input.candidateSha ?? "") ||
              input.binding.schemaVersion !== 1 ||
              input.binding.recordType !== "lab-canary-manual-intake-binding" ||
              input.binding.supportClaim !== false ||
              input.binding.candidateSha !== input.candidateSha ||
              input.release.id !== input.binding.release.id ||
              input.release.tag_name !== input.binding.release.tagName ||
              input.release.target_commitish !== input.candidateSha ||
              input.release.draft !== true || input.release.prerelease !== false ||
              expectedAssets.length !== releaseAssets.length ||
              expectedAssets.some((asset, index) => asset.id !== releaseAssets[index].id) ||
              input.intakeManifestMetadata.id !== input.binding.intakeManifest.id ||
              input.intakeManifestMetadata.name !== input.binding.intakeManifest.name ||
              input.intakeManifestMetadata.size !== input.binding.intakeManifest.size ||
              input.intakeManifestMetadata.digest !== input.binding.intakeManifest.apiDigest ||
              manifestReleaseAsset?.name !== input.intakeManifestMetadata.name ||
              manifestReleaseAsset?.size !== input.intakeManifestMetadata.size ||
              manifestReleaseAsset?.digest !== input.intakeManifestMetadata.digest ||
              manifestBytes.length !== input.binding.intakeManifest.size ||
              hash(manifestBytes) !== input.binding.intakeManifest.sha256 ||
              manifest.trustedSha !== input.candidateSha || manifest.supportClaim !== false ||
              `manual-evidence-intake-${manifest.prepareRun?.id}` !== input.binding.release.tagName ||
              !Array.isArray(input.media) || !Array.isArray(input.retainedMedia) ||
              input.media.length !== input.binding.media.length
            ) throw new Error("manual canary intake identity or manifest bytes changed");
            const media = new Map(input.media.map((asset) => [asset.metadata.id, asset]));
            const retained = new Map(input.retainedMedia.map((asset) => [asset.name, asset]));
            if (
              media.size !== input.binding.media.length ||
              input.retainedMedia.length !== input.binding.media.length ||
              retained.size !== input.binding.media.length
            ) throw new Error("manual canary media inventory changed");
            for (const expected of input.binding.media) {
              const actual = media.get(expected.id);
              const retainedAsset = retained.get(expected.releaseName);
              const releaseAsset = input.release.assets.find((asset) => asset.id === expected.id);
              if (!actual || !retainedAsset || !releaseAsset) throw new Error(`manual canary media is missing: ${expected.id}`);
              const bytes = readFileSync(actual.bytes.path);
              const retainedBytes = readFileSync(retainedAsset.bytes.path);
              if (
                expected.releaseName !== `manual-media-${expected.id}` ||
                retainedAsset.name !== expected.releaseName ||
                actual.metadata.id !== expected.id || actual.metadata.name !== expected.name ||
                actual.metadata.uploader?.login !== expected.uploader ||
                actual.metadata.size !== expected.size ||
                actual.metadata.content_type !== expected.mimeType ||
                actual.metadata.created_at !== expected.createdAt ||
                actual.metadata.digest !== expected.apiDigest ||
                releaseAsset.name !== actual.metadata.name ||
                releaseAsset.uploader?.login !== actual.metadata.uploader.login ||
                releaseAsset.size !== actual.metadata.size ||
                releaseAsset.content_type !== actual.metadata.content_type ||
                releaseAsset.created_at !== actual.metadata.created_at ||
                releaseAsset.digest !== actual.metadata.digest ||
                bytes.length !== expected.size || hash(bytes) !== expected.sha256 ||
                retainedBytes.length !== expected.size || hash(retainedBytes) !== expected.sha256 ||
                expected.apiDigest !== `sha256:${expected.sha256}`
              ) throw new Error(`manual canary media bytes or metadata changed: ${expected.id}`);
            }
            writeFileSync("deletion-intake/verification.json", "{\"verified\":true}\n", { mode: 0o600 });
          '
          gh release delete "${intake_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes
          INTAKE_ID="${intake_id}" INTAKE_TAG="${intake_tag}" \
            node --input-type=module --eval '
              const requireAbsent = async (path) => {
                let response;
                try {
                  response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {
                    headers: {
                      Accept: "application/vnd.github+json",
                      Authorization: `Bearer ${process.env.GH_TOKEN}`,
                      "X-GitHub-Api-Version": "2022-11-28"
                    }
                  });
                } catch {
                  throw new Error("GitHub resource absence could not be proven");
                }
                if (response.status !== 404) throw new Error(`GitHub resource absence is not proven: HTTP ${response.status}`);
              };
              await requireAbsent(`releases/${encodeURIComponent(process.env.INTAKE_ID)}`);
              await requireAbsent(`git/ref/tags/${encodeURIComponent(process.env.INTAKE_TAG)}`);
            '
          node --input-type=module --eval '
            import { writeFileSync } from "node:fs";
            writeFileSync("publication-proof/intake-deletion.json", JSON.stringify({
              releaseId: Number(process.argv[1]),
              tagName: process.argv[2],
              deletedAfterVerification: true,
              deletedAt: new Date().toISOString()
            }));
          ' "${intake_id}" "${intake_tag}"

      - name: Create checked-schema post-publication record without canary mutation
        shell: bash
        run: |
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const map = JSON.parse(readFileSync("publication-proof/assets-map.json", "utf8"));
            writeFileSync("publication-record-input.json", JSON.stringify({
              candidate: { path: "preflight/canary-assets/browser-lab-canary-manifest.json" },
              preflight: { path: "preflight/release-publication-preflight.json" },
              intakeBinding: { path: "preflight/canary-assets/manual-intake-binding.json" },
              release: JSON.parse(readFileSync("publication-proof/release.json", "utf8")),
              assetPages: { path: "publication-proof/release-assets-pages.json" },
              assets: JSON.parse(readFileSync("publication-proof/published-assets.json", "utf8")),
              releaseVerification: { path: "publication-proof/release-verify.json" },
              assetVerifications: map.map((asset) => ({
                name: asset.name,
                path: asset.proofPath
              })),
              intakeDeletion: JSON.parse(readFileSync(
                "publication-proof/intake-deletion.json", "utf8"
              )),
              verifiedAt: readFileSync("publication-proof/verified-at.txt", "utf8").trim()
            }));
          '
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, writeFileSync } from "node:fs";
            const canonical = (value) => {
              if (value === null || typeof value !== "object") return JSON.stringify(value);
              if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
            };
            const hashBytes = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const hash = (value) => hashBytes(Buffer.from(canonical(value)));
            const document = (value) => {
              const bytes = readFileSync(value.path);
              return { output: JSON.parse(bytes), sha256: hashBytes(bytes) };
            };
            const verification = (value) => {
              const result = document(value);
              if (result.output === null || typeof result.output !== "object" || Array.isArray(result.output) || Object.keys(result.output).length === 0) {
                throw new Error(`verification proof is empty: ${value.path}`);
              }
              return { outputSha256: result.sha256, output: result.output };
            };
            const input = JSON.parse(readFileSync("publication-record-input.json", "utf8"));
            const candidate = document(input.candidate);
            const preflight = document(input.preflight);
            const bindingDocument = document(input.intakeBinding);
            const pagesDocument = document(input.assetPages);
            const binding = bindingDocument.output;
            const releaseProof = verification(input.releaseVerification);
            const assetProofs = input.assetVerifications.map((value) => ({
              name: value.name,
              ...verification(value)
            }));
            const expectedTag = `browser-lab-canary-${candidate.output.labInfrastructureDigest}-${candidate.output.publicationRunId}`;
            const expectedAssets = new Map(
              preflight.output.assets.map((asset) => [asset.name, asset.sha256])
            );
            const pageAssets = pagesDocument.output.flat();
            const expectedNames = [...expectedAssets.keys()].sort();
            const pageNames = pageAssets.map((asset) => asset.name).sort();
            const assetNames = input.assets.map((asset) => asset.name).sort();
            const proofNames = assetProofs.map((value) => value.name).sort();
            const published = new Date(input.release.published_at);
            const verified = new Date(input.verifiedAt);
            const deleted = new Date(input.intakeDeletion.deletedAt);
            const created = new Date();
            if (
              candidate.output.schemaVersion !== 1 ||
              candidate.output.recordType !== "lab-canary-publication-candidate" ||
              candidate.output.supportClaim !== false ||
              candidate.output.intakeDeletionPlannedAfterVerification !== true ||
              candidate.output.tag !== expectedTag ||
              candidate.output.candidateSha !== preflight.output.targetSha ||
              candidate.output.publicationRunId !== preflight.output.run.id ||
              !Number.isInteger(preflight.output.run.attempt) || preflight.output.run.attempt < 1 ||
              preflight.output.workflow !== ".github/workflows/publish-browser-lab-canary.yml" ||
              candidate.output.manualIntakeReleaseId !== binding.release.id ||
              preflight.output.mode !== "laboratory-canary" ||
              preflight.output.supportClaim !== false || preflight.output.tag !== expectedTag ||
              preflight.output.readiness.status !== "LAB_CANARY_PREFLIGHT_READY" ||
              expectedAssets.get("browser-lab-canary-manifest.json") !== candidate.sha256 ||
              expectedAssets.get("manual-intake-binding.json") !== bindingDocument.sha256 ||
              binding.candidateSha !== candidate.output.candidateSha ||
              binding.schemaVersion !== 1 ||
              binding.recordType !== "lab-canary-manual-intake-binding" ||
              binding.supportClaim !== false ||
              binding.release.targetCommitish !== candidate.output.candidateSha ||
              binding.release.draft !== true || binding.release.prerelease !== false ||
              !Array.isArray(binding.media) || binding.media.length < 1 ||
              new Set(binding.media.map((asset) => asset.releaseName)).size !== binding.media.length ||
              binding.media.some((asset) =>
                asset.releaseName !== `manual-media-${asset.id}` ||
                expectedAssets.get(asset.releaseName) !== asset.sha256 ||
                input.assets.find((value) => value.name === asset.releaseName)?.size !== asset.size
              ) ||
              input.release.tag_name !== expectedTag ||
              input.release.target_commitish !== candidate.output.candidateSha ||
              input.release.draft !== false || input.release.prerelease !== false ||
              input.release.immutable !== true ||
              !Number.isInteger(input.release.id) || input.release.id < 1 ||
              !Array.isArray(pagesDocument.output) || pagesDocument.output.length < 1 ||
              pagesDocument.output.some((page, index) =>
                !Array.isArray(page) || page.length < 1 || page.length > 100 ||
                (index < pagesDocument.output.length - 1 && page.length !== 100)
              ) ||
              new Set(pageAssets.map((asset) => asset.id)).size !== pageAssets.length ||
              new Set(pageAssets.map((asset) => asset.name)).size !== pageAssets.length ||
              expectedNames.length !== pageNames.length ||
              expectedNames.some((name, index) => name !== pageNames[index]) ||
              expectedNames.length !== assetNames.length ||
              expectedNames.some((name, index) => name !== assetNames[index]) ||
              expectedNames.length !== proofNames.length ||
              expectedNames.some((name, index) => name !== proofNames[index]) ||
              Number.isNaN(published.getTime()) || Number.isNaN(verified.getTime()) ||
              Number.isNaN(deleted.getTime()) ||
              published > verified || verified > deleted || deleted > created ||
              input.intakeDeletion.releaseId !== binding.release.id ||
              input.intakeDeletion.tagName !== binding.release.tagName ||
              input.intakeDeletion.deletedAfterVerification !== true
            ) throw new Error("laboratory canary post-publication proof is invalid");
            const assets = input.assets.map((asset) => {
              const sha256 = expectedAssets.get(asset.name);
              const apiAsset = pageAssets.find((value) => value.id === asset.id);
              if (
                !Number.isInteger(asset.id) || asset.id < 1 ||
                !Number.isInteger(asset.size) || asset.size < 1 ||
                asset.sha256 !== sha256 || asset.apiDigest !== `sha256:${sha256}` ||
                apiAsset?.name !== asset.name || apiAsset?.size !== asset.size ||
                apiAsset?.digest !== asset.apiDigest
              ) throw new Error(`published canary asset closure failed: ${asset.name}`);
              return { id: asset.id, name: asset.name, size: asset.size, apiDigest: asset.apiDigest, sha256 };
            }).sort((left, right) => left.name.localeCompare(right.name));
            assetProofs.sort((left, right) => left.name.localeCompare(right.name));
            const proofDigests = [
              { name: "release", sha256: releaseProof.outputSha256 },
              ...assetProofs.map((value) => ({ name: value.name, sha256: value.outputSha256 }))
            ];
            const record = {
              schemaVersion: 1,
              recordType: "lab-canary-publication",
              supportClaim: false,
              candidateSha: candidate.output.candidateSha,
              labInfrastructureDigest: candidate.output.labInfrastructureDigest,
              publicationRunId: candidate.output.publicationRunId,
              publicationRun: {
                id: preflight.output.run.id,
                attempt: preflight.output.run.attempt,
                workflowPath: preflight.output.workflow
              },
              tag: expectedTag,
              candidateManifestSha256: candidate.sha256,
              preflightSha256: preflight.sha256,
              release: {
                id: input.release.id,
                tagName: input.release.tag_name,
                targetCommitish: input.release.target_commitish,
                draft: false,
                prerelease: false,
                immutable: true,
                publishedAt: published.toISOString()
              },
              assetApiPagination: {
                requestedPerPage: 100,
                pageCount: pagesDocument.output.length,
                totalAssets: pageAssets.length,
                pagesSha256: pagesDocument.sha256
              },
              assets,
              releaseVerification: releaseProof,
              assetVerifications: assetProofs,
              verificationBundleSha256: hash(proofDigests),
              verifiedAt: verified.toISOString(),
              intake: {
                releaseId: input.intakeDeletion.releaseId,
                tagName: input.intakeDeletion.tagName,
                bindingSha256: bindingDocument.sha256,
                deletedAfterVerification: true,
                deletedAt: deleted.toISOString()
              },
              createdAt: created.toISOString()
            };
            writeFileSync("lab-canary-publication-record.json", `${canonical(record)}\n`, { mode: 0o600 });
          '

      - name: Retain post-publication verification
        id: upload-publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-canary-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab-canary-publication-record.json
            publication-proof/
            preflight/release-publication-preflight.json
            preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  attest-postpublication-record:
    name: Browser Lab Canary / Attest Postpublication Record
    needs: publish-lab-canary
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download exact postpublication artifact without source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.publish-lab-canary.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.publish-lab-canary.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: lab-canary-publication-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          test ! -d .git
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > publication-artifact.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const artifact = JSON.parse(readFileSync("publication-artifact.json", "utf8"));
            if (
              !/^[0-9a-f]{64}$/u.test(process.env.ARTIFACT_DIGEST) ||
              artifact.id !== Number(process.env.ARTIFACT_ID) ||
              artifact.name !== process.env.ARTIFACT_NAME ||
              artifact.digest !== `sha256:${process.env.ARTIFACT_DIGEST}` ||
              artifact.expired !== false ||
              artifact.workflow_run?.id !== Number(process.env.GITHUB_RUN_ID) ||
              artifact.workflow_run?.repository_id !== 1259761852 ||
              artifact.workflow_run?.head_repository_id !== 1259761852 ||
              artifact.workflow_run?.head_branch !== "main" ||
              artifact.workflow_run?.head_sha !== process.env.EXPECTED_HEAD_SHA
            ) throw new Error("postpublication artifact identity mismatch");
          '
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > publication.zip
          test "$(sha256sum publication.zip | cut -d ' ' -f 1)" = "${ARTIFACT_DIGEST}"
          unzip -Z1 publication.zip > publication-entries.txt
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const entries = readFileSync("publication-entries.txt", "utf8").trim().split("\n");
            if (
              entries.length < 2 ||
              new Set(entries).size !== entries.length ||
              entries.some((entry) => entry.startsWith("/") || entry.split("/").includes(".."))
            ) throw new Error("postpublication artifact archive inventory is unsafe");
          '
          mkdir verified-publication
          unzip -q publication.zip -d verified-publication
          test -z "$(find verified-publication -type l -print -quit)"
          test "$(find verified-publication -name lab-canary-publication-record.json -type f | wc -l)" -eq 1
          test -f verified-publication/lab-canary-publication-record.json
          test -f verified-publication/preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json

      - name: Verify exact schema and canonical record content without repository source execution
        shell: bash
        env:
          SCHEMA_SHA256: 1c616c297470d6f1958c9adbd4e54aec805aa076f2b4321602b49f736b859af1
        run: |
          schema_path=verified-publication/preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json
          test "$(sha256sum "${schema_path}" | cut -d ' ' -f 1)" = "${SCHEMA_SHA256}"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const recordPath = "verified-publication/lab-canary-publication-record.json";
            const schemaPath = "verified-publication/preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json";
            const bytes = readFileSync(recordPath, "utf8");
            const record = JSON.parse(bytes);
            const schema = JSON.parse(readFileSync(schemaPath, "utf8"));
            const object = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            const resolveReference = (reference) => reference.slice(2).split("/").reduce(
              (value, encoded) => value[encoded.replaceAll("~1", "/").replaceAll("~0", "~")], schema
            );
            const validate = (value, rule, path = "$") => {
              if (rule.$ref) return validate(value, resolveReference(rule.$ref), path);
              if (rule.const !== undefined && !Object.is(value, rule.const)) throw new Error(`${path}: const mismatch`);
              const types = rule.type === undefined ? [] : Array.isArray(rule.type) ? rule.type : [rule.type];
              const matches = (type) => type === "object" ? object(value) : type === "array" ? Array.isArray(value) :
                type === "integer" ? Number.isInteger(value) : type === "number" ? typeof value === "number" && Number.isFinite(value) :
                type === "null" ? value === null : typeof value === type;
              if (types.length && !types.some(matches)) throw new Error(`${path}: type mismatch`);
              if (typeof value === "string") {
                if (rule.minLength !== undefined && value.length < rule.minLength) throw new Error(`${path}: minLength`);
                if (rule.pattern !== undefined && !new RegExp(rule.pattern, "u").test(value)) throw new Error(`${path}: pattern`);
              }
              if (typeof value === "number" && rule.minimum !== undefined && value < rule.minimum) throw new Error(`${path}: minimum`);
              if (Array.isArray(value)) {
                if (rule.minItems !== undefined && value.length < rule.minItems) throw new Error(`${path}: minItems`);
                for (let index = 0; index < value.length; index += 1) validate(value[index], rule.items, `${path}[${index}]`);
              } else if (object(value)) {
                for (const key of rule.required ?? []) if (!Object.hasOwn(value, key)) throw new Error(`${path}.${key}: required`);
                for (const [key, child] of Object.entries(value)) {
                  if (rule.properties?.[key]) validate(child, rule.properties[key], `${path}.${key}`);
                  else if (rule.additionalProperties === false) throw new Error(`${path}.${key}: additional property`);
                }
              }
            };
            const canonical = (value) => {
              if (value === null || typeof value !== "object") return JSON.stringify(value);
              if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
            };
            validate(record, schema);
            if (
              bytes !== `${canonical(record)}\n` ||
              record.candidateSha !== process.env.GITHUB_SHA ||
              record.publicationRunId !== Number(process.env.GITHUB_RUN_ID) ||
              record.publicationRun.id !== Number(process.env.GITHUB_RUN_ID) ||
              record.publicationRun.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              record.publicationRun.workflowPath !== ".github/workflows/publish-browser-lab-canary.yml"
            ) throw new Error("postpublication record content or run binding mismatch");
          '

      - name: Attest exact schema-checked postpublication record
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: verified-publication/lab-canary-publication-record.json
