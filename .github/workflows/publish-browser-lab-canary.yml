name: Publish Browser Lab Canary

on:
  workflow_dispatch:
    inputs:
      macHostCanaryRunId:
        description: FW-MAC-M2-01 host canary run ID
        required: true
        type: string
      windowsHostCanaryRunId:
        description: FW-WIN-I12-01 host canary run ID
        required: true
        type: string
      linuxIntelHostCanaryRunId:
        description: FW-LNX-I12-01 host canary run ID
        required: true
        type: string
      linuxNvidiaHostCanaryRunId:
        description: FW-LNX-NV-01 host canary run ID
        required: true
        type: string
      manualCanaryRunId:
        description: Generic authenticated manual-canary submission run ID
        required: true
        type: string
      manualIntakeReleaseId:
        description: Generic manual canary intake release database ID
        required: true
        type: string
      manualHardwareJobId:
        description: Generic manual canary hardware job ID
        required: true
        type: string

permissions: {}

jobs:
  observe-lab-canary-publication-trust:
    name: Browser Lab Canary / Observe Publication Trust
    runs-on: ubuntu-latest
    environment: forge3d-trust-observer
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
    outputs:
      observation_artifact_id: ${{ steps.upload-observation.outputs.artifact-id }}
      observation_artifact_name: ${{ steps.emit-observation.outputs.artifact-name }}
      observation_artifact_digest: ${{ steps.upload-observation.outputs.artifact-digest }}
      observation_content_sha256: ${{ steps.emit-observation.outputs.content-sha256 }}

    steps:
      - name: Reject dispatch outside protected main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out protected observer code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Mint short-lived trust-observer token
        id: observer-token
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_APP_ID: ${{ secrets.TRUST_OBSERVER_APP_ID }}
          TRUST_OBSERVER_INSTALLATION_ID: ${{ secrets.TRUST_OBSERVER_INSTALLATION_ID }}
          TRUST_OBSERVER_PRIVATE_KEY: ${{ secrets.TRUST_OBSERVER_PRIVATE_KEY }}
        run: node scripts/mint-github-app-token.mjs

      - name: Verify live protected-main trust
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: node scripts/verify-repository-trust.mjs > repository-trust-verification.json

      - name: Emit observation for both fixed consumers
        id: emit-observation
        working-directory: crates/forge3d-web
        run: |
          node scripts/emit-repository-trust-observation.mjs \
            --verification repository-trust-verification.json \
            --operation publish-lab-canary \
            --consumer validate-lab-canary@none \
            --consumer publish-lab-canary@forge3d-web-release \
            --workflow-path .github/workflows/publish-browser-lab-canary.yml \
            --workflow-ref refs/heads/main \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ github.sha }}" \
            --target-sha "${{ github.sha }}" \
            --output repository-trust-observation.json
          name="repository-trust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish-lab-canary"
          echo "artifact-name=${name}" >> "$GITHUB_OUTPUT"
          echo "content-sha256=$(sha256sum repository-trust-observation.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Revoke observer token
        if: always() && steps.observer-token.outputs.token != ''
        working-directory: crates/forge3d-web
        env:
          OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: |
          node --input-type=module --eval '
            const response = await fetch("https://api.github.com/installation/token", {
              method: "DELETE",
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.OBSERVER_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" }
            });
            if (response.status !== 204) throw new Error(`token revocation failed: ${response.status}`);
          '

      - name: Upload exact observation
        id: upload-observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.emit-observation.outputs.artifact-name }}
          path: crates/forge3d-web/repository-trust-observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Attest observation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/repository-trust-observation.json

  validate-lab-canary:
    name: Browser Lab Canary / Validate Publication
    needs: observe-lab-canary-publication-trust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      preflight_artifact_id: ${{ steps.upload-preflight.outputs.artifact-id }}
      preflight_artifact_digest: ${{ steps.upload-preflight.outputs.artifact-digest }}
      preflight_sha256: ${{ steps.preflight.outputs.preflight-sha256 }}
      lab_infrastructure_digest: ${{ steps.effective-context.outputs.lab-digest }}
      release_tag: ${{ steps.effective-context.outputs.release-tag }}

    steps:
      - name: Check out protected preflight code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact observation and strict post-epoch candidate
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_content_sha256 }}
          EXPECTED_OPERATION: publish-lab-canary
          EXPECTED_CONSUMER_JOB: validate-lab-canary
          EXPECTED_CONSUMER_ENVIRONMENT: none
          EXPECTED_TARGET_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/publish-browser-lab-canary.yml
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          node scripts/verify-repository-trust-observation.mjs
          epoch="$(node -p "require('./tests/infrastructure/repository-trust-policy.json').trustEpochSha")"
          test "${GITHUB_SHA}" != "${epoch}"
          git merge-base --is-ancestor "${epoch}" "${GITHUB_SHA}"

      - name: Resolve exact canary artifacts into synthetic assets
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SPECS: >-
            ${{ inputs.macHostCanaryRunId }}:FW-MAC-M2-01
            ${{ inputs.windowsHostCanaryRunId }}:FW-WIN-I12-01
            ${{ inputs.linuxIntelHostCanaryRunId }}:FW-LNX-I12-01
            ${{ inputs.linuxNvidiaHostCanaryRunId }}:FW-LNX-NV-01
          MANUAL_RUN_ID: ${{ inputs.manualCanaryRunId }}
          MANUAL_INTAKE_ID: ${{ inputs.manualIntakeReleaseId }}
          MANUAL_JOB_ID: ${{ inputs.manualHardwareJobId }}
        run: |
          mkdir canary-assets resolved
          for spec in ${RUN_SPECS}; do
            run_id="${spec%%:*}"
            host_id="${spec#*:}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "resolved/${run_id}-run.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "resolved/${run_id}-artifacts.json"
            node --input-type=module --eval '
              import { readFileSync, writeFileSync } from "node:fs";
              const [runPath, artifactsPath, hostId] = process.argv.slice(1);
              const run = JSON.parse(readFileSync(runPath, "utf8"));
              const artifacts = JSON.parse(readFileSync(artifactsPath, "utf8")).artifacts;
              if (
                run.path !== ".github/workflows/browser-hardware.yml" ||
                run.head_sha !== process.env.GITHUB_SHA ||
                run.head_branch !== "main" ||
                run.conclusion !== "success" ||
                run.inputs?.lane !== "infrastructure-canary" ||
                run.inputs?.canaryMode !== "host" ||
                run.inputs?.assetId !== hostId
              ) throw new Error("host canary run mismatch");
              const matches = artifacts.filter((artifact) =>
                artifact.name === `finalized-browser-hardware-${run.id}-${run.run_attempt}`
              );
              if (matches.length !== 1 || matches[0].expired) throw new Error("host canary artifact mismatch");
              writeFileSync(`resolved/${run.id}-artifact.json`, JSON.stringify(matches[0]));
            ' "resolved/${run_id}-run.json" "resolved/${run_id}-artifacts.json" "${host_id}"
            artifact_id="$(node -p "require('./resolved/${run_id}-artifact.json').id")"
            expected="$(node -p "require('./resolved/${run_id}-artifact.json').digest")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "resolved/${run_id}.zip"
            test "$(sha256sum "resolved/${run_id}.zip" | cut -d ' ' -f 1)" = "${expected#sha256:}"
            mkdir "resolved/${run_id}"
            unzip -q "resolved/${run_id}.zip" -d "resolved/${run_id}"
            subject="$(find "resolved/${run_id}" -name lab-host-canary.json -type f)"
            test -f "${subject}"
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/browser-hardware.yml \
              --source-ref refs/heads/main \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
            cp "${subject}" "canary-assets/host-${host_id}.json"
          done

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${MANUAL_RUN_ID}" > resolved/manual-run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${MANUAL_RUN_ID}/artifacts?per_page=100" > resolved/manual-artifacts.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const run = JSON.parse(readFileSync("resolved/manual-run.json", "utf8"));
            const artifacts = JSON.parse(readFileSync("resolved/manual-artifacts.json", "utf8")).artifacts;
            if (
              run.path !== ".github/workflows/submit-browser-manual-evidence.yml" ||
              run.head_sha !== process.env.GITHUB_SHA ||
              run.head_branch !== "main" ||
              run.conclusion !== "success" ||
              String(run.inputs?.intakeReleaseId) !== process.env.MANUAL_INTAKE_ID ||
              String(run.inputs?.hardwareJobId) !== process.env.MANUAL_JOB_ID
            ) throw new Error("manual canary run mismatch");
            const matches = artifacts.filter((artifact) =>
              artifact.name === `browser-manual-evidence-${run.id}-${run.run_attempt}`
            );
            if (matches.length !== 1 || matches[0].expired) throw new Error("manual canary artifact mismatch");
            writeFileSync("resolved/manual-artifact.json", JSON.stringify(matches[0]));
          '
          manual_artifact_id="$(node -p "require('./resolved/manual-artifact.json').id")"
          manual_expected="$(node -p "require('./resolved/manual-artifact.json').digest")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${manual_artifact_id}/zip" > resolved/manual.zip
          test "$(sha256sum resolved/manual.zip | cut -d ' ' -f 1)" = "${manual_expected#sha256:}"
          mkdir resolved/manual
          unzip -q resolved/manual.zip -d resolved/manual
          manual_subject="$(find resolved/manual -name lab-manual-canary-source.json -type f)"
          test -f "${manual_subject}"
          gh attestation verify "${manual_subject}" \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const source = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (
              source.recordType !== "manual-lab-canary" ||
              source.runId !== Number(process.env.MANUAL_RUN_ID) ||
              source.hardwareJobId !== Number(process.env.MANUAL_JOB_ID) ||
              source.intakeReleaseId !== Number(process.env.MANUAL_INTAKE_ID) ||
              source.supportClaim !== false ||
              source.productAssertionsExecuted !== false ||
              source.attestation?.verified !== false
            ) throw new Error("manual canary source binding is invalid");
            writeFileSync("canary-assets/manual-canary.json", JSON.stringify({
              ...source,
              attestation: {
                verified: true,
                denySelfHostedRunners: true,
                repository: "milos-agathon/forge3d-web",
                signerWorkflow:
                  "milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml",
                sourceRef: "refs/heads/main",
                sourceDigest: process.env.GITHUB_SHA
              }
            }, null, 2));
          ' "${manual_subject}"

          gh api "/repos/${GITHUB_REPOSITORY}/releases/${MANUAL_INTAKE_ID}" > resolved/manual-intake.json
          intake_asset_id="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("resolved/manual-intake.json", "utf8"));
            const matches = release.assets.filter(
              (asset) => asset.name === "intake-manifest.json"
            );
            if (matches.length !== 1) throw new Error("manual intake manifest is not unique");
            process.stdout.write(String(matches[0].id));
          ')"
          intake_expected="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("resolved/manual-intake.json", "utf8"));
            const asset = release.assets.find(
              (candidate) => candidate.id === Number(process.argv[1])
            );
            process.stdout.write(asset.digest);
          ' "${intake_asset_id}")"
          gh api -H "Accept: application/octet-stream" \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/${intake_asset_id}" \
            > resolved/current-intake-manifest.json
          test "$(sha256sum resolved/current-intake-manifest.json | cut -d ' ' -f 1)" = "${intake_expected#sha256:}"
          cmp resolved/current-intake-manifest.json \
            "$(find resolved/manual -name intake-manifest.json -type f)"
          gh attestation verify resolved/current-intake-manifest.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/prepare-browser-manual-evidence.yml \
            --source-ref refs/heads/main \
            --source-digest "$(node -p "require('./resolved/current-intake-manifest.json').prepareRun.workflowSha")" \
            --deny-self-hosted-runners

          node -p "require('./canary-assets/manual-canary.json').media.assetIds.join('\\n')" |
          while IFS= read -r media_id; do
            media_path="$(find resolved/manual -name "${media_id}" -type f)"
            test -f "${media_path}"
            gh attestation verify "${media_path}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
              --source-ref refs/heads/main \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${media_id}" \
              > "resolved/current-media-${media_id}.json"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${media_id}" \
              > "resolved/current-media-${media_id}"
            gh attestation verify "resolved/current-media-${media_id}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
              --source-ref refs/heads/main \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { copyFileSync, readFileSync, writeFileSync } from "node:fs";
            const intake = JSON.parse(readFileSync("resolved/manual-intake.json", "utf8"));
            const canary = JSON.parse(readFileSync(
              "canary-assets/manual-canary.json", "utf8"
            ));
            const intakeManifestBytes = readFileSync("resolved/current-intake-manifest.json");
            const intakeManifest = JSON.parse(intakeManifestBytes);
            const expectedIds = [
              Number(process.argv[1]),
              ...canary.media.assetIds
            ].sort((left, right) => left - right);
            const actualIds = intake.assets.map((asset) => asset.id)
              .sort((left, right) => left - right);
            const metadataValid = canary.media.assets.every((expected) => {
              const actual = intake.assets.find((asset) => asset.id === expected.id);
              const metadata = JSON.parse(readFileSync(
                `resolved/current-media-${expected.id}.json`, "utf8"
              ));
              const bytes = readFileSync(`resolved/current-media-${expected.id}`);
              return (
                actual?.name === expected.name &&
                actual?.uploader?.login === expected.uploader &&
                actual?.size === expected.size &&
                actual?.content_type === expected.mimeType &&
                actual?.created_at === expected.createdAt &&
                actual?.digest === `sha256:${expected.sha256}` &&
                metadata.id === actual.id &&
                metadata.name === actual.name &&
                metadata.uploader?.login === actual.uploader.login &&
                metadata.size === actual.size &&
                metadata.content_type === actual.content_type &&
                metadata.created_at === actual.created_at &&
                metadata.digest === actual.digest &&
                bytes.length === expected.size &&
                createHash("sha256").update(bytes).digest("hex") === expected.sha256
              );
            });
            const manifestAsset = intake.assets.find(
              (asset) => asset.id === Number(process.argv[1])
            );
            if (
              intake.id !== Number(process.env.MANUAL_INTAKE_ID) ||
              intake.tag_name !== `manual-evidence-intake-${intakeManifest.prepareRun.id}` ||
              intake.draft !== true ||
              intake.prerelease !== false ||
              intake.target_commitish !== process.env.GITHUB_SHA ||
              intakeManifest.trustedSha !== process.env.GITHUB_SHA ||
              intakeManifest.supportClaim !== false ||
              manifestAsset?.name !== "intake-manifest.json" ||
              manifestAsset?.size !== intakeManifestBytes.length ||
              manifestAsset?.digest !== `sha256:${createHash("sha256").update(intakeManifestBytes).digest("hex")}` ||
              expectedIds.length !== actualIds.length ||
              expectedIds.some((id, index) => id !== actualIds[index]) ||
              !metadataValid
            ) throw new Error("manual canary intake/media inventory is invalid");
            const retainedMedia = canary.media.assets.map((asset) => ({
              ...asset,
              releaseName: `manual-media-${asset.id}`
            }));
            if (
              new Set(retainedMedia.map((asset) => asset.releaseName)).size !==
              retainedMedia.length
            ) throw new Error("retained manual canary media names are not unique");
            for (const asset of retainedMedia) {
              copyFileSync(
                `resolved/current-media-${asset.id}`,
                `canary-assets/${asset.releaseName}`
              );
            }
            writeFileSync("canary-assets/manual-intake-binding.json", JSON.stringify({
              schemaVersion: 1,
              recordType: "lab-canary-manual-intake-binding",
              supportClaim: false,
              candidateSha: process.env.GITHUB_SHA,
              release: {
                id: intake.id,
                tagName: intake.tag_name,
                targetCommitish: intake.target_commitish,
                draft: true,
                prerelease: false
              },
              intakeManifest: {
                id: manifestAsset.id,
                name: manifestAsset.name,
                size: manifestAsset.size,
                sha256: manifestAsset.digest.slice("sha256:".length),
                apiDigest: manifestAsset.digest
              },
              media: retainedMedia.map((asset) => ({
                id: asset.id,
                name: asset.name,
                releaseName: asset.releaseName,
                uploader: asset.uploader,
                size: asset.size,
                mimeType: asset.mimeType,
                createdAt: asset.createdAt,
                sha256: asset.sha256,
                apiDigest: `sha256:${asset.sha256}`
              })).sort((left, right) => left.id - right.id)
            }));
          ' "${intake_asset_id}"

          node --input-type=module --eval '
            import { readFileSync, readdirSync } from "node:fs";
            const records = readdirSync("canary-assets")
              .filter((name) =>
                name.endsWith(".json") && name !== "manual-intake-binding.json"
              )
              .map((name) => JSON.parse(readFileSync(`canary-assets/${name}`, "utf8")));
            if (
              records.length !== 5 ||
              new Set(records.map((record) => record.packageRunId)).size !== 1 ||
              new Set(records.map((record) => record.packageSha256)).size !== 1 ||
              records.some((record) => record.trustedSha !== process.env.GITHUB_SHA)
            ) throw new Error("closed canary set does not bind one exact package/candidate");
          '

      - name: Derive effective canary identity from verified installations
        id: effective-context
        working-directory: crates/forge3d-web
        run: |
          node --input-type=module --eval '
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            import {
              computeEffectiveLabInfrastructure,
              computeLabConfiguration,
              validateServiceInstallations
            } from "./scripts/compute-lab-readiness.mjs";
            const configuration = computeLabConfiguration({
              repositoryRoot: process.env.GITHUB_WORKSPACE
            });
            const hostCanaries = readdirSync("canary-assets")
              .filter((name) => /^host-.*\.json$/u.test(name))
              .map((name) => JSON.parse(readFileSync(`canary-assets/${name}`, "utf8")));
            const matrix = JSON.parse(readFileSync(
              "tests/infrastructure/hardware-matrix.json", "utf8"
            ));
            const browserPolicy = JSON.parse(readFileSync(
              "tests/infrastructure/browser-policy.json", "utf8"
            ));
            const serviceInstallations = validateServiceInstallations({
              hostCanaries,
              requiredHosts: matrix.hosts.map((host) => host.assetId).sort(),
              candidateSha: process.env.GITHUB_SHA,
              configuration,
              browserPolicy
            });
            const effective = computeEffectiveLabInfrastructure({
              configuration,
              serviceInstallations
            });
            writeFileSync(
              process.env.GITHUB_OUTPUT,
              `lab-digest=${effective.labInfrastructureDigest}\n` +
                `release-tag=browser-lab-canary-${effective.labInfrastructureDigest}-${process.env.GITHUB_RUN_ID}\n`,
              { flag: "a" }
            );
          '

      - name: Verify immutable-release setting and absent fixed tag
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.effective-context.outputs.release-tag }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}" > repository-settings.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const settings = JSON.parse(readFileSync("repository-settings.json", "utf8"));
            const enabled =
              settings.immutable_releases === true ||
              settings.immutable_releases?.enabled === true;
            if (!enabled) throw new Error("release immutability is unavailable or disabled");
          '
          node --input-type=module --eval '
            import { requireGitHubResourceAbsent } from "./scripts/lab-canary-publication.mjs";
            const root = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
            const tag = encodeURIComponent(process.env.RELEASE_TAG);
            await requireGitHubResourceAbsent({
              url: `${root}/releases/tags/${tag}`,
              token: process.env.GH_TOKEN
            });
            await requireGitHubResourceAbsent({
              url: `${root}/git/ref/tags/${tag}`,
              token: process.env.GH_TOKEN
            });
          '

      - name: Resolve implementation actors
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/resolve-implementation-actors.mjs \
            --target-sha "${GITHUB_SHA}" \
            --output implementation-actors.json

      - name: Create non-support manifest and closed preflight
        id: preflight
        working-directory: crates/forge3d-web
        env:
          LAB_DIGEST: ${{ steps.effective-context.outputs.lab-digest }}
          RELEASE_TAG: ${{ steps.effective-context.outputs.release-tag }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_content_sha256 }}
          MANUAL_INTAKE_ID: ${{ inputs.manualIntakeReleaseId }}
        run: |
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            import { createPublicationPreflight } from "./scripts/release-publication.mjs";
            const readiness = await import("./scripts/compute-lab-readiness.mjs");
            const configuration = readiness.computeLabConfiguration({
              repositoryRoot: process.env.GITHUB_WORKSPACE
            });
            const hostCanaries = readdirSync("canary-assets")
              .filter((name) => /^host-.*\.json$/u.test(name))
              .map((name) => JSON.parse(readFileSync(`canary-assets/${name}`, "utf8")));
            const matrix = JSON.parse(readFileSync(
              "tests/infrastructure/hardware-matrix.json", "utf8"
            ));
            const browserPolicy = JSON.parse(readFileSync(
              "tests/infrastructure/browser-policy.json", "utf8"
            ));
            const serviceInstallations = readiness.validateServiceInstallations({
              hostCanaries,
              requiredHosts: matrix.hosts.map((host) => host.assetId).sort(),
              candidateSha: process.env.GITHUB_SHA,
              configuration,
              browserPolicy
            });
            const effective = readiness.computeEffectiveLabInfrastructure({
              configuration,
              serviceInstallations
            });
            if (effective.labInfrastructureDigest !== process.env.LAB_DIGEST) {
              throw new Error("verified installation/preflight laboratory digest mismatch");
            }
            const manifest = {
              schemaVersion: 1,
              recordType: "lab-canary-publication-candidate",
              supportClaim: false,
              candidateSha: process.env.GITHUB_SHA,
              publicationRunId: Number(process.env.GITHUB_RUN_ID),
              tag: process.env.RELEASE_TAG,
              labInfrastructureDigest: process.env.LAB_DIGEST,
              manualIntakeReleaseId: Number(process.env.MANUAL_INTAKE_ID),
              intakeDeletionPlannedAfterVerification: true
            };
            writeFileSync("canary-assets/browser-lab-canary-manifest.json", JSON.stringify(manifest, null, 2));
            writeFileSync("canary-assets/lab-configuration.json", JSON.stringify({
              ...configuration,
              ...effective,
              serviceInstallations
            }, null, 2));
            const assets = readdirSync("canary-assets").map((name, index) => ({
              sourceId: index + 1,
              name,
              sha256: createHash("sha256").update(readFileSync(`canary-assets/${name}`)).digest("hex")
            }));
            const result = createPublicationPreflight({
              mode: "laboratory-canary",
              supportClaim: false,
              targetSha: process.env.GITHUB_SHA,
              tag: process.env.RELEASE_TAG,
              readiness: {
                runId: Number(process.env.GITHUB_RUN_ID),
                artifactId: 1,
                sha256: process.env.LAB_DIGEST,
                status: "LAB_CANARY_PREFLIGHT_READY"
              },
              assets,
              observation: {
                artifactId: Number(process.env.OBSERVATION_ARTIFACT_ID),
                artifactName: process.env.OBSERVATION_ARTIFACT_NAME,
                artifactDigest: `sha256:${process.env.OBSERVATION_ARTIFACT_DIGEST}`,
                contentSha256: process.env.OBSERVATION_CONTENT_SHA256
              },
              run: {
                id: Number(process.env.GITHUB_RUN_ID),
                attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                workflow: ".github/workflows/publish-browser-lab-canary.yml"
              },
              workflowSha: process.env.GITHUB_WORKFLOW_SHA,
              publisher: { actor: process.env.GITHUB_ACTOR, job: "publish-lab-canary" },
              implementationActors: JSON.parse(readFileSync("implementation-actors.json", "utf8")).actors
            });
            writeFileSync("release-publication-preflight.json", result.canonical);
            writeFileSync(process.env.GITHUB_OUTPUT, `preflight-sha256=${result.sha256}\n`, { flag: "a" });
          '

          mkdir -p \
            canary-publication-validator/scripts \
            canary-publication-validator/tests/browser \
            canary-publication-validator/tests/infrastructure
          cp \
            scripts/lab-canary-publication.mjs \
            scripts/canonical-json.mjs \
            canary-publication-validator/scripts/
          cp tests/browser/json-schema-validator.mjs canary-publication-validator/tests/browser/
          cp \
            tests/infrastructure/lab-canary-publication-record.schema.json \
            canary-publication-validator/tests/infrastructure/

      - name: Attest preflight, publisher validator, and every synthetic asset
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            crates/forge3d-web/release-publication-preflight.json
            crates/forge3d-web/canary-assets/*
            crates/forge3d-web/canary-publication-validator/scripts/*
            crates/forge3d-web/canary-publication-validator/tests/browser/*
            crates/forge3d-web/canary-publication-validator/tests/infrastructure/*

      - name: Upload exact preflight and synthetic assets
        id: upload-preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-canary-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crates/forge3d-web/release-publication-preflight.json
            crates/forge3d-web/canary-assets/
            crates/forge3d-web/canary-publication-validator/
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  publish-lab-canary:
    name: Browser Lab Canary / Publish Immutable Release
    needs:
      - observe-lab-canary-publication-trust
      - validate-lab-canary
    runs-on: ubuntu-latest
    environment: forge3d-web-release
    permissions:
      actions: read
      attestations: read
      contents: write
    outputs:
      publication_artifact_id: ${{ steps.upload-publication.outputs.artifact-id }}
      publication_artifact_digest: ${{ steps.upload-publication.outputs.artifact-digest }}

    steps:
      - name: Download exact preflight without source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -d .git
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.validate-lab-canary.outputs.preflight_artifact_id }}/zip" > preflight.zip
          expected="${{ needs.validate-lab-canary.outputs.preflight_artifact_digest }}"
          test "$(sha256sum preflight.zip | cut -d ' ' -f 1)" = "${expected#sha256:}"
          mkdir preflight
          unzip -q preflight.zip -d preflight
          test -f preflight/release-publication-preflight.json
          gh attestation verify preflight/release-publication-preflight.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-browser-lab-canary.yml \
            --source-ref refs/heads/main \
            --source-digest "${{ github.workflow_sha }}" \
            --deny-self-hosted-runners
          for subject in preflight/canary-assets/*; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-browser-lab-canary.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done
          while IFS= read -r subject; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-browser-lab-canary.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done < <(find preflight/canary-publication-validator -type f | sort)

      - name: Reapply exact observation and preflight handoffs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-lab-canary.outputs.release_tag }}
          PREFLIGHT_SHA256: ${{ needs.validate-lab-canary.outputs.preflight_sha256 }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-lab-canary-publication-trust.outputs.observation_content_sha256 }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${OBSERVATION_ARTIFACT_ID}/zip" > observation.zip
          test "$(sha256sum observation.zip | cut -d ' ' -f 1)" = "${OBSERVATION_ARTIFACT_DIGEST#sha256:}"
          mkdir observation
          unzip -q observation.zip -d observation
          gh attestation verify observation/repository-trust-observation.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-browser-lab-canary.yml \
            --source-ref refs/heads/main \
            --source-digest "${{ github.workflow_sha }}" \
            --deny-self-hosted-runners
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const observationBytes = readFileSync("observation/repository-trust-observation.json");
            const observation = JSON.parse(observationBytes);
            const preflightBytes = readFileSync("preflight/release-publication-preflight.json");
            const preflight = JSON.parse(preflightBytes);
            const consumer = observation.consumers.some((value) =>
              value.job === "publish-lab-canary" &&
              value.environment === "forge3d-web-release"
            );
            if (
              createHash("sha256").update(observationBytes).digest("hex") !== process.env.OBSERVATION_CONTENT_SHA256 ||
              observation.operation !== "publish-lab-canary" ||
              observation.run.id !== Number(process.env.GITHUB_RUN_ID) ||
              observation.run.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              observation.targetSha !== process.env.GITHUB_SHA ||
              !consumer ||
              createHash("sha256").update(preflightBytes).digest("hex") !== process.env.PREFLIGHT_SHA256 ||
              preflight.targetSha !== process.env.GITHUB_SHA ||
              preflight.tag !== process.env.RELEASE_TAG ||
              preflight.publisher.job !== "publish-lab-canary" ||
              preflight.publisher.environment !== "forge3d-web-release" ||
              new Date(preflight.expiresAt) <= new Date()
            ) throw new Error("publisher handoff mismatch or expiry");
          '

      - name: Require independent environment approval and unchanged immutable setting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > approvals.json
          gh api "/repos/${GITHUB_REPOSITORY}" > repository-settings.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const approvals = JSON.parse(readFileSync("approvals.json", "utf8"))
              .filter((value) => value.state === "approved");
            const settings = JSON.parse(readFileSync("repository-settings.json", "utf8"));
            const immutable =
              settings.immutable_releases === true ||
              settings.immutable_releases?.enabled === true;
            if (
              !immutable ||
              preflight.implementationActors.includes(process.env.GITHUB_ACTOR) ||
              approvals.length < 1 ||
              approvals.some((value) =>
                value.user.login === process.env.GITHUB_ACTOR ||
                preflight.implementationActors.includes(value.user.login)
              )
            ) throw new Error("publisher identity, approval, or immutability gate failed");
          '

      - name: Re-fetch exact intake identity and bytes immediately before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p publisher-intake/media
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const binding = JSON.parse(readFileSync(
              "preflight/canary-assets/manual-intake-binding.json", "utf8"
            ));
            process.stdout.write(String(binding.release.id));
          ' > publisher-intake/release-id.txt
          intake_id="$(cat publisher-intake/release-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" \
            > publisher-intake/release.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const binding = JSON.parse(readFileSync(
              "preflight/canary-assets/manual-intake-binding.json", "utf8"
            ));
            process.stdout.write(`${binding.intakeManifest.id}\tintake-manifest\n`);
            for (const asset of binding.media) {
              process.stdout.write(`${asset.id}\tmedia/${asset.id}\n`);
            }
          ' > publisher-intake/assets.tsv
          while IFS=$'\t' read -r asset_id destination; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "publisher-intake/${destination}.metadata.json"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "publisher-intake/${destination}"
          done < publisher-intake/assets.tsv
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const binding = JSON.parse(readFileSync(
              "preflight/canary-assets/manual-intake-binding.json", "utf8"
            ));
            writeFileSync("publisher-intake/verification-input.json", JSON.stringify({
              candidateSha: process.env.GITHUB_SHA,
              binding,
              release: JSON.parse(readFileSync("publisher-intake/release.json", "utf8")),
              intakeManifestMetadata: JSON.parse(readFileSync(
                "publisher-intake/intake-manifest.metadata.json", "utf8"
              )),
              intakeManifest: { path: "publisher-intake/intake-manifest" },
              media: binding.media.map((asset) => ({
                metadata: JSON.parse(readFileSync(
                  `publisher-intake/media/${asset.id}.metadata.json`, "utf8"
                )),
                bytes: { path: `publisher-intake/media/${asset.id}` }
              })),
              retainedMedia: binding.media.map((asset) => ({
                name: asset.releaseName,
                bytes: { path: `preflight/canary-assets/${asset.releaseName}` }
              }))
            }));
          '
          intake_source_sha="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            process.stdout.write(JSON.parse(
              readFileSync("publisher-intake/intake-manifest", "utf8")
            ).prepareRun.workflowSha);
          ')"
          gh attestation verify publisher-intake/intake-manifest \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/prepare-browser-manual-evidence.yml \
            --source-ref refs/heads/main \
            --source-digest "${intake_source_sha}" \
            --deny-self-hosted-runners
          while IFS=$'\t' read -r asset_id destination; do
            if test "${destination}" != "intake-manifest"; then
              gh attestation verify "publisher-intake/${destination}" \
                --repo milos-agathon/forge3d-web \
                --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
                --source-ref refs/heads/main \
                --source-digest "${GITHUB_SHA}" \
                --deny-self-hosted-runners
            fi
          done < publisher-intake/assets.tsv
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" \
            > publisher-intake/release.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "publisher-intake/verification-input.json";
            const input = JSON.parse(readFileSync(path, "utf8"));
            input.release = JSON.parse(readFileSync("publisher-intake/release.json", "utf8"));
            writeFileSync(path, JSON.stringify(input));
          '
          node preflight/canary-publication-validator/scripts/lab-canary-publication.mjs \
            publisher-intake/verification-input.json \
            verify-intake \
            publisher-intake/verification.json

      - name: Create draft, byte-verify closed assets, and publish exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-lab-canary.outputs.release_tag }}
        run: |
          node --input-type=module --eval '
            import { requireGitHubResourceAbsent } from "./preflight/canary-publication-validator/scripts/lab-canary-publication.mjs";
            const root = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
            const tag = encodeURIComponent(process.env.RELEASE_TAG);
            await requireGitHubResourceAbsent({
              url: `${root}/releases/tags/${tag}`,
              token: process.env.GH_TOKEN
            });
            await requireGitHubResourceAbsent({
              url: `${root}/git/ref/tags/${tag}`,
              token: process.env.GH_TOKEN
            });
          '
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Forge3D browser laboratory canary" \
            --notes "Infrastructure-only canary. This release makes no browser support claim." \
            --draft
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > draft-release.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("draft-release.json", "utf8"));
            if (
              release.tag_name !== process.env.RELEASE_TAG ||
              release.target_commitish !== process.env.GITHUB_SHA ||
              release.draft !== true ||
              release.prerelease !== false
            ) throw new Error("created canary draft identity is invalid");
          '
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            preflight/canary-assets/*
          mkdir draft-download
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir draft-download
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync } from "node:fs";
            const preflight = JSON.parse(readFileSync("preflight/release-publication-preflight.json", "utf8"));
            const expected = preflight.assets.map((asset) => asset.name).sort();
            const actual = readdirSync("draft-download").sort();
            if (
              expected.length !== actual.length ||
              expected.some((name, index) => name !== actual[index])
            ) throw new Error("draft canary asset inventory is not closed");
            for (const asset of preflight.assets) {
              const digest = createHash("sha256").update(readFileSync(`draft-download/${asset.name}`)).digest("hex");
              if (digest !== asset.sha256) throw new Error(`draft asset digest mismatch: ${asset.name}`);
            }
          '
          for subject in draft-download/*; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/publish-browser-lab-canary.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

      - name: Retain CLI JSON and verify fresh immutable API and byte closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-lab-canary.outputs.release_tag }}
        run: |
          mkdir -p \
            publication-proof/asset-api \
            publication-proof/asset-verification \
            published-download
          gh release verify "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format json \
            > publication-proof/release-verify.json
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > publication-proof/release.json
          published_release_id="$(node -p "require('./publication-proof/release.json').id")"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${published_release_id}/assets?per_page=100" \
            > publication-proof/release-assets-pages.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const preflight = JSON.parse(readFileSync(
              "preflight/release-publication-preflight.json", "utf8"
            ));
            const pages = JSON.parse(readFileSync(
              "publication-proof/release-assets-pages.json", "utf8"
            ));
            const assets = pages.flat();
            const rows = preflight.assets
              .map((expected, index) => {
                const actual = assets.filter((asset) => asset.name === expected.name);
                if (actual.length !== 1) throw new Error(`published API asset is not unique: ${expected.name}`);
                return {
                  id: actual[0].id,
                  name: expected.name,
                  apiPath: `publication-proof/asset-api/${String(index + 1).padStart(4, "0")}.json`,
                  proofPath: `publication-proof/asset-verification/${String(index + 1).padStart(4, "0")}.json`
                };
              })
              .sort((left, right) => left.name.localeCompare(right.name));
            writeFileSync("publication-proof/assets-map.json", JSON.stringify(rows));
            for (const row of rows) {
              process.stdout.write(`${row.id}\t${row.name}\t${row.apiPath}\t${row.proofPath}\n`);
            }
          ' > publication-proof/assets.tsv
          while IFS=$'\t' read -r asset_id asset_name api_path proof_path; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${api_path}"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "published-download/${asset_name}"
            gh release verify-asset "${RELEASE_TAG}" \
              "published-download/${asset_name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format json > "${proof_path}"
          done < publication-proof/assets.tsv
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const release = JSON.parse(readFileSync("publication-proof/release.json", "utf8"));
            const pages = JSON.parse(readFileSync(
              "publication-proof/release-assets-pages.json", "utf8"
            ));
            const releaseAssets = pages.flat();
            const preflight = JSON.parse(readFileSync(
              "preflight/release-publication-preflight.json", "utf8"
            ));
            const map = JSON.parse(readFileSync("publication-proof/assets-map.json", "utf8"));
            const expectedNames = preflight.assets.map((asset) => asset.name).sort();
            const apiNames = releaseAssets.map((asset) => asset.name).sort();
            const downloadedNames = readdirSync("published-download").sort();
            if (
              release.tag_name !== process.env.RELEASE_TAG ||
              release.target_commitish !== process.env.GITHUB_SHA ||
              release.draft !== false ||
              release.prerelease !== false ||
              release.immutable !== true ||
              !release.published_at ||
              expectedNames.length !== apiNames.length ||
              expectedNames.some((name, index) => name !== apiNames[index]) ||
              expectedNames.length !== downloadedNames.length ||
              expectedNames.some((name, index) => name !== downloadedNames[index])
            ) throw new Error("published canary identity, immutability, or inventory is invalid");
            const assets = preflight.assets.map((expected) => {
              const actual = releaseAssets.find((asset) => asset.name === expected.name);
              const row = map.find((entry) => entry.name === expected.name);
              const metadata = JSON.parse(readFileSync(row.apiPath, "utf8"));
              const bytes = readFileSync(`published-download/${expected.name}`);
              const sha256 = digest(bytes);
              if (
                metadata.id !== actual.id ||
                metadata.name !== actual.name ||
                metadata.size !== actual.size ||
                metadata.digest !== actual.digest ||
                actual.digest !== `sha256:${expected.sha256}` ||
                actual.size !== bytes.length ||
                sha256 !== expected.sha256
              ) throw new Error(`published canary API/byte digest mismatch: ${expected.name}`);
              JSON.parse(readFileSync(row.proofPath, "utf8"));
              return {
                id: actual.id,
                name: actual.name,
                size: actual.size,
                apiDigest: actual.digest,
                sha256
              };
            });
            JSON.parse(readFileSync("publication-proof/release-verify.json", "utf8"));
            writeFileSync("publication-proof/published-assets.json", JSON.stringify(assets));
            writeFileSync("publication-proof/verified-at.txt", new Date().toISOString());
          '

      - name: Re-fetch exact intake bytes, then delete only after final verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deletion-intake/media
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const binding = JSON.parse(readFileSync(
              "preflight/canary-assets/manual-intake-binding.json", "utf8"
            ));
            process.stdout.write(`${binding.release.id}\t${binding.release.tagName}\n`);
          ' > deletion-intake/intake.tsv
          IFS=$'\t' read -r intake_id intake_tag < deletion-intake/intake.tsv
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" \
            > deletion-intake/release.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const binding = JSON.parse(readFileSync(
              "preflight/canary-assets/manual-intake-binding.json", "utf8"
            ));
            process.stdout.write(`${binding.intakeManifest.id}\tintake-manifest\n`);
            for (const asset of binding.media) {
              process.stdout.write(`${asset.id}\tmedia/${asset.id}\n`);
            }
          ' > deletion-intake/assets.tsv
          while IFS=$'\t' read -r asset_id destination; do
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "deletion-intake/${destination}.metadata.json"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "deletion-intake/${destination}"
          done < deletion-intake/assets.tsv
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const binding = JSON.parse(readFileSync(
              "preflight/canary-assets/manual-intake-binding.json", "utf8"
            ));
            writeFileSync("deletion-intake/verification-input.json", JSON.stringify({
              candidateSha: process.env.GITHUB_SHA,
              binding,
              release: JSON.parse(readFileSync("deletion-intake/release.json", "utf8")),
              intakeManifestMetadata: JSON.parse(readFileSync(
                "deletion-intake/intake-manifest.metadata.json", "utf8"
              )),
              intakeManifest: { path: "deletion-intake/intake-manifest" },
              media: binding.media.map((asset) => ({
                metadata: JSON.parse(readFileSync(
                  `deletion-intake/media/${asset.id}.metadata.json`, "utf8"
                )),
                bytes: { path: `deletion-intake/media/${asset.id}` }
              })),
              retainedMedia: binding.media.map((asset) => ({
                name: asset.releaseName,
                bytes: { path: `published-download/${asset.releaseName}` }
              }))
            }));
          '
          intake_source_sha="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            process.stdout.write(JSON.parse(
              readFileSync("deletion-intake/intake-manifest", "utf8")
            ).prepareRun.workflowSha);
          ')"
          gh attestation verify deletion-intake/intake-manifest \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/prepare-browser-manual-evidence.yml \
            --source-ref refs/heads/main \
            --source-digest "${intake_source_sha}" \
            --deny-self-hosted-runners
          while IFS=$'\t' read -r asset_id destination; do
            if test "${destination}" != "intake-manifest"; then
              gh attestation verify "deletion-intake/${destination}" \
                --repo milos-agathon/forge3d-web \
                --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
                --source-ref refs/heads/main \
                --source-digest "${GITHUB_SHA}" \
                --deny-self-hosted-runners
            fi
          done < deletion-intake/assets.tsv
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${intake_id}" \
            > deletion-intake/release.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "deletion-intake/verification-input.json";
            const input = JSON.parse(readFileSync(path, "utf8"));
            input.release = JSON.parse(readFileSync("deletion-intake/release.json", "utf8"));
            writeFileSync(path, JSON.stringify(input));
          '
          node preflight/canary-publication-validator/scripts/lab-canary-publication.mjs \
            deletion-intake/verification-input.json \
            verify-intake \
            deletion-intake/verification.json
          gh release delete "${intake_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes
          INTAKE_ID="${intake_id}" INTAKE_TAG="${intake_tag}" \
            node --input-type=module --eval '
              import { requireGitHubResourceAbsent } from "./preflight/canary-publication-validator/scripts/lab-canary-publication.mjs";
              const root = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
              await requireGitHubResourceAbsent({
                url: `${root}/releases/${encodeURIComponent(process.env.INTAKE_ID)}`,
                token: process.env.GH_TOKEN
              });
              await requireGitHubResourceAbsent({
                url: `${root}/git/ref/tags/${encodeURIComponent(process.env.INTAKE_TAG)}`,
                token: process.env.GH_TOKEN
              });
            '
          node --input-type=module --eval '
            import { writeFileSync } from "node:fs";
            writeFileSync("publication-proof/intake-deletion.json", JSON.stringify({
              releaseId: Number(process.argv[1]),
              tagName: process.argv[2],
              deletedAfterVerification: true,
              deletedAt: new Date().toISOString()
            }));
          ' "${intake_id}" "${intake_tag}"

      - name: Create checked-schema post-publication record without canary mutation
        shell: bash
        run: |
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const map = JSON.parse(readFileSync("publication-proof/assets-map.json", "utf8"));
            writeFileSync("publication-record-input.json", JSON.stringify({
              candidate: { path: "preflight/canary-assets/browser-lab-canary-manifest.json" },
              preflight: { path: "preflight/release-publication-preflight.json" },
              intakeBinding: { path: "preflight/canary-assets/manual-intake-binding.json" },
              release: JSON.parse(readFileSync("publication-proof/release.json", "utf8")),
              assetPages: { path: "publication-proof/release-assets-pages.json" },
              assets: JSON.parse(readFileSync("publication-proof/published-assets.json", "utf8")),
              releaseVerification: { path: "publication-proof/release-verify.json" },
              assetVerifications: map.map((asset) => ({
                name: asset.name,
                path: asset.proofPath
              })),
              intakeDeletion: JSON.parse(readFileSync(
                "publication-proof/intake-deletion.json", "utf8"
              )),
              verifiedAt: readFileSync("publication-proof/verified-at.txt", "utf8").trim()
            }));
          '
          node preflight/canary-publication-validator/scripts/lab-canary-publication.mjs \
            publication-record-input.json \
            create-publication-record \
            lab-canary-publication-record.json

      - name: Retain post-publication verification
        id: upload-publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-canary-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab-canary-publication-record.json
            publication-proof/
            preflight/release-publication-preflight.json
            preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  attest-postpublication-record:
    name: Browser Lab Canary / Attest Postpublication Record
    needs: publish-lab-canary
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download exact postpublication artifact without source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.publish-lab-canary.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.publish-lab-canary.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: lab-canary-publication-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test ! -d .git
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > publication-artifact.json
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const artifact = JSON.parse(readFileSync("publication-artifact.json", "utf8"));
            if (
              artifact.id !== Number(process.env.ARTIFACT_ID) ||
              artifact.name !== process.env.ARTIFACT_NAME ||
              artifact.digest !== process.env.ARTIFACT_DIGEST ||
              artifact.expired === true ||
              artifact.workflow_run?.id !== Number(process.env.GITHUB_RUN_ID)
            ) throw new Error("postpublication artifact identity mismatch");
          '
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > publication.zip
          test "$(sha256sum publication.zip | cut -d ' ' -f 1)" = "${ARTIFACT_DIGEST#sha256:}"
          unzip -Z1 publication.zip > publication-entries.txt
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const entries = readFileSync("publication-entries.txt", "utf8").trim().split("\n");
            if (
              entries.length < 2 ||
              new Set(entries).size !== entries.length ||
              entries.some((entry) => entry.startsWith("/") || entry.split("/").includes(".."))
            ) throw new Error("postpublication artifact archive inventory is unsafe");
          '
          mkdir verified-publication
          unzip -q publication.zip -d verified-publication
          test -z "$(find verified-publication -type l -print -quit)"
          test "$(find verified-publication -name lab-canary-publication-record.json -type f | wc -l)" -eq 1
          test -f verified-publication/lab-canary-publication-record.json
          test -f verified-publication/preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json

      - name: Verify exact schema and canonical record content without repository source execution
        shell: bash
        env:
          SCHEMA_SHA256: 1c616c297470d6f1958c9adbd4e54aec805aa076f2b4321602b49f736b859af1
        run: |
          schema_path=verified-publication/preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json
          test "$(sha256sum "${schema_path}" | cut -d ' ' -f 1)" = "${SCHEMA_SHA256}"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const recordPath = "verified-publication/lab-canary-publication-record.json";
            const schemaPath = "verified-publication/preflight/canary-publication-validator/tests/infrastructure/lab-canary-publication-record.schema.json";
            const bytes = readFileSync(recordPath, "utf8");
            const record = JSON.parse(bytes);
            const schema = JSON.parse(readFileSync(schemaPath, "utf8"));
            const object = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            const resolveReference = (reference) => reference.slice(2).split("/").reduce(
              (value, encoded) => value[encoded.replaceAll("~1", "/").replaceAll("~0", "~")], schema
            );
            const validate = (value, rule, path = "$") => {
              if (rule.$ref) return validate(value, resolveReference(rule.$ref), path);
              if (rule.const !== undefined && !Object.is(value, rule.const)) throw new Error(`${path}: const mismatch`);
              const types = rule.type === undefined ? [] : Array.isArray(rule.type) ? rule.type : [rule.type];
              const matches = (type) => type === "object" ? object(value) : type === "array" ? Array.isArray(value) :
                type === "integer" ? Number.isInteger(value) : type === "number" ? typeof value === "number" && Number.isFinite(value) :
                type === "null" ? value === null : typeof value === type;
              if (types.length && !types.some(matches)) throw new Error(`${path}: type mismatch`);
              if (typeof value === "string") {
                if (rule.minLength !== undefined && value.length < rule.minLength) throw new Error(`${path}: minLength`);
                if (rule.pattern !== undefined && !new RegExp(rule.pattern, "u").test(value)) throw new Error(`${path}: pattern`);
              }
              if (typeof value === "number" && rule.minimum !== undefined && value < rule.minimum) throw new Error(`${path}: minimum`);
              if (Array.isArray(value)) {
                if (rule.minItems !== undefined && value.length < rule.minItems) throw new Error(`${path}: minItems`);
                for (let index = 0; index < value.length; index += 1) validate(value[index], rule.items, `${path}[${index}]`);
              } else if (object(value)) {
                for (const key of rule.required ?? []) if (!Object.hasOwn(value, key)) throw new Error(`${path}.${key}: required`);
                for (const [key, child] of Object.entries(value)) {
                  if (rule.properties?.[key]) validate(child, rule.properties[key], `${path}.${key}`);
                  else if (rule.additionalProperties === false) throw new Error(`${path}.${key}: additional property`);
                }
              }
            };
            const canonical = (value) => {
              if (value === null || typeof value !== "object") return JSON.stringify(value);
              if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
            };
            validate(record, schema);
            if (
              bytes !== `${canonical(record)}\n` ||
              record.candidateSha !== process.env.GITHUB_SHA ||
              record.publicationRunId !== Number(process.env.GITHUB_RUN_ID) ||
              record.publicationRun.id !== Number(process.env.GITHUB_RUN_ID) ||
              record.publicationRun.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              record.publicationRun.workflowPath !== ".github/workflows/publish-browser-lab-canary.yml"
            ) throw new Error("postpublication record content or run binding mismatch");
          '

      - name: Attest exact schema-checked postpublication record
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: verified-publication/lab-canary-publication-record.json
