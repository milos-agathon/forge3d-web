name: Browser Lab Controller Package

on:
  workflow_dispatch:

permissions: {}

jobs:
  observe-controller-package-trust:
    name: Browser Lab Controller / Observe Package Trust
    runs-on: ubuntu-latest
    environment: forge3d-trust-observer
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
    outputs:
      observation_artifact_id: ${{ steps.upload-observation.outputs.artifact-id }}
      observation_artifact_name: ${{ steps.emit-observation.outputs.artifact-name }}
      observation_artifact_digest: ${{ steps.upload-observation.outputs.artifact-digest }}
      observation_content_sha256: ${{ steps.emit-observation.outputs.content-sha256 }}

    steps:
      - name: Reject execution outside protected main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out protected observer code
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Mint short-lived trust-observer token
        id: observer-token
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_APP_ID: ${{ secrets.TRUST_OBSERVER_APP_ID }}
          TRUST_OBSERVER_INSTALLATION_ID: ${{ secrets.TRUST_OBSERVER_INSTALLATION_ID }}
          TRUST_OBSERVER_PRIVATE_KEY: ${{ secrets.TRUST_OBSERVER_PRIVATE_KEY }}
        run: node scripts/mint-github-app-token.mjs

      - name: Verify strict post-epoch protected-main source
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-repository-trust.mjs > repository-trust-verification.json

      - name: Emit controller package observation
        id: emit-observation
        working-directory: crates/forge3d-web
        run: |
          node scripts/emit-repository-trust-observation.mjs \
            --verification repository-trust-verification.json \
            --operation package-controller \
            --consumer package-controller@none \
            --workflow-path .github/workflows/browser-lab-controller.yml \
            --workflow-ref refs/heads/main \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ github.sha }}" \
            --target-sha "${{ github.sha }}" \
            --output repository-trust-observation.json
          artifact_name="repository-trust-${{ github.run_id }}-${{ github.run_attempt }}-package-controller"
          content_sha256="$(sha256sum repository-trust-observation.json | cut -d ' ' -f 1)"
          echo "artifact-name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "content-sha256=${content_sha256}" >> "$GITHUB_OUTPUT"

      - name: Revoke trust-observer token
        if: always() && steps.observer-token.outputs.token != ''
        working-directory: crates/forge3d-web
        env:
          OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: |
          node --input-type=module --eval '
            const response = await fetch("https://api.github.com/installation/token", {
              method: "DELETE",
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.OBSERVER_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" }
            });
            if (response.status !== 204) throw new Error(`token revocation failed: ${response.status}`);
          '

      - name: Upload exact observation
        id: upload-observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.emit-observation.outputs.artifact-name }}
          path: crates/forge3d-web/repository-trust-observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Attest controller trust observation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/repository-trust-observation.json

  package-controller:
    name: Browser Lab Controller / Package
    needs: observe-controller-package-trust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: validation
          persist-credentials: false

      - name: Verify exact-ID observation before controller source execution
        working-directory: validation/crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-controller-package-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-controller-package-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-controller-package-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-controller-package-trust.outputs.observation_content_sha256 }}
          EXPECTED_OPERATION: package-controller
          EXPECTED_CONSUMERS: '[{"job":"package-controller","environment":"none"}]'
          EXPECTED_TARGET_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/browser-lab-controller.yml
        run: node scripts/verify-repository-trust-observation.mjs

      - name: Check out observation-bound controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Test audited controller
        working-directory: source/tools/browser-lab-controller
        run: npm test

      - name: Package versioned controller archive
        working-directory: source
        run: |
          tar -czf browser-lab-controller-1.0.0.tar.gz \
            tools/browser-lab-controller \
            crates/forge3d-web/tests/infrastructure/browser-policy.json \
            crates/forge3d-web/tests/infrastructure/controller-helper-digest-policy.json \
            crates/forge3d-web/tests/infrastructure/controller-helper-digest-policy.schema.json \
            crates/forge3d-web/tests/infrastructure/controller-health-endpoints.json \
            crates/forge3d-web/tests/infrastructure/controller-protocol.schema.json \
            crates/forge3d-web/tests/infrastructure/hardware-matrix.json \
            crates/forge3d-web/tests/infrastructure/lab-service-installation.schema.json \
            crates/forge3d-web/tests/infrastructure/runner-distribution-manifest.json \
            crates/forge3d-web/tests/infrastructure/runner-diagnostic-retention.schema.json \
            crates/forge3d-web/tests/infrastructure/runner-transient-path-policy.json \
            crates/forge3d-web/tests/infrastructure/workflow-actions-lock.json
          node tools/browser-lab-controller/scripts/create-package-manifest.mjs \
            --package-root tools/browser-lab-controller \
            --repository-root . \
            --archive browser-lab-controller-1.0.0.tar.gz \
            --target-sha "${{ github.sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --output controller-package-manifest.json

      - name: Upload controller package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-lab-controller-${{ github.sha }}
          path: |
            source/browser-lab-controller-1.0.0.tar.gz
            source/controller-package-manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Attest controller archive and manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            source/browser-lab-controller-1.0.0.tar.gz
            source/controller-package-manifest.json
