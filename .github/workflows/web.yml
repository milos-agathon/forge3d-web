name: Web Runtime

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  wasm-and-browser:
    name: Wasm And Browser Tests
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Check core no-default wasm build
        run: cargo check -p forge3d-core --target wasm32-unknown-unknown --no-default-features

      - name: Check web wasm build
        run: cargo check -p forge3d-web --target wasm32-unknown-unknown

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: npm ci

      - name: Build wasm package
        working-directory: crates/forge3d-web
        run: npm run build:wasm

      - name: Test browser API contract
        working-directory: crates/forge3d-web
        run: npm run test:api

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Test browser package contract
        working-directory: crates/forge3d-web
        run: npm run test:package

      - name: Install Chromium for Playwright
        working-directory: crates/forge3d-web
        run: npx playwright install chromium

      - name: Test clean installed tarball in Chrome
        working-directory: crates/forge3d-web
        env:
          FORGE3D_EVIDENCE_DIR: test-results/browser-gate
        run: npm run test:package-consumer

      - name: Upload exact-tarball browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: forge3d-web-browser-gate
          path: crates/forge3d-web/test-results/browser-gate
          if-no-files-found: error
          retention-days: 30

      - name: Print WebGPU capability diagnostics
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
        run: |
          echo "FORGE3D_WEBGPU_REQUIRED=$env:FORGE3D_WEBGPU_REQUIRED"
          echo "Chrome channel uses the installed browser UA with --enable-unsafe-webgpu --use-angle=d3d11"
          echo "Playwright tests evaluate navigator.gpu before render assertions"
          npm run test:browser -- --grep "reports browser WebGPU diagnostics"

      - name: Browser render tests
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
        run: npm run test:browser

      - name: Upload source-browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: forge3d-web-source-browser-evidence
          path: crates/forge3d-web/test-results/**/browser-evidence.json
          if-no-files-found: error
          retention-days: 30
