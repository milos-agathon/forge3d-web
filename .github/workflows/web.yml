name: Web Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-contract:
    name: Web Runtime / Build And Contract Tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable reviewed 2026-07-28
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Check core no-default wasm build
        run: cargo check -p forge3d-core --target wasm32-unknown-unknown --no-default-features

      - name: Check web wasm build
        run: cargo check -p forge3d-web --target wasm32-unknown-unknown

      - name: Test core GPU contracts
        run: cargo test -p forge3d-core --features gpu

      - name: Test web crate contracts
        run: cargo test -p forge3d-web

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: |
          npm ci --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path node_modules/.bin/wasm-pack.cmd)) {
            throw "npm ci completed without installing the wasm-pack command shim"
          }

      - name: Build wasm package
        working-directory: crates/forge3d-web
        run: npm run build:wasm

      - name: Test TypeScript units
        working-directory: crates/forge3d-web
        run: npm run test:unit

      - name: Test browser API contract
        working-directory: crates/forge3d-web
        run: npm run test:api

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Test browser package and infrastructure contracts
        working-directory: crates/forge3d-web
        run: npm run test:package

      - name: Verify publish dry run
        working-directory: crates/forge3d-web
        run: npm pack --dry-run

      - name: Install Chromium for packed consumer
        working-directory: crates/forge3d-web
        run: npx playwright install chromium

      - name: Test clean installed tarball in bundled Chromium preflight
        working-directory: crates/forge3d-web
        env:
          FORGE3D_BROWSER_CHANNEL: bundled
          FORGE3D_EVIDENCE_DIR: test-results/browser-gate
          FORGE3D_PACKAGE_GATE_MODE: probe
        run: npm run test:package-consumer

      - name: Upload exact-tarball browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-browser-gate
          path: crates/forge3d-web/test-results/browser-gate
          if-no-files-found: error
          retention-days: 30

  browser-preflight:
    name: Web Runtime / Browser Preflight
    needs: build-and-contract
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out the protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable reviewed 2026-07-28
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Install bundled Chromium for flagged preflight
        working-directory: crates/forge3d-web
        run: npx playwright install chromium

      - name: Print bundled Chromium preflight diagnostics
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
        run: |
          echo "FORGE3D_WEBGPU_REQUIRED=$env:FORGE3D_WEBGPU_REQUIRED"
          echo "Bundled Playwright Chromium is a flagged preflight that can produce ENGINE_PASS-only evidence"
          echo "It is not branded Chrome or Edge support evidence"
          echo "Playwright tests evaluate navigator.gpu before render assertions"
          npm run test:browser:chromium -- --grep "reports browser WebGPU diagnostics"

      - name: Run bundled Chromium preflight (ENGINE_PASS only)
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
          FORGE3D_SOURCE_BENCHMARK_MODE: probe
        run: npm run test:browser:chromium

      - name: Upload source-browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-source-browser-evidence
          path: crates/forge3d-web/test-results/**/browser-evidence.json
          if-no-files-found: error
          retention-days: 30

  webkit-engine-preflight:
    name: Web Runtime / Playwright WebKit Engine Preflight
    needs: build-and-contract
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - name: Check out the protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable reviewed 2026-07-28
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Install Playwright WebKit engine
        working-directory: crates/forge3d-web
        run: npx playwright install webkit

      - name: Capture expected Playwright WebKit suite inventory
        working-directory: crates/forge3d-web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/forge3d-web-webkit-preflight-expected.json
        run: npx playwright test --list --project=webkit-preflight --reporter=json

      - name: Run Playwright WebKit engine preflight
        id: webkit-tests
        continue-on-error: true
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
          FORGE3D_SOURCE_BENCHMARK_MODE: probe
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-preflight-actual.json
        run: npm run test:browser:webkit -- --reporter=json

      - name: Classify Playwright WebKit engine preflight
        id: classify-webkit
        if: always()
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBKIT_EXPECTED_REPORT: ${{ runner.temp }}/forge3d-web-webkit-preflight-expected.json
          FORGE3D_WEBKIT_ACTUAL_REPORT: test-results/webkit-preflight-actual.json
          FORGE3D_WEBKIT_RAW_OUTCOME: ${{ steps.webkit-tests.outcome }}
        run: npm run classify:browser:webkit

      - name: Upload successful Playwright WebKit ENGINE_PASS evidence
        if: steps.webkit-tests.outcome == 'success' && steps.classify-webkit.outcome == 'success' && steps.classify-webkit.outputs.engine_pass_eligible == 'true' && steps.classify-webkit.outputs.classification == 'ENGINE_PASS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-playwright-webkit-ENGINE_PASS
          path: crates/forge3d-web/test-results
          if-no-files-found: error
          retention-days: 30
