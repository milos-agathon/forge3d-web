name: Web Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-contract:
    name: Web Runtime / Build And Contract Tests
    runs-on: windows-latest
    # The full corpus and bounded live-download retries exceed 40m on slower runners.
    # Only the outer job budget changes; per-test deadlines and runtime budgets stay fixed.
    timeout-minutes: 60

    steps:
      - name: Check out the protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable reviewed 2026-07-28
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Verify composite parity manifest
        working-directory: crates/forge3d-web
        run: npm run verify:parity

      - name: Check core no-default wasm build
        run: cargo check -p forge3d-core --target wasm32-unknown-unknown --no-default-features

      - name: Check web wasm build
        run: cargo check -p forge3d-web --target wasm32-unknown-unknown

      - name: Test core GPU contracts
        run: cargo test -p forge3d-core --features gpu

      - name: Test core WebGPU contracts (camera, lighting, shadows, native oracles)
        run: cargo test -p forge3d-core --features webgpu

      - name: Test web crate contracts
        run: cargo test -p forge3d-web

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: |
          npm ci --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path node_modules/.bin/wasm-pack.cmd)) {
            throw "npm ci completed without installing the wasm-pack command shim"
          }

      - name: Build wasm package
        working-directory: crates/forge3d-web
        run: npm run build:wasm

      - name: Test TypeScript units
        working-directory: crates/forge3d-web
        run: npm run test:unit

      - name: Test browser API contract
        working-directory: crates/forge3d-web
        run: npm run test:api

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Test browser package and infrastructure contracts
        working-directory: crates/forge3d-web
        run: npm run test:package

      - name: Verify publish dry run
        working-directory: crates/forge3d-web
        run: npm pack --dry-run

      - name: Install Chromium for packed consumer
        working-directory: crates/forge3d-web
        run: npx playwright install chromium

      - name: Test clean installed tarball in bundled Chromium preflight
        working-directory: crates/forge3d-web
        env:
          FORGE3D_BROWSER_CHANNEL: bundled
          FORGE3D_EVIDENCE_DIR: test-results/browser-gate
          FORGE3D_PACKAGE_GATE_MODE: probe
        run: npm run test:package-consumer

      - name: Test W13 installed labels and shaping assets
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w13

      - name: Test W14 installed CRS, dataset integrity and offline workers
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w14

      - name: Test W15 installed geometry, mesh IO and building workflows
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w15

      - name: Test W16 installed point clouds and 3D Tiles conformance
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w16

      - name: Test W21 installed offline licensing, PNG utilities and benchmarks
        id: w21-installed
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w21

      - name: Upload W21 installed-tarball evidence
        if: always() && steps.w21-installed.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-w21-installed
          path: |
            crates/forge3d-web/test-results/w21-package-consumer.json
            crates/forge3d-web/test-results/w21-installed-playwright.json
            crates/forge3d-web/test-results/w21-installed-output
          if-no-files-found: error
          retention-days: 30

      - name: Test W19 installed styles, bundles and review variants
        id: w19-installed
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w19

      - name: Upload W19 installed-tarball evidence
        if: always() && steps.w19-installed.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-w19-installed
          path: |
            crates/forge3d-web/test-results/w19-package-consumer.json
            crates/forge3d-web/test-results/w19-installed-playwright.json
            crates/forge3d-web/test-results/w19-installed-output
          if-no-files-found: error
          retention-days: 30

      - name: Install independent W20 PDF renderer
        working-directory: crates/forge3d-web
        run: python -m pip install -r scripts/requirements-w20.txt

      - name: Test W20 installed cartographic exports and worker composition
        id: w20-installed
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w20

      - name: Upload W20 installed cartography evidence
        if: always() && steps.w20-installed.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-w20-installed
          path: |
            crates/forge3d-web/test-results/w20-package-consumer.json
            crates/forge3d-web/test-results/w20-installed-playwright.json
            crates/forge3d-web/test-results/w20-pdf-render.json
            crates/forge3d-web/test-results/w20-bundled-consumer.json
            crates/forge3d-web/test-results/w20-installed-output
          if-no-files-found: error
          retention-days: 30

      - name: Set up Python for W23 independent native oracles
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Audit W23 native source completeness independently
        working-directory: crates/forge3d-web
        run: python ../../scripts/audit-w23-native.py

      - name: Recompute W23 converted native oracles independently
        working-directory: crates/forge3d-web
        run: |
          python -m pip install numpy==2.5.1 pillow==12.2.0 scipy==1.16.0 rasterio==1.4.3
          python scripts/generate-w23-goldens.py --check
          python scripts/generate-w23-application-fixtures.py --check

      - name: Test W23 installed migration workflows and documentation
        id: w23-installed
        working-directory: crates/forge3d-web
        run: npm run test:package-consumer:w23

      - name: Upload W23 installed migration evidence
        if: always() && steps.w23-installed.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-w23-installed
          path: crates/forge3d-web/test-results/w23-installed
          if-no-files-found: error
          retention-days: 30

      - name: Fuzz pinned W16 LAZ chunks through owned workers
        working-directory: crates/forge3d-web
        env:
          FORGE3D_REVIEW_SHA: ${{ github.sha }}
          FORGE3D_W16_FUZZ_REPORT: test-results/w16-laz-fuzz.json
        run: node scripts/fuzz-w16-laz.mjs

      - name: Fetch all W14 remote datasets through default registry URLs
        working-directory: crates/forge3d-web
        timeout-minutes: 10
        run: npm run test:datasets:remote

      - name: Upload exact-tarball browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-browser-gate
          path: crates/forge3d-web/test-results/browser-gate
          if-no-files-found: error
          retention-days: 30

  browser-preflight:
    name: Web Runtime / Browser Preflight
    needs: build-and-contract
    runs-on: macos-15
    # The pre-W22 two-engine corpus already takes about 123 minutes on hosted macOS.
    # Allow W22 full-resolution coverage and runner variation; per-test budgets stay fixed.
    timeout-minutes: 180

    steps:
      - name: Check out the protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable reviewed 2026-07-28
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Install bundled Chromium and Firefox for engine preflights
        working-directory: crates/forge3d-web
        run: npx playwright install chromium firefox

      - name: Print bundled Chromium preflight diagnostics
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
        run: |
          echo "FORGE3D_WEBGPU_REQUIRED=$FORGE3D_WEBGPU_REQUIRED"
          echo "Bundled Playwright Chromium is a flagged preflight that can produce ENGINE_PASS-only evidence"
          echo "It is not branded Chrome or Edge support evidence"
          echo "Playwright tests evaluate navigator.gpu before render assertions"
          npm run test:browser:chromium -- --grep "reports browser WebGPU diagnostics"

      - name: Probe W19 native migration in Chromium before the full corpus
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
        run: npx playwright test tests/playwright/w19_style_bundle.spec.ts --project=chromium-preflight --grep native-saver --max-failures=1

      - name: Run bundled Chromium preflight (ENGINE_PASS only)
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
          FORGE3D_SOURCE_BENCHMARK_MODE: probe
        run: npm run test:browser:chromium

      - name: Upload source-browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-source-browser-evidence
          path: crates/forge3d-web/test-results/**/browser-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Print bundled Firefox preflight diagnostics with default preferences
        working-directory: crates/forge3d-web
        env:
          FORGE3D_HEADED: "1"
          FORGE3D_WEBGPU_REQUIRED: "1"
          FORGE3D_SOURCE_BENCHMARK_MODE: probe
        run: |
          echo "FORGE3D_WEBGPU_REQUIRED=$FORGE3D_WEBGPU_REQUIRED"
          echo "FORGE3D_SOURCE_BENCHMARK_MODE=$FORGE3D_SOURCE_BENCHMARK_MODE"
          echo "Bundled Playwright Firefox runs with default preferences and can produce ENGINE_PASS-only evidence"
          echo "It is not branded Firefox, physical-browser, or exact-tarball support evidence"
          npm run test:browser:firefox-preflight -- --grep "reports browser WebGPU diagnostics"

      - name: Probe W19 native migration in Firefox before the full corpus
        working-directory: crates/forge3d-web
        env:
          FORGE3D_HEADED: "1"
          FORGE3D_WEBGPU_REQUIRED: "1"
        run: npx playwright test tests/playwright/w19_style_bundle.spec.ts --project=firefox-preflight --grep native-saver --max-failures=1

      - name: Run bundled Firefox preflight with default preferences (ENGINE_PASS only)
        working-directory: crates/forge3d-web
        env:
          FORGE3D_HEADED: "1"
          FORGE3D_WEBGPU_REQUIRED: "1"
          FORGE3D_SOURCE_BENCHMARK_MODE: probe
        run: npm run test:browser:firefox-preflight

      - name: Upload Firefox preflight ENGINE_PASS default-preferences evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-firefox-preflight-ENGINE_PASS-default-preferences
          path: crates/forge3d-web/test-results/**/browser-evidence.json
          if-no-files-found: error
          retention-days: 30

  webkit-engine-preflight:
    name: Web Runtime / Playwright WebKit Engine Preflight
    needs: build-and-contract
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - name: Check out the protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable reviewed 2026-07-28
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: crates/forge3d-web/package-lock.json

      - name: Install web package dependencies
        working-directory: crates/forge3d-web
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build browser package
        working-directory: crates/forge3d-web
        run: npm run build

      - name: Install Playwright WebKit engine
        working-directory: crates/forge3d-web
        run: npx playwright install webkit

      - name: Capture expected Playwright WebKit suite inventory
        working-directory: crates/forge3d-web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/forge3d-web-webkit-preflight-expected.json
        run: npx playwright test --list --project=webkit-preflight --reporter=json

      - name: Run Playwright WebKit engine preflight
        id: webkit-tests
        continue-on-error: true
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBGPU_REQUIRED: "1"
          FORGE3D_SOURCE_BENCHMARK_MODE: probe
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-preflight-actual.json
        run: npm run test:browser:webkit -- --reporter=json

      - name: Classify Playwright WebKit engine preflight
        id: classify-webkit
        if: always()
        working-directory: crates/forge3d-web
        env:
          FORGE3D_WEBKIT_EXPECTED_REPORT: ${{ runner.temp }}/forge3d-web-webkit-preflight-expected.json
          FORGE3D_WEBKIT_ACTUAL_REPORT: test-results/webkit-preflight-actual.json
          FORGE3D_WEBKIT_RAW_OUTCOME: ${{ steps.webkit-tests.outcome }}
        run: npm run classify:browser:webkit

      - name: Upload successful Playwright WebKit ENGINE_PASS evidence
        if: steps.webkit-tests.outcome == 'success' && steps.classify-webkit.outcome == 'success' && steps.classify-webkit.outputs.engine_pass_eligible == 'true' && steps.classify-webkit.outputs.classification == 'ENGINE_PASS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge3d-web-playwright-webkit-ENGINE_PASS
          path: crates/forge3d-web/test-results
          if-no-files-found: error
          retention-days: 30
