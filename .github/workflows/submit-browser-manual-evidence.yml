name: Submit Browser Manual Evidence

on:
  workflow_dispatch:
    inputs:
      intakeReleaseId:
        description: Numeric draft intake release database ID
        required: true
        type: string
      mediaAssetIds:
        description: Canonical ordered JSON array of numeric release asset IDs
        required: true
        type: string
      manualSessionRunId:
        description: Exact Browser Hardware workflow run ID
        required: true
        type: string
      hardwareJobId:
        description: Exact Browser Hardware execution job ID
        required: true
        type: string
      step_results:
        description: Canonical JSON object covering every attested checklist step
        required: true
        type: string

permissions: {}

jobs:
  observe-manual-submission-trust:
    name: Manual Evidence / Observe Submission Trust
    runs-on: ubuntu-latest
    environment: forge3d-trust-observer
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
    outputs:
      observation_artifact_id: ${{ steps.upload-observation.outputs.artifact-id }}
      observation_artifact_name: ${{ steps.emit-observation.outputs.artifact-name }}
      observation_artifact_digest: ${{ steps.upload-observation.outputs.artifact-digest }}
      observation_content_sha256: ${{ steps.emit-observation.outputs.content-sha256 }}

    steps:
      - name: Reject dispatch outside protected main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out protected observer code
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Mint short-lived trust-observer token
        id: observer-token
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_APP_ID: ${{ secrets.TRUST_OBSERVER_APP_ID }}
          TRUST_OBSERVER_INSTALLATION_ID: ${{ secrets.TRUST_OBSERVER_INSTALLATION_ID }}
          TRUST_OBSERVER_PRIVATE_KEY: ${{ secrets.TRUST_OBSERVER_PRIVATE_KEY }}
        run: node scripts/mint-github-app-token.mjs

      - name: Verify live trust and derive exact intake target
        id: intake-target
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ steps.observer-token.outputs.token }}
          INTAKE_RELEASE_ID: ${{ inputs.intakeReleaseId }}
        run: |
          node scripts/verify-repository-trust.mjs > repository-trust-verification.json
          node --input-type=module --eval '
            const id = process.env.INTAKE_RELEASE_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error("intake release ID must be numeric");
            const response = await fetch(
              `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/${id}`,
              { headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" } }
            );
            if (!response.ok) throw new Error(`intake release lookup failed: ${response.status}`);
            const release = await response.json();
            if (release.draft !== true || !/^[0-9a-f]{40}$/.test(release.target_commitish)) {
              throw new Error("intake release is not a full-SHA draft");
            }
            await import("node:fs").then(({ writeFileSync }) =>
              writeFileSync(process.env.GITHUB_OUTPUT, `target-sha=${release.target_commitish}\n`, { flag: "a" })
            );
          '

      - name: Emit target-bound submission observation
        id: emit-observation
        working-directory: crates/forge3d-web
        run: |
          node scripts/emit-repository-trust-observation.mjs \
            --verification repository-trust-verification.json \
            --operation submit-manual-evidence \
            --consumer submit-manual-evidence@forge3d-manual-evidence \
            --workflow-path .github/workflows/submit-browser-manual-evidence.yml \
            --workflow-ref refs/heads/main \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ steps.intake-target.outputs.target-sha }}" \
            --target-sha "${{ steps.intake-target.outputs.target-sha }}" \
            --output repository-trust-observation.json
          artifact_name="repository-trust-${{ github.run_id }}-${{ github.run_attempt }}-submit-manual-evidence"
          content_sha256="$(sha256sum repository-trust-observation.json | cut -d ' ' -f 1)"
          echo "artifact-name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "content-sha256=${content_sha256}" >> "$GITHUB_OUTPUT"

      - name: Revoke trust-observer token
        if: always() && steps.observer-token.outputs.token != ''
        working-directory: crates/forge3d-web
        env:
          OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: |
          node --input-type=module --eval '
            const response = await fetch("https://api.github.com/installation/token", {
              method: "DELETE",
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.OBSERVER_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" }
            });
            if (response.status !== 204) throw new Error(`token revocation failed: ${response.status}`);
          '

      - name: Upload exact observation
        id: upload-observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.emit-observation.outputs.artifact-name }}
          path: crates/forge3d-web/repository-trust-observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Attest GitHub-hosted observation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/repository-trust-observation.json

  submit-manual-evidence:
    name: Manual Evidence / Submit Authenticated Bundle
    needs: observe-manual-submission-trust
    runs-on: ubuntu-latest
    environment: forge3d-manual-evidence
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Check out protected validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve read-only draft and verify exact observation
        id: intake
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-manual-submission-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-manual-submission-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-manual-submission-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-manual-submission-trust.outputs.observation_content_sha256 }}
          INTAKE_RELEASE_ID: ${{ inputs.intakeReleaseId }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${INTAKE_RELEASE_ID}" -eq "${INTAKE_RELEASE_ID}" 2>/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${INTAKE_RELEASE_ID}" > intake-release-api.json
          target_sha="$(node -p "require('./intake-release-api.json').target_commitish")"
          test "${#target_sha}" -eq 40
          echo "target-sha=${target_sha}" >> "$GITHUB_OUTPUT"
          EXPECTED_OPERATION=submit-manual-evidence \
          EXPECTED_CONSUMER_JOB=submit-manual-evidence \
          EXPECTED_CONSUMER_ENVIRONMENT=forge3d-manual-evidence \
          EXPECTED_TARGET_SHA="${target_sha}" \
          EXPECTED_CANDIDATE_SHA="${target_sha}" \
          EXPECTED_CURRENT_MAIN_SHA="${GITHUB_SHA}" \
          EXPECTED_WORKFLOW_PATH=.github/workflows/submit-browser-manual-evidence.yml \
            node scripts/verify-repository-trust-observation.mjs
          epoch="$(node -p "require('./tests/infrastructure/repository-trust-policy.json').trustEpochSha")"
          test "${target_sha}" != "${epoch}"
          git merge-base --is-ancestor "${epoch}" "${target_sha}"
          git merge-base --is-ancestor "${target_sha}" "${GITHUB_SHA}"

      - name: Validate closed scalar dispatch inputs
        working-directory: crates/forge3d-web
        env:
          INTAKE_RELEASE_ID: ${{ inputs.intakeReleaseId }}
          MEDIA_ASSET_IDS: ${{ inputs.mediaAssetIds }}
          MANUAL_SESSION_RUN_ID: ${{ inputs.manualSessionRunId }}
          HARDWARE_JOB_ID: ${{ inputs.hardwareJobId }}
          STEP_RESULTS: ${{ inputs.step_results }}
        run: |
          node --input-type=module --eval '
            import { writeFileSync } from "node:fs";
            import { parseManualSubmissionDispatch } from "./scripts/prepare-manual-submission.mjs";
            const dispatch = {
              intakeReleaseId: process.env.INTAKE_RELEASE_ID,
              mediaAssetIds: process.env.MEDIA_ASSET_IDS,
              manualSessionRunId: process.env.MANUAL_SESSION_RUN_ID,
              hardwareJobId: process.env.HARDWARE_JOB_ID,
              stepResults: process.env.STEP_RESULTS
            };
            parseManualSubmissionDispatch(dispatch);
            writeFileSync("manual-dispatch.json", JSON.stringify(dispatch));
          '

      - name: Download and verify attested intake manifest
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          intake_asset_id="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("intake-release-api.json", "utf8"));
            const matches = release.assets.filter((asset) => asset.name === "intake-manifest.json");
            if (matches.length !== 1) throw new Error("expected one intake manifest asset");
            process.stdout.write(String(matches[0].id));
          ')"
          gh api -H "Accept: application/octet-stream" \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/${intake_asset_id}" \
            > intake-manifest.json
          gh attestation verify intake-manifest.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/prepare-browser-manual-evidence.yml \
            --source-ref refs/heads/main \
            --source-digest "$(node -p "require('./intake-manifest.json').prepareRun.workflowSha")" \
            --deny-self-hosted-runners

      - name: Resolve exact successful session run, job, and artifacts
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_SESSION_RUN_ID: ${{ inputs.manualSessionRunId }}
          HARDWARE_JOB_ID: ${{ inputs.hardwareJobId }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${MANUAL_SESSION_RUN_ID}" > session-run-api.json
          run_attempt="$(node -p "require('./session-run-api.json').run_attempt")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${MANUAL_SESSION_RUN_ID}/attempts/${run_attempt}/jobs?per_page=100" > session-jobs-api.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${MANUAL_SESSION_RUN_ID}/artifacts?per_page=100" > session-artifacts-api.json
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const run = JSON.parse(readFileSync("session-run-api.json", "utf8"));
            const jobs = JSON.parse(readFileSync("session-jobs-api.json", "utf8")).jobs;
            const artifacts = JSON.parse(readFileSync("session-artifacts-api.json", "utf8")).artifacts;
            const jobId = Number(process.env.HARDWARE_JOB_ID);
            if (
              run.path !== ".github/workflows/browser-hardware.yml" ||
              run.head_branch !== "main" ||
              run.event !== "workflow_dispatch" ||
              run.status !== "completed" ||
              run.conclusion !== "success"
            ) throw new Error("manual session workflow run is not successful protected main");
            const job = jobs.filter((candidate) => candidate.id === jobId);
            const final = artifacts.filter((artifact) =>
              artifact.name === `finalized-manual-session-${run.id}-${run.run_attempt}`
            );
            const auth = artifacts.filter((artifact) =>
              artifact.name.startsWith("runner-authorization-")
            );
            if (job.length !== 1 || final.length !== 1 || auth.length !== 1) {
              throw new Error("manual session job/finalizer/authorization does not resolve exactly once");
            }
            writeFileSync("session-resolution.json", JSON.stringify({
              hardwareJob: job[0],
              finalizedArtifact: final[0],
              authorizationArtifact: auth[0]
            }));
          '
          for kind in finalized authorization; do
            artifact_id="$(node -p "require('./session-resolution.json').${kind}Artifact.id")"
            expected="$(node -p "require('./session-resolution.json').${kind}Artifact.digest")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${kind}.zip"
            test "$(sha256sum "${kind}.zip" | cut -d ' ' -f 1)" = "${expected#sha256:}"
            mkdir "${kind}"
            unzip -q "${kind}.zip" -d "${kind}"
          done
          test "$(find finalized -name signed-manual-session.json -type f | wc -l)" -eq 1
          test "$(find finalized -name manual-session-finalizer.json -type f | wc -l)" -eq 1
          test "$(find authorization -name runner-authorization.json -type f | wc -l)" -eq 1

      - name: Verify hosted attestations and controller signature
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_sha="$(node -p "require('./session-run-api.json').head_sha")"
          for subject in \
            "$(find finalized -name signed-manual-session.json -type f)" \
            "$(find finalized -name manual-session-finalizer.json -type f)" \
            "$(find authorization -name runner-authorization.json -type f)"
          do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/browser-hardware.yml \
              --source-ref refs/heads/main \
              --source-digest "${workflow_sha}" \
              --deny-self-hosted-runners
          done
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            import { canonicalJson, sha256Hex } from "./scripts/canonical-json.mjs";
            import { verifySignedManualSession } from "./scripts/finalize-manual-session.mjs";
            const signedSession = JSON.parse(readFileSync(
              process.argv[1], "utf8"
            ));
            const record = JSON.parse(readFileSync(
              process.argv[2], "utf8"
            ));
            const jobs = JSON.parse(readFileSync("session-jobs-api.json", "utf8")).jobs;
            verifySignedManualSession({
              signedSession,
              authorization: { record, sha256: sha256Hex(canonicalJson(record)) },
              hardwareJob: jobs.find((job) => job.id === signedSession.record.hardwareJobId),
              matrix: JSON.parse(readFileSync("tests/infrastructure/hardware-matrix.json", "utf8"))
            });
          ' \
            "$(find finalized -name signed-manual-session.json -type f)" \
            "$(find authorization -name runner-authorization.json -type f)"

      - name: Download selected media only by numeric asset ID
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir media media-api
          node -p "JSON.parse(require('./manual-dispatch.json').mediaAssetIds).join('\\n')" |
          while IFS= read -r asset_id; do
            test "${asset_id}" -eq "${asset_id}"
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "media-api/${asset_id}.json"
            gh api -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "media/${asset_id}"
          done

      - name: Resolve implementation actors and protected-environment approvals
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.intake.outputs.target-sha }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases-api.json
          previous_tag="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const releases = JSON.parse(readFileSync("releases-api.json", "utf8"));
            const previous = releases.find((release) =>
              !release.draft && !release.prerelease && /^v?[0-9]+\\.[0-9]+\\.[0-9]+$/.test(release.tag_name)
            );
            if (previous) process.stdout.write(previous.tag_name);
          ')"
          node scripts/resolve-implementation-actors.mjs \
            --target-sha "${TARGET_SHA}" \
            --previous-tag "${previous_tag}" \
            --output implementation-actors.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > submission-approvals.json

      - name: Generate closed evidence and byte-identical bundle
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          node --input-type=module --eval '
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const read = (path) => JSON.parse(readFileSync(path, "utf8"));
            const signedSessionPath = process.argv[1];
            const finalizerPath = process.argv[2];
            const mediaPaths = Object.fromEntries(
              readdirSync("media").map((id) => [id, `media/${id}`])
            );
            const mediaMetadata = readdirSync("media-api")
              .map((name) => read(`media-api/${name}`));
            const releaseApi = read("intake-release-api.json");
            const input = {
              dispatch: read("manual-dispatch.json"),
              releaseApi,
              intake: read("intake-manifest.json"),
              intakePath: "intake-manifest.json",
              signedSession: read(signedSessionPath),
              signedSessionPath,
              sessionFinalizer: read(finalizerPath),
              sessionFinalizerPath: finalizerPath,
              sessionRunApi: read("session-run-api.json"),
              hardwareJobApi: read("session-resolution.json").hardwareJob,
              releaseAssets: releaseApi.assets.map((asset) =>
                mediaMetadata.find((candidate) => candidate.id === asset.id) ?? asset
              ),
              mediaPaths,
              approvals: read("submission-approvals.json"),
              implementationActors: read("implementation-actors.json").actors,
              actor: process.env.GITHUB_ACTOR,
              submissionRun: {
                id: Number(process.env.GITHUB_RUN_ID),
                attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                workflowSha: process.env.GITHUB_WORKFLOW_SHA
              }
            };
            writeFileSync("manual-submission-input.json", JSON.stringify(input));
          ' \
            "$(find finalized -name signed-manual-session.json -type f)" \
            "$(find finalized -name manual-session-finalizer.json -type f)"
          node scripts/prepare-manual-submission.mjs \
            manual-submission-input.json \
            validated-manual-submission.json
          node scripts/validate-manual-evidence.mjs \
            --input validated-manual-submission.json \
            --output manual-evidence.json
          checklist_id="$(node -p "require('./intake-manifest.json').checklistId")"
          if test "${checklist_id}" = "infrastructure-manual-canary"; then
            cp manual-evidence.json lab-manual-canary-source.json
          else
            node --input-type=module --eval '
              import { readFileSync, writeFileSync } from "node:fs";
              writeFileSync("manual-matrix-input.json", JSON.stringify({
                evidence: JSON.parse(readFileSync("manual-evidence.json", "utf8")),
                run: {
                  id: Number(process.env.GITHUB_RUN_ID),
                  attempt: Number(process.env.GITHUB_RUN_ATTEMPT)
                }
              }));
            '
            node scripts/create-browser-matrix-record.mjs \
              manual \
              manual-matrix-input.json \
              browser-matrix-record-source.json
          fi
          mkdir manual-evidence-bundle
          cp manual-evidence.json intake-manifest.json manual-evidence-bundle/
          if test -f lab-manual-canary-source.json; then
            cp lab-manual-canary-source.json manual-evidence-bundle/
          else
            cp browser-matrix-record-source.json manual-evidence-bundle/
          fi
          cp media/* manual-evidence-bundle/
          cp "$(find finalized -name signed-manual-session.json -type f)" manual-evidence-bundle/
          cp "$(find finalized -name manual-session-finalizer.json -type f)" manual-evidence-bundle/

      - name: Attest generated evidence and exact media bundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/manual-evidence-bundle/*

      - name: Verify retained bundle attestation
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in manual-evidence-bundle/*; do
            gh attestation verify "${subject}" \
              --repo milos-agathon/forge3d-web \
              --signer-workflow milos-agathon/forge3d-web/.github/workflows/submit-browser-manual-evidence.yml \
              --source-ref refs/heads/main \
              --source-digest "${{ github.workflow_sha }}" \
              --deny-self-hosted-runners
          done

      - name: Upload authenticated manual-evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-manual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/forge3d-web/manual-evidence-bundle/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
