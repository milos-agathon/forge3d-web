name: Prepare Browser Manual Evidence

on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Full protected-main candidate SHA
        required: true
        type: string
      packageRunId:
        description: Exact successful Browser Package run ID
        required: true
        type: string
      checklistId:
        description: Checked manual checklist
        required: true
        type: choice
        options:
          - infrastructure-manual-canary
          - mobile-multitouch
          - safari-trackpad
      assetId:
        description: Checked mobile or trackpad asset
        required: true
        type: choice
        options:
          - FW-TRACKPAD-01
          - FW-AND-QCOM-01
          - FW-AND-MALI-01
          - FW-AND-PEN-01
          - FW-IOS-OLD-01
          - FW-IOS-NEW-01
          - FW-IPAD-01

permissions: {}

jobs:
  observe-manual-intake-trust:
    name: Manual Evidence / Observe Intake Trust
    runs-on: ubuntu-latest
    environment: forge3d-trust-observer
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
    outputs:
      observation_artifact_id: ${{ steps.upload-observation.outputs.artifact-id }}
      observation_artifact_name: ${{ steps.emit-observation.outputs.artifact-name }}
      observation_artifact_digest: ${{ steps.upload-observation.outputs.artifact-digest }}
      observation_content_sha256: ${{ steps.emit-observation.outputs.content-sha256 }}

    steps:
      - name: Reject dispatch outside protected main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out protected observer code
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Mint short-lived trust-observer token
        id: observer-token
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_APP_ID: ${{ secrets.TRUST_OBSERVER_APP_ID }}
          TRUST_OBSERVER_INSTALLATION_ID: ${{ secrets.TRUST_OBSERVER_INSTALLATION_ID }}
          TRUST_OBSERVER_PRIVATE_KEY: ${{ secrets.TRUST_OBSERVER_PRIVATE_KEY }}
        run: node scripts/mint-github-app-token.mjs

      - name: Verify live repository trust
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: node scripts/verify-repository-trust.mjs > repository-trust-verification.json

      - name: Emit intake-bound trust observation
        id: emit-observation
        working-directory: crates/forge3d-web
        run: |
          node scripts/emit-repository-trust-observation.mjs \
            --verification repository-trust-verification.json \
            --operation prepare-manual-intake \
            --consumer prepare-manual-intake@forge3d-manual-evidence \
            --workflow-path .github/workflows/prepare-browser-manual-evidence.yml \
            --workflow-ref refs/heads/main \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ inputs.trusted_sha }}" \
            --target-sha "${{ inputs.trusted_sha }}" \
            --output repository-trust-observation.json
          artifact_name="repository-trust-${{ github.run_id }}-${{ github.run_attempt }}-prepare-manual-intake"
          content_sha256="$(sha256sum repository-trust-observation.json | cut -d ' ' -f 1)"
          echo "artifact-name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "content-sha256=${content_sha256}" >> "$GITHUB_OUTPUT"

      - name: Revoke trust-observer token
        if: always() && steps.observer-token.outputs.token != ''
        working-directory: crates/forge3d-web
        env:
          OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: |
          node --input-type=module --eval '
            const response = await fetch("https://api.github.com/installation/token", {
              method: "DELETE",
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.OBSERVER_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" }
            });
            if (response.status !== 204) throw new Error(`token revocation failed: ${response.status}`);
          '

      - name: Upload exact observation
        id: upload-observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.emit-observation.outputs.artifact-name }}
          path: crates/forge3d-web/repository-trust-observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Attest GitHub-hosted observation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/repository-trust-observation.json

  prepare-manual-intake:
    name: Manual Evidence / Prepare Draft Intake
    needs: observe-manual-intake-trust
    runs-on: ubuntu-latest
    environment: forge3d-manual-evidence
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out protected validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact observation after independent approval
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-manual-intake-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-manual-intake-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-manual-intake-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-manual-intake-trust.outputs.observation_content_sha256 }}
          EXPECTED_OPERATION: prepare-manual-intake
          EXPECTED_CONSUMER_JOB: prepare-manual-intake
          EXPECTED_CONSUMER_ENVIRONMENT: forge3d-manual-evidence
          EXPECTED_TARGET_SHA: ${{ inputs.trusted_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.trusted_sha }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/prepare-browser-manual-evidence.yml
        run: node scripts/verify-repository-trust-observation.mjs

      - name: Verify strict post-epoch target and package run
        id: package
        working-directory: crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          epoch="$(node -p "require('./tests/infrastructure/repository-trust-policy.json').trustEpochSha")"
          test "${#epoch}" -eq 40
          test "${{ inputs.trusted_sha }}" != "${epoch}"
          git merge-base --is-ancestor "${epoch}" "${{ inputs.trusted_sha }}"
          git merge-base --is-ancestor "${{ inputs.trusted_sha }}" "${{ github.sha }}"
          node scripts/resolve-hardware-promotion.mjs \
            --package-run-id "${{ inputs.packageRunId }}" \
            --trusted-sha "${{ inputs.trusted_sha }}" \
            --output package-run.json

      - name: Download and verify exact package manifest
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.package.outputs.package-artifact-id }}/zip" > package.zip
          actual="$(sha256sum package.zip | cut -d ' ' -f 1)"
          expected="${{ steps.package.outputs.package-artifact-digest }}"
          test "${actual}" = "${expected#sha256:}"
          mkdir package
          unzip -q package.zip -d package
          gh attestation verify package/browser-package-manifest.json \
            --repo milos-agathon/forge3d-web \
            --signer-workflow milos-agathon/forge3d-web/.github/workflows/browser-package.yml \
            --source-ref refs/heads/main \
            --source-digest "${{ inputs.trusted_sha }}" \
            --deny-self-hosted-runners
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            import { verifyPackageManifestProvenance } from "./scripts/resolve-hardware-promotion.mjs";
            verifyPackageManifestProvenance({
              manifest: JSON.parse(readFileSync("package/browser-package-manifest.json", "utf8")),
              packageRun: JSON.parse(readFileSync("package-run.json", "utf8"))
            });
          '

      - name: Generate closed intake manifest
        working-directory: crates/forge3d-web
        env:
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
          PACKAGE_RUN_ID: ${{ inputs.packageRunId }}
          CHECKLIST_ID: ${{ inputs.checklistId }}
          ASSET_ID: ${{ inputs.assetId }}
          EXPECTED_TESTER: ${{ github.actor }}
        run: |
          node --input-type=module --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            const packageManifest = JSON.parse(readFileSync("package/browser-package-manifest.json", "utf8"));
            const hardwareMatrix = JSON.parse(readFileSync("tests/infrastructure/hardware-matrix.json", "utf8"));
            const deviceMatrix = JSON.parse(readFileSync("tests/device/device-matrix.json", "utf8"));
            const input = {
              trustedSha: process.env.TRUSTED_SHA,
              packageRunId: Number(process.env.PACKAGE_RUN_ID),
              packageSha256: packageManifest.packageSha256,
              checklistId: process.env.CHECKLIST_ID,
              assetId: process.env.ASSET_ID,
              hardwareMatrix,
              deviceMatrix,
              expectedTester: process.env.EXPECTED_TESTER,
              prepareRun: {
                id: Number(process.env.GITHUB_RUN_ID),
                attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                workflowSha: process.env.GITHUB_WORKFLOW_SHA
              }
            };
            writeFileSync("intake-input.json", JSON.stringify(input));
          '
          node scripts/manual-evidence.mjs \
            --operation create-intake \
            --input intake-input.json \
            --output intake-manifest.json

      - name: Attest intake manifest before release mutation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/intake-manifest.json

      - name: Create unpublished draft and upload manifest without clobber
        shell: bash
        working-directory: crates/forge3d-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="manual-evidence-intake-${GITHUB_RUN_ID}"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ inputs.trusted_sha }}" \
            --title "Forge3D manual evidence intake ${GITHUB_RUN_ID}" \
            --notes "Authenticated media intake; expires within 24 hours." \
            --draft
          gh release upload "${tag}" intake-manifest.json --repo "${GITHUB_REPOSITORY}"
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > intake-release.json
