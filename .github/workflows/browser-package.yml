name: Browser Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  browser-package-bootstrap:
    name: Browser Package / Bootstrap Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_enabled: ${{ steps.activation.outputs.package-enabled }}

    steps:
      - name: Check out exact bootstrap policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve protected-main package activation
        id: activation
        working-directory: crates/forge3d-web
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/resolve-package-bootstrap.mjs

  observe-package-trust:
    name: Browser Package / Observe Trusted Source
    needs: browser-package-bootstrap
    if: needs.browser-package-bootstrap.outputs.package_enabled == 'true'
    runs-on: ubuntu-latest
    environment: forge3d-trust-observer
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: read
      id-token: write
    outputs:
      observation_artifact_id: ${{ steps.upload-observation.outputs.artifact-id }}
      observation_artifact_name: ${{ steps.emit-observation.outputs.artifact-name }}
      observation_artifact_digest: ${{ steps.upload-observation.outputs.artifact-digest }}
      observation_content_sha256: ${{ steps.emit-observation.outputs.content-sha256 }}

    steps:
      - name: Reject execution outside protected main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out protected observer code
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Mint short-lived trust-observer token
        id: observer-token
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_APP_ID: ${{ secrets.TRUST_OBSERVER_APP_ID }}
          TRUST_OBSERVER_INSTALLATION_ID: ${{ secrets.TRUST_OBSERVER_INSTALLATION_ID }}
          TRUST_OBSERVER_PRIVATE_KEY: ${{ secrets.TRUST_OBSERVER_PRIVATE_KEY }}
        run: node scripts/mint-github-app-token.mjs

      - name: Verify live policy, trust epoch, and exact-SHA required checks
        working-directory: crates/forge3d-web
        env:
          TRUST_OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-repository-trust.mjs > repository-trust-verification.json

      - name: Emit exact package trust observation
        id: emit-observation
        working-directory: crates/forge3d-web
        run: |
          node scripts/emit-repository-trust-observation.mjs \
            --verification repository-trust-verification.json \
            --operation build-browser-package \
            --consumer build-trusted-browser-package@none \
            --workflow-path .github/workflows/browser-package.yml \
            --workflow-ref refs/heads/main \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ github.sha }}" \
            --target-sha "${{ github.sha }}" \
            --output repository-trust-observation.json
          artifact_name="repository-trust-${{ github.run_id }}-${{ github.run_attempt }}-build-browser-package"
          content_sha256="$(sha256sum repository-trust-observation.json | cut -d ' ' -f 1)"
          echo "artifact-name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "content-sha256=${content_sha256}" >> "$GITHUB_OUTPUT"

      - name: Revoke trust-observer token
        if: always() && steps.observer-token.outputs.token != ''
        working-directory: crates/forge3d-web
        env:
          OBSERVER_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: |
          node --input-type=module --eval '
            const response = await fetch("https://api.github.com/installation/token", {
              method: "DELETE",
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.OBSERVER_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (response.status !== 204) throw new Error(`token revocation failed: ${response.status}`);
          '

      - name: Upload exact trust observation
        id: upload-observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.emit-observation.outputs.artifact-name }}
          path: crates/forge3d-web/repository-trust-observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Attest GitHub-hosted trust observation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: crates/forge3d-web/repository-trust-observation.json

  build-trusted-browser-package:
    name: Browser Package / Build Trusted Artifact
    needs: observe-package-trust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out validation code at the protected workflow definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: validation
          persist-credentials: false

      - name: Verify observer artifact by exact numeric ID before source execution
        working-directory: validation/crates/forge3d-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe-package-trust.outputs.observation_artifact_id }}
          OBSERVATION_ARTIFACT_NAME: ${{ needs.observe-package-trust.outputs.observation_artifact_name }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-package-trust.outputs.observation_artifact_digest }}
          OBSERVATION_CONTENT_SHA256: ${{ needs.observe-package-trust.outputs.observation_content_sha256 }}
          EXPECTED_OPERATION: build-browser-package
          EXPECTED_CONSUMERS: '[{"job":"build-trusted-browser-package","environment":"none"}]'
          EXPECTED_TARGET_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/browser-package.yml
        run: node scripts/verify-repository-trust-observation.mjs

      - name: Check out only the observation-bound source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.3.0"
          cache: npm
          cache-dependency-path: source/crates/forge3d-web/package-lock.json

      - name: Install package builder dependencies
        working-directory: source/crates/forge3d-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and test the packed consumer exactly once
        working-directory: source/crates/forge3d-web
        env:
          FORGE3D_BROWSER_CHANNEL: bundled
          FORGE3D_PACKAGE_GATE_MODE: probe
        run: npm run test:package-consumer

      - name: Assemble the immutable browser package artifact
        working-directory: source/crates/forge3d-web
        run: |
          node scripts/assemble-browser-package-artifact.mjs \
            --evidence test-results/browser-gate \
            --output browser-package \
            --target-sha "${{ github.sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Upload exact protected-main package
        id: upload-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-package-${{ github.sha }}
          path: source/crates/forge3d-web/browser-package/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Attest package, harness, schemas, and manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: source/crates/forge3d-web/browser-package/*
