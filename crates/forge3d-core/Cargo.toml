[package]
name = "forge3d-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "forge3d_core"
crate-type = ["lib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck"]
webgpu = ["gpu"]

[dependencies]
async-trait.workspace = true
# Lock-controlled (docs/parity/dependency-lock.json): default rayon disabled for WASM.
exr = { version = "=1.74.2", default-features = false }
bytemuck = { workspace = true, optional = true }
glam.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
