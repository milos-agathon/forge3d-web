<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge3D W08 Package Consumer Test</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      canvas {
        display: block;
        width: 224px;
        height: 160px;
      }
    </style>
  </head>
  <body>
    <canvas id="forge3d-w08-package-canvas" width="224" height="160"></canvas>
    <script type="module">
      // Public-API-only W08 consumer: the installed-tarball harness rewrites
      // the facade import to "@forge3d/web" and runs this page unchanged.
      import {
        CogDataset,
        Forge3DError,
        Forge3DRuntime,
        Forge3DWorkerPool,
        RangeScheduler,
        createCogWorkerHandler,
      } from "../src-ts/index.ts";

      const canvas = document.querySelector("#forge3d-w08-package-canvas");
      const packageSha256 = null;
      const WIDTH = 224;
      const HEIGHT = 160;
      const CLEAR = [0, 0, 0, 1];

      async function sha256Hex(bytes) {
        const digest = await crypto.subtle.digest(
          "SHA-256",
          bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength),
        );
        return [...new Uint8Array(digest)]
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      function overlayImage() {
        const size = 32;
        const data = new Uint8Array(size * size * 4);
        for (let i = 0; i < size * size; i += 1) {
          data[i * 4] = 200;
          data[i * 4 + 1] = 90;
          data[i * 4 + 2] = 40;
          data[i * 4 + 3] = 140;
        }
        return { width: size, height: size, data };
      }

      window.__forge3dW08PackageProbe = async (fixtureUrl) => {
        if (!navigator.gpu) {
          return { supported: false, packageSha256 };
        }
        const result = { supported: true, ok: true, packageSha256 };
        let runtime;
        let pool;
        try {
          // 1. Predictor fixture through the vendored geotiff — main thread.
          const mainThread = await CogDataset.open(fixtureUrl);
          const mainTile = await mainThread.readTile(0, 0, 0);
          result.mainThread = {
            width: mainThread.width,
            height: mainThread.height,
            sha256: await sha256Hex(mainTile),
            first: mainTile[0],
            last: mainTile[mainTile.length - 1],
          };
          mainThread.dispose();

          // 2. Same read through a real module worker (vendored geotiff +
          //    handler from the package).
          pool = new Forge3DWorkerPool({
            size: 1,
            workerFactory: () =>
              new Worker(new URL("./test-w08-cog-worker.js", import.meta.url), {
                type: "module",
              }),
            mainThreadHandler: createCogWorkerHandler(),
          });
          const workerCog = await CogDataset.open(fixtureUrl, {
            workerPool: pool,
          });
          const workerTile = await workerCog.readTile(0, 0, 0);
          result.worker = {
            mode: pool.getDiagnostics().mode,
            sha256: await sha256Hex(workerTile),
            first: workerTile[0],
            last: workerTile[workerTile.length - 1],
          };
          workerCog.dispose();
          pool.dispose();
          pool = undefined;
          result.decodeParity =
            result.mainThread.sha256 === result.worker.sha256;

          // 3. Clipmap terrain + one overlay + VT stats.
          runtime = await Forge3DRuntime.create(canvas, {
            width: WIDTH,
            height: HEIGHT,
            devicePixelRatio: 1,
            clearColor: CLEAR,
          });
          const size = 257;
          const heights = new Float32Array(size * size);
          for (let row = 0; row < size; row += 1) {
            for (let col = 0; col < size; col += 1) {
              const x = col / (size - 1) - 0.5;
              const z = row / (size - 1) - 0.5;
              heights[row * size + col] =
                0.4 * Math.exp(-(x * x + z * z) * 14) +
                0.06 * Math.sin(x * 22) * Math.cos(z * 18);
            }
          }
          runtime.setTerrain({
            width: size,
            height: size,
            heights,
            exaggeration: 0.6,
            renderMode: "perspective",
            geometry: {
              mode: "clipmap",
              clipmap: {
                ringCount: 4,
                ringResolution: 32,
                centerResolution: 64,
                skirtDepth: 0.2,
                morphRange: 0.5,
              },
            },
            overlays: {
              layers: [
                {
                  name: "consumer-overlay",
                  image: overlayImage(),
                  opacity: 0.8,
                  blendMode: "normal",
                },
              ],
            },
            material: {
              albedoMode: "material",
              virtualTexture: {
                enabled: true,
                atlasSize: 512,
                residencyBudgetMb: 4,
                maxMipLevels: 4,
                useFeedback: true,
                layers: [
                  { family: "albedo", virtualSizePx: [2048, 2048] },
                ],
              },
            },
          });
          runtime.setCamera({
            position: [1.3, 0.9, 1.3],
            target: [0, 0.12, 0],
            up: [0, 1, 0],
            fovYDegrees: 50,
            near: 0.02,
            far: 30,
          });
          runtime.render();
          const rgba = await runtime.readRgba();
          let nonClear = 0;
          for (let i = 0; i < rgba.length; i += 4) {
            if (
              !(rgba[i] === 0 && rgba[i + 1] === 0 && rgba[i + 2] === 0)
            ) {
              nonClear += 1;
            }
          }
          result.render = {
            nonClearPixels: nonClear,
            geometry: runtime.getTerrainGeometryReport(),
            overlays: runtime.getTerrainOverlayReport(),
            vt: runtime.getMaterialVtStats(),
          };
          runtime.dispose();
          runtime = undefined;
        } catch (error) {
          result.ok = false;
          const normalized = Forge3DError.from(error);
          result.error = { code: normalized.code, message: normalized.message };
          runtime?.dispose();
          pool?.dispose();
        }
        return result;
      };
    </script>
  </body>
</html>
