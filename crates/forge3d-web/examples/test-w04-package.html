<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge3D W04 Package Consumer Test</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      canvas {
        display: block;
        width: 160px;
        height: 120px;
      }
    </style>
  </head>
  <body>
    <canvas id="forge3d-w04-package-canvas" width="160" height="120"></canvas>
    <script type="module">
      // Public-API-only W04 consumer: the installed-tarball harness rewrites
      // the facade import to "@forge3d/web" and runs this page unchanged.
      import {
        CascadedShadowConfig,
        Forge3DError,
        Forge3DScene,
        Forge3DSession,
        IblCache,
        ImageBasedLighting,
        ShadowConfig,
        TextureSet,
        getLightPreset,
        resolveBrdfModel,
      } from "../src-ts/index.ts";

      const canvas = document.querySelector("#forge3d-w04-package-canvas");
      const packageSha256 = null;
      const FACADE_URL = new URL("../src-ts/index.ts", import.meta.url).href;
      const WIDTH = 160;
      const HEIGHT = 120;
      const SIZE = 64;

      function heightmap() {
        const heights = new Float32Array(SIZE * SIZE);
        for (let row = 0; row < SIZE; row += 1) {
          for (let col = 0; col < SIZE; col += 1) {
            const x = col / (SIZE - 1) - 0.5;
            const z = row / (SIZE - 1) - 0.5;
            heights[row * SIZE + col] =
              0.35 * Math.exp(-(x * x + z * z) * 18) + 0.08 * Math.sin(x * 9);
          }
        }
        return heights;
      }

      function rgbeBytes() {
        const width = 8;
        const height = 4;
        const header = `#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y ${height} +X ${width}\n`;
        const head = new TextEncoder().encode(header);
        const bytes = new Uint8Array(head.length + width * height * 4);
        bytes.set(head, 0);
        for (let index = 0; index < width * height; index += 1) {
          const offset = head.length + index * 4;
          bytes[offset] = 180;
          bytes[offset + 1] = 200;
          bytes[offset + 2] = 230;
          bytes[offset + 3] = 128;
        }
        return bytes;
      }

      function distinctPixels(rgba) {
        const seen = new Set();
        for (let index = 0; index < rgba.length; index += 4) {
          seen.add((rgba[index] << 16) | (rgba[index + 1] << 8) | rgba[index + 2]);
          if (seen.size > 64) {
            break;
          }
        }
        return seen.size;
      }

      function changedFraction(a, b) {
        let changed = 0;
        for (let index = 0; index < a.length; index += 4) {
          if (
            a[index] !== b[index] ||
            a[index + 1] !== b[index + 1] ||
            a[index + 2] !== b[index + 2]
          ) {
            changed += 1;
          }
        }
        return changed / (a.length / 4);
      }

      async function errorCode(operation) {
        try {
          await operation();
          return { code: "NONE" };
        } catch (error) {
          const normalized = Forge3DError.from(error);
          return { code: normalized.code, message: normalized.message };
        }
      }

      function buildScene(filter, enabled = true) {
        const scene = Forge3DScene.create();
        scene.addTerrain({
          width: SIZE,
          height: SIZE,
          heights: heightmap(),
          spacing: [0.05, 0.05],
          exaggeration: 1.2,
          colormap: "terrain",
        });
        scene.clearLights();
        scene.addLight({
          type: "directional",
          color: [1, 0.96, 0.9],
          intensity: 3,
          direction: [0.5, -0.6, -0.62],
          castsShadow: true,
        });
        scene.setMaterial("default", {
          id: "default",
          brdf: "cooktorrance-ggx",
          baseColor: [1, 1, 1, 1],
          roughness: 0.6,
          textures: new TextureSet({
            baseColor: {
              width: 2,
              height: 2,
              format: "rgba8unorm-srgb",
              colorSpace: "srgb",
              data: new Uint8Array([
                230, 220, 200, 255, 120, 140, 90, 255,
                120, 140, 90, 255, 230, 220, 200, 255,
              ]),
            },
          }),
        });
        scene.setShadows(
          new ShadowConfig({ enabled, filter, mapSize: 512 }),
          new CascadedShadowConfig({ enabled: true, cascadeCount: 2 }),
        );
        return scene;
      }

      window.__forge3dW04PackageProbe = async () => {
        if (!navigator.gpu) {
          return { supported: false, packageSha256 };
        }
        const result = { supported: true, ok: true, packageSha256 };
        let session;
        try {
          session = await Forge3DSession.create(canvas, {
            runtime: {
              width: WIDTH,
              height: HEIGHT,
              devicePixelRatio: 1,
              clearColor: [0, 0, 0, 1],
            },
          });
          const camera = {
            position: [2.2, 1.8, 2.2],
            target: [0, 0.1, 0],
            up: [0, 1, 0],
            fovYDegrees: 45,
            near: 0.05,
            far: 50,
          };

          const pcf = buildScene("pcf");
          const ibl = await ImageBasedLighting.fromRGBE(rgbeBytes(), {
            quality: "low",
            intensity: 0.8,
          });
          const cache = new IblCache({ namespace: "w04-package" });
          const prepared = await ibl.prepare(session, cache);
          pcf.setImageBasedLighting(prepared);
          session.setScene(pcf);
          session.setCamera(camera);
          session.render();
          const lit = await session.readRgba();
          result.rgbaBytes = lit.byteLength;
          result.distinctPixels = distinctPixels(lit);
          result.shadow = session.getShadowReport();
          result.ibl = prepared.report;
          result.memory = session.getMemoryReport();

          const unlit = buildScene("pcf");
          unlit.clearLights();
          session.setScene(unlit);
          session.render();
          result.lightingChange = changedFraction(lit, await session.readRgba());

          session.setScene(buildScene("pcf", false));
          result.disabledShadow = session.getShadowReport();

          result.routes = ["blinn-phong", "hair", "ward"].map((name) =>
            resolveBrdfModel(name),
          );
          result.preset = getLightPreset("street-lamp").type;
          result.csmRejection = await errorCode(async () => {
            new ShadowConfig({ filter: "csm" });
          });

          const basisWasmUrl = new URL(
            "../assets/basis/basis_transcoder.wasm",
            FACADE_URL,
          );
          const basisResponse = await fetch(basisWasmUrl);
          result.basisAsset = {
            status: basisResponse.status,
            bytes: (await basisResponse.arrayBuffer()).byteLength,
          };

          session.dispose();
          session = undefined;
        } catch (error) {
          result.ok = false;
          const normalized = Forge3DError.from(error);
          result.error = { code: normalized.code, message: normalized.message };
          if (session !== undefined && !session.disposed) {
            session.dispose();
          }
        }
        return result;
      };
    </script>
  </body>
</html>
