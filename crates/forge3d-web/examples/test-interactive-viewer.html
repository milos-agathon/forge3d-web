<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge3D interactive viewer package fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font: 14px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #10141b;
        color: #e7edf5;
      }
      main {
        display: grid;
        gap: 0.75rem;
        padding: 1rem;
        width: min-content;
      }
      canvas {
        width: 320px;
        height: 320px;
        border: 1px solid #4d6079;
        outline: none;
      }
      canvas:focus {
        border-color: #9dd7ff;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      #unsupported[hidden] {
        display: none;
      }
      #unsupported {
        padding: 0.75rem;
        background: #54242b;
      }
    </style>
  </head>
  <body>
    <script>
      (() => {
        const errorLedgerKey = "forge3d-saf03-error-ledger-v1";
        const persistenceFailure = "collector:persistence-failure";
        let errors = [];
        let initialPersistenceFailure = false;
        try {
          const retained = JSON.parse(sessionStorage.getItem(errorLedgerKey) ?? "[]");
          if (Array.isArray(retained)) errors = retained.filter((value) => typeof value === "string").slice(-100);
          else initialPersistenceFailure = true;
        } catch { initialPersistenceFailure = true; }
        const describe = (value) => String(value?.message ?? value ?? "unknown error");
        let persistenceFailed = errors.includes(persistenceFailure);
        const markPersistenceFailure = () => {
          if (persistenceFailed) return;
          persistenceFailed = true;
          errors.push(persistenceFailure);
          if (errors.length > 100) errors.splice(0, errors.length - 100);
          try { window.name = persistenceFailure; } catch {}
        };
        if (initialPersistenceFailure || window.name === persistenceFailure) markPersistenceFailure();
        const retainError = (value) => {
          errors.push(value);
          if (errors.length > 100) errors.splice(0, errors.length - 100);
          try {
            const serialized = JSON.stringify(errors);
            sessionStorage.setItem(errorLedgerKey, serialized);
            if (sessionStorage.getItem(errorLedgerKey) !== serialized) markPersistenceFailure();
          } catch { markPersistenceFailure(); }
        };
        addEventListener("error", (event) => retainError(`error:${describe(event.error ?? event.message)}`));
        addEventListener("unhandledrejection", (event) => retainError(`unhandledrejection:${describe(event.reason)}`));
        const originalConsoleError = console.error;
        console.error = (...values) => {
          retainError(`console.error:${values.map(describe).join(" ")}`);
          originalConsoleError.apply(console, values);
        };
        window.__forge3dSafariErrors = errors;
        window.__forge3dSafariErrorLedgerKey = errorLedgerKey;
        window.__forge3dSafariRecordError = retainError;
        const state = {
          documentIdentity: crypto.randomUUID(),
          viewerIdentity: null,
          sequence: 0,
          events: []
        };
        const record = (type, persisted = null) => state.events.push({
          sequence: ++state.sequence,
          type,
          state: document.visibilityState,
          persisted
        });
        document.addEventListener("visibilitychange", () => record("visibilitychange"));
        addEventListener("pagehide", (event) => record("pagehide", event.persisted));
        addEventListener("pageshow", (event) => record("pageshow", event.persisted));
        window.__forge3dSafariLifecycle = state;
      })();
    </script>
    <main>
      <canvas id="viewer" width="320" height="320" tabindex="0"></canvas>
      <div class="controls">
        <button id="create" type="button">Create viewer</button>
        <button id="resize" type="button">Resize</button>
        <button id="dispose" type="button">Dispose</button>
      </div>
      <output id="status">idle</output>
      <output id="error-code" aria-label="Error code"></output>
      <p id="unsupported" role="alert" hidden>
        WebGPU is unavailable. Your browser or organization policy may block it,
        or graphics acceleration may be disabled. Contact your administrator.
      </p>
    </main>
    <script type="module">
      import { Forge3DViewer } from "../src-ts/index.ts";

      const canvas = document.querySelector("#viewer");
      const status = document.querySelector("#status");
      const unsupported = document.querySelector("#unsupported");
      const errorCode = document.querySelector("#error-code");
      let viewer;

      async function create(options = {}) {
        if (viewer && !viewer.disposed) {
          return viewer;
        }
        try {
          viewer = await Forge3DViewer.create(canvas, {
            ...options,
            onStatusChange(change) {
              status.value = change.current;
              options.onStatusChange?.(change);
            },
            onError(error) {
              errorCode.value = error.code;
              options.onError?.(error);
            }
          });
          viewer.setTerrain(makeTerrain(64, 64));
          unsupported.hidden = true;
          errorCode.value = "";
          status.value = viewer.status;
          canvas.focus();
          return viewer;
        } catch (error) {
          const code = typeof error?.code === "string" ? error.code : "INTERNAL_ERROR";
          errorCode.value = code;
          if (code === "WEBGPU_UNAVAILABLE" || code === "WEBGPU_ADAPTER_UNAVAILABLE") {
            unsupported.hidden = false;
            status.value = "unsupported";
          } else {
            unsupported.hidden = true;
            status.value = code;
          }
          throw error;
        }
      }

      function makeTerrain(width, height) {
        const heights = new Float32Array(width * height);
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            heights[y * width + x] =
              Math.sin((x / (width - 1)) * Math.PI) *
              Math.sin((y / (height - 1)) * Math.PI);
          }
        }
        return { width, height, heights };
      }

      function dispose() {
        viewer?.dispose();
        status.value = viewer?.status ?? "idle";
      }

      document.querySelector("#create").addEventListener("click", () => {
        create().catch(() => undefined);
      });
      document.querySelector("#resize").addEventListener("click", () => {
        if (!viewer || viewer.disposed) {
          return;
        }
        const currentCssWidth = Math.round(Number.parseFloat(getComputedStyle(canvas).width));
        const width = currentCssWidth === 320 ? 240 : 320;
        canvas.style.width = `${width}px`;
        viewer.resize({ width, height: 320, devicePixelRatio: window.devicePixelRatio });
      });
      document.querySelector("#dispose").addEventListener("click", dispose);

      window.__forge3dInteractiveViewer = {
        canvas,
        create,
        dispose,
        get viewer() {
          return viewer;
        },
        get supported() {
          return !unsupported.hidden ? false : undefined;
        },
        get errorCode() {
          return errorCode.value || null;
        },
        packageSha256: null
      };
    </script>
  </body>
</html>
