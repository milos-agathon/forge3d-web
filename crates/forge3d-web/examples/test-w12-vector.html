// Contract regressions use actual color/pick/AOV pixels and synchronized frames.
function square(id,y,color){return {id,kind:"polygon",rings:[[[-1,y,-1],[1,y,-1],[1,y,1],[-1,y,1]]],style:{color,opacity:1}};}
async function isolated(width=128,height=96){const c=document.createElement("canvas");c.width=width;c.height=height;const r=await Forge3DRuntime.create(c,{diagnostics:true,devicePixelRatio:1,clearColor:[0,0,0,1],memoryBudgetBytes:1024*1024*1024});r.setCamera(camera);return r;}

window.__w12Auto=async()=>{const l=shapes();runtime.setVectorLayers(l);return {available:runtime.getCapabilities().features?.includes("dual-source-blending")??false,report:runtime.getVectorReport()};};
window.__w12DualEquation=async()=>{const r=await isolated(),cases=[];try{for(const reverse of [false,true]){const fragments=[{id:20,kind:"point",position:[0,.2,0],style:{shape:"square",pointSize:40,color:[1,0,0,.45]}},{id:30,kind:"point",position:[0,2,0],style:{shape:"square",pointSize:40,color:[0,0,1,.6]}}];if(reverse)fragments.reverse();const l=new VectorLayers();l.add({name:"dual-equation",features:fragments});l.setOit("dual-source");r.setVectorLayers(l);const rgba=await r.readRgba();let acc=[0,0,0,0];for(const f of fragments){const a=Math.pow(f.style.color[3],1.1);acc=acc.map((v,i)=>v*.875+(i===3?a:f.style.color[i]*a));}const expected=acc.slice(0,3).map(v=>Math.round(v*255));const actual=[...rgba.slice((48*128+64)*4,(48*128+64)*4+3)];cases.push({reverse,actual,expected,delta:diff(actual,expected),report:r.getVectorReport()});}return cases;}finally{r.dispose();}};
// Independent scene-color and W11 output equations. Center coverage is

window.__w12ColorTransfer=async()=>{
 const r=await isolated(),opaque=[],hdr=[],index=48*128+64;
 const colors=[{name:"red",rgb:[1,0,0]},{name:"gray",rgb:[.2,.2,.2]},{name:"white",rgb:[1,1,1]}];

   const l=new VectorLayers();l.setOit(mode);
   const features=[square(1,.2,[...color.rgb,alpha])];
   if(disjoint)features.push({id:2,kind:"point",position:[2.8,.2,0],style:{shape:"square",pointSize:16,color:[0,1,0,.5]}});
   l.add({name:"isolated-color",features});r.setPostFx(null);r.setVectorLayers(l);
   const plain=await r.readRgba(),map=await r.readVectorPickMap(),report=r.getVectorReport();
   if(alpha===1)opaque.push({mode,color:color.name,disjoint,actual:[...plain.slice(index*4,index*4+4)],expected:[...color.rgb.map(v=>Math.round(v*255)),255],pick:map.ids[index],covered:map.ids.reduce((n,id)=>n+Number(id===1),0),disjointCovered:map.ids.reduce((n,id)=>n+Number(id===2),0),report});
   r.setPostFx([{kind:"tonemap",id:"map",operator:"reinhard",exposure:1}]);r.render();
   const raw=await r.readPostFxIntermediate("color"),mapped=await r.readPostFxIntermediate("map:resolve"),output=await r.readRgba();
   // Derive the independent equation from negotiated capability, then test
   // the runtime report separately so an incorrect fallback cannot self-pass.
   const weight=alpha===1?1:available&&(mode==="dual-source"||mode==="auto")?alpha**1.1:alpha;
   const expectedHdr=color.rgb.map(v=>v*weight),expectedMapped=expectedHdr.map(v=>2*v/(1+2*v)),expectedDisplay=expectedMapped.map(v=>Math.round(srgb(v)*255));
   const actual=[...raw.data.slice(index*4,index*4+3)],actualMapped=[...mapped.data.slice(index*4,index*4+3)],display=[...output.slice(index*4,index*4+3)];
   hdr.push({mode,color:color.name,alpha,disjoint,actual,mapped:actualMapped,display,expectedHdr,expectedMapped,expectedDisplay,hdrDelta:diff(actual,expectedHdr),mappedDelta:diff(actualMapped,expectedMapped),displayDelta:diff(display,expectedDisplay),report,postfxReport:r.getPostFxReport()});
  }
  return {available,opaque,hdr};
 }finally{r.dispose();}
};
