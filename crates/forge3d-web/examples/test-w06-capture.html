<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge3D W06 Capture Test</title>
    <style>

      body {

        background: #000;
      }

      }

  <body>
    <canvas id="forge3d-w04-parity-canvas" width="192" height="128"></canvas>
    <canvas id="w06-analytic" width="67" height="45"></canvas>
    <canvas id="w06-exr" width="67" height="45"></canvas>
    <canvas id="w06-memory" width="67" height="45"></canvas>
    <canvas id="w06-offline" width="96" height="64"></canvas>
    <canvas id="w06-flat" width="96" height="64"></canvas>
    <canvas id="w06-denoise" width="96" height="64"></canvas>
    <canvas id="w06-tonemap" width="96" height="64"></canvas>
    <canvas id="w06-frames" width="96" height="64"></canvas>
    <canvas id="w06-video" width="96" height="64"></canvas>
    <canvas id="w06-loss" width="96" height="64"></canvas>
    <script type="module">
      import {
        Camera,
        CameraAnimation,
        Forge3DError,
        Forge3DRuntime,
        Forge3DScene,
        Forge3DSession,
        FrameDumper,
        HdrFrame,
        ImageBasedLighting,
        OfflineQualitySettings,
        RenderConfig,
        TerrainDataset,
        aovObjectId,
        atrousDenoise,
        compareImages,
        createDownloadFrameSink,
        createMemoryFrameSink,
        createOpfsFrameSink,
        encodeVideo,
        muxEncodedVideo,
        probeVideoCodecs,
        readExr,
        renderFrames,
        writeFrames,
      } from "../src-ts/index.ts";
      import { setSessionRuntimeFactoryForTests } from "../src-ts/session.ts";
      import { simulateRuntimeDeviceLossForTests } from "../src-ts/runtime-internals.ts";

      const WIDTH = 192;
      const HEIGHT = 128;
      const GOLDEN_URL = "/tests/golden/w04-terrain-pbr-native.png";
      const TERRAIN_SIZE = 96;
      const TERRAIN_SPAN = 2.8;
      const TERRAIN_SPACING = TERRAIN_SPAN / (TERRAIN_SIZE - 1);
      const Z_SCALE = 1.45;
      const HISTORICAL_CLIP_NEAR = 0.1;
      const HISTORICAL_CLIP_FAR = 6000.0;
      const CAM_RADIUS = 5.0;
      const CAM_PHI_DEG = 138.0;
      const CAM_THETA_DEG = 63.0;
      const CAM_FOV_DEG = 54.0;
      const LIGHT_AZIMUTH_DEG = 135.0;
      const LIGHT_ELEVATION_DEG = 24.0;
      const SUN_INTENSITY = 2.4;
      const IBL_INTENSITY = 1.0;
      const TERRAIN_ROUGHNESS = (0.5 + 0.85 + 0.5 + 0.25) / 4;
      const BRDF_MODELS = [
        "lambert",
        "phong",
        "blinn-phong",
        "oren-nayar",
        "cooktorrance-ggx",
        "cooktorrance-beckmann",
        "disney-principled",
        "ashikhmin-shirley",
        "ward",
        "toon",
        "minnaert",
        "subsurface",
        "hair",
      ];
      const SHADOW_FILTERS = ["hard", "pcf", "pcss", "vsm", "evsm", "msm"];
      const PACKED_SIZES = {
        packedLight: 112,
        packedMaterial: 64,
        lightingUniform: 32,
        materialUniform: 16,
        shadowUniform: 368,
        shadowDepthUniform: 64,
      };

      function buildHeightmap() {
        const heights = new Float32Array(TERRAIN_SIZE * TERRAIN_SIZE);
        for (let row = 0; row < TERRAIN_SIZE; row += 1) {
          const y = -1 + (2 * row) / (TERRAIN_SIZE - 1);
          for (let col = 0; col < TERRAIN_SIZE; col += 1) {
            const x = -1 + (2 * col) / (TERRAIN_SIZE - 1);
            const ridge =
              0.52 *
              Math.exp(-((x + 0.25) ** 2 * 6.5 + (y - 0.12) ** 2 * 10));
            const basin =
              -0.18 *
              Math.exp(-((x - 0.05) ** 2 * 20 + (y + 0.05) ** 2 * 24));
            const spur =
              0.22 *
              Math.exp(-((x - 0.42) ** 2 * 28 + (y + 0.22) ** 2 * 18));
            const slope = 0.25 * (1 - y) + 0.1 * x;
            heights[row * TERRAIN_SIZE + col] = ridge + basin + spur + slope;
          }
        }
        let min = Infinity;
        let max = -Infinity;
        for (const value of heights) {
          if (value < min) {
            min = value;
          }
          if (value > max) {
            max = value;
          }
        }
        const span = Math.max(max - min, 1e-6);
        for (let index = 0; index < heights.length; index += 1) {
          heights[index] = (heights[index] - min) / span;
        }
        return heights;
      }

      function srgbColor(hex) {
        return [
          parseInt(hex.slice(1, 3), 16) / 255,
          parseInt(hex.slice(3, 5), 16) / 255,
          parseInt(hex.slice(5, 7), 16) / 255,
        ];
      }

      function colorRamp() {
        return {
          stops: [
            { position: 0.0, color: srgbColor("#18391f") },
            { position: 0.38, color: srgbColor("#4e7c35") },
            { position: 0.65, color: srgbColor("#8f7a4a") },
            { position: 0.82, color: srgbColor("#b8ac88") },
            { position: 1.0, color: srgbColor("#f2f4f7") },
          ],
        };
      }

      function historicalHdrBytes() {
        const width = 8;
        const height = 4;
        const header = `#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y ${height} +X ${width}\n`;
        const head = new TextEncoder().encode(header);
        const bytes = new Uint8Array(head.length + width * height * 4);
        bytes.set(head, 0);
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const offset = head.length + (y * width + x) * 4;
            bytes[offset] = Math.trunc((x / (width - 1)) * 255);
            bytes[offset + 1] = Math.trunc((y / (height - 1)) * 255);
            bytes[offset + 2] = 128;
            bytes[offset + 3] = 128;
          }
        }
        return bytes;
      }

      function lightDirection() {
        const az = (LIGHT_AZIMUTH_DEG * Math.PI) / 180;
        const el = (LIGHT_ELEVATION_DEG * Math.PI) / 180;
        return [
          Math.cos(el) * Math.sin(az),
          -Math.sin(el),
          -Math.cos(el) * Math.cos(az),
        ];
      }

      function cameraInput() {
        const phi = (CAM_PHI_DEG * Math.PI) / 180;
        const theta = (CAM_THETA_DEG * Math.PI) / 180;
        return {
          position: [
            CAM_RADIUS * Math.sin(theta) * Math.cos(phi),
            CAM_RADIUS * Math.cos(theta),
            CAM_RADIUS * Math.sin(theta) * Math.sin(phi),
          ],
          target: [0, 0, 0],
          up: [0, 1, 0],
          fovYDegrees: CAM_FOV_DEG,
          near: HISTORICAL_CLIP_NEAR,
          far: HISTORICAL_CLIP_FAR,
        };
      }

      function shadowInput(filter, mapSize) {
        return {
          enabled: true,
          filter,
          mapSize,
          depthBias: 0.0005,
          normalBias: 0.0002,
          slopeBias: 0.001,
          softness: 1.5,
          pcssBlockerRadius: 2,
          pcssFilterRadius: 4,
          lightSize: 0.001,
          momentBias: 0.0005,
          lightBleedReduction: 0.5,
          evsmPositiveExponent: 5,
          evsmNegativeExponent: 5,
          peterPanningOffset: 0.0002,
        };
      }

      function csmInput() {
        return {
          enabled: true,
          cascadeCount: 3,
          maxDistance: 4000,
          splitLambda: 0.75,
          blendRange: 0.1,
          stabilize: true,
          debugView: "none",
        };
      }

      async function buildParityScene() {
        const scene = Forge3DScene.create();
        scene.addTerrain({
          width: TERRAIN_SIZE,
          height: TERRAIN_SIZE,
          heights: buildHeightmap(),
          spacing: [TERRAIN_SPACING, TERRAIN_SPACING],
          exaggeration: Z_SCALE,
          domain: [0, 1],
          colorRamp: colorRamp(),
          renderMode: "screen",
        });
        // The native golden scene has exactly one directional sun; drop the
        // default key light every Forge3DScene starts with.
        scene.clearLights();
        scene.addLight({
          type: "directional",
          color: [1, 1, 1],
          intensity: SUN_INTENSITY,
          direction: lightDirection(),
          castsShadow: true,
        });
        scene.setMaterial("default", {
          id: "default",
          brdf: "cooktorrance-ggx",
          baseColor: [1, 1, 1, 1],
          metallic: 0,
          roughness: TERRAIN_ROUGHNESS,
        });
        const ibl = await ImageBasedLighting.fromRGBE(historicalHdrBytes(), {
          quality: "low",
          intensity: IBL_INTENSITY,
          rotationDegrees: 0,
          // Native goldens were rendered with the native prefilter bug.
          prefilter: "native",
        });
        scene.setImageBasedLighting(ibl);
        scene.setShadows(shadowInput("pcss", 4096), csmInput());
        return scene;
      }

      async function decodeGolden() {
        const response = await fetch(GOLDEN_URL);
        const blob = await response.blob();
        const bitmap = await createImageBitmap(blob, {
          colorSpaceConversion: "none",
          premultiplyAlpha: "none",
        });
        const offscreen = document.createElement("canvas");
        offscreen.width = WIDTH;
        offscreen.height = HEIGHT;
        const context = offscreen.getContext("2d", { willReadFrequently: true });
        context.drawImage(bitmap, 0, 0);
        return context.getImageData(0, 0, WIDTH, HEIGHT).data;
      }

      const ERR = async (operation) => {
        try {
          await operation();
          return "NONE";
        } catch (error) {
          return Forge3DError.from(error).code;
        }
      };
      const ERR_DETAIL = async (operation) => {
        try {
          await operation();
          return { code: "NONE" };
        } catch (error) {
          const normalized = Forge3DError.from(error);
          return { code: normalized.code, message: normalized.message, details: normalized.details };
        }
      };

      function lcg(seed) {
        let state = seed >>> 0;
        return () => {
          state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
          return state / 4294967296;
        };
      }

      function maxAbs(a, b) {
        let max = 0;
        for (let i = 0; i < a.length; i += 1) max = Math.max(max, Math.abs(a[i] - b[i]));
        return max;
      }

      function rgbaToFloat(rgba) {
        return Float32Array.from(rgba, (value) => value / 255);
      }

      function psnrRgb(a, b) {
        let sum = 0;
        let count = 0;
        let peak = 1e-6;
        for (let i = 0; i < a.length; i += 4) {
          for (let c = 0; c < 3; c += 1) {
            const d = a[i + c] - b[i + c];
            sum += d * d;
            count += 1;
            peak = Math.max(peak, a[i + c], b[i + c]);
          }
        }
        const mse = sum / count;
        return mse <= 1e-10 ? 99 : 20 * Math.log10(peak / Math.sqrt(mse));
      }

      function f16(bits) {
        const sign = bits & 0x8000 ? -1 : 1;
        const exponent = (bits >> 10) & 0x1f;
        const mantissa = bits & 0x3ff;
        if (exponent === 0) return sign * mantissa * 2 ** -24;
        if (exponent === 31) return mantissa ? NaN : sign * Infinity;
        return sign * (1 + mantissa / 1024) * 2 ** (exponent - 15);
      }

      const ANALYTIC_WIDTH = 67;
      const ANALYTIC_HEIGHT = 45;
      const ANALYTIC_CAMERA = {
        position: [0, 5, 0],
        target: [0, 0, 0],
        up: [0, 0, -1],
        fovYDegrees: 60,
        near: 0.5,
        far: 20,
      };

      function analyticScene() {
        const scene = Forge3DScene.create();
        scene.clearLights();
        scene.addLight({ type: "directional", direction: [0, -1, 0], color: [1, 1, 1], intensity: 20, castsShadow: false });
        const node = scene.addGroundPlane({ name: "plane", materialSlot: "m", size: [4, 4], color: [0.5, 0.5, 0.5, 1] });
        scene.setMaterial("m", { id: "m", brdf: "lambert", baseColor: [1, 0.5, 1, 1], metallic: 0 });
        scene.addOverlay({ name: "badge", bounds: [2, 2, 6, 4], color: [1, 0, 0, 0.5] });
        return { scene, node };
      }

      async function analyticSession(canvasId) {
        const session = await Forge3DSession.create(document.getElementById(canvasId), {
          runtime: {
            diagnostics: true,
            width: ANALYTIC_WIDTH,
            height: ANALYTIC_HEIGHT,
            devicePixelRatio: 1,
            clearColor: [0.1, 0.2, 0.3, 1],
          },
          recovery: { deviceLoss: "once" },
        });
        const { scene, node } = analyticScene();
        session.setScene(scene);
        session.setCamera(ANALYTIC_CAMERA);
        return { session, scene, node };
      }

      function complexHeights(size) {
        const heights = new Float32Array(size * size);
        let min = Infinity;
        let max = -Infinity;
        for (let r = 0; r < size; r += 1) {
          const y = -1 + (2 * r) / (size - 1);
          for (let c = 0; c < size; c += 1) {
            const x = -1 + (2 * c) / (size - 1);
            const value =
              0.42 * Math.sin(x * 18) +
              0.31 * Math.cos(y * 23) +
              0.19 * Math.sin((x + y) * 31) +
              0.08 * Math.sign(Math.sin(x * 9) * Math.cos(y * 11)) +
              0.22 * (0.7 * x - y);
            heights[r * size + c] = value;
            min = Math.min(min, value);
            max = Math.max(max, value);
          }
        }
        for (let i = 0; i < heights.length; i += 1) heights[i] = (heights[i] - min) / Math.max(max - min, 1e-6);
        return heights;
      }

      const OFFLINE_WIDTH = 96;
      const OFFLINE_HEIGHT = 64;
      const OFFLINE_CAMERA = {
        position: [2.4, 3.1, 2.6],
        target: [0, 0.2, 0],
        up: [0, 1, 0],
        fovYDegrees: 50,
        near: 0.1,
        far: 50,
      };

      async function offlineSession(canvasId, flat = false) {
        const size = 96;
        const session = await Forge3DSession.create(document.getElementById(canvasId), {
          runtime: {
            diagnostics: true,
            width: OFFLINE_WIDTH,
            height: OFFLINE_HEIGHT,
            devicePixelRatio: 1,
            clearColor: [0.02, 0.03, 0.05, 1],
          },
          recovery: { deviceLoss: "once" },
        });
        const scene = Forge3DScene.create();
        const dataset = TerrainDataset.fromArray({
          width: size,
          height: size,
          heights: flat ? new Float32Array(size * size) : complexHeights(size),
          spacing: [2.2 / (size - 1), 2.2 / (size - 1)],
          colormap: "terrain",
        });
        scene.addTerrain({ ...dataset.toTerrainInput(), exaggeration: 1.55, domain: [0, 1] });
        session.setScene(scene);
        session.setCamera(OFFLINE_CAMERA);
        return session;
      }

      const settings = (extra) => new OfflineQualitySettings({ enabled: true, ...extra });

      async function denoiseAcceptance(session) {
        const reference = await session.capture({ aovs: ["albedo", "normal", "depth"] });
        const clean = reference.hdrFrame;
        const width = clean.width;
        const height = clean.height;
        const random = lcg(20260924);
        let peak = 0;
        for (let i = 0; i < clean.data.length; i += 4) peak = Math.max(peak, clean.data[i], clean.data[i + 1], clean.data[i + 2]);
        const noisyData = Float32Array.from(clean.data);
        for (let i = 0; i < noisyData.length; i += 4) {
          for (let c = 0; c < 3; c += 1) {
            noisyData[i + c] = Math.max(0, noisyData[i + c] + (random() - 0.5) * 0.25 * peak);
          }
        }
        const noisy = new HdrFrame(width, height, noisyData);
        const aov = reference.aovFrame;
        const metric = (a) => compareImages(a.data, clean.data, { width, height, channels: 4, compareChannels: 3, dataRange: peak });
        const before = await metric(noisy);
        const denoised = await session.denoiseHdrFrame(noisy, aov);
        const after = await metric(denoised);
        const converged = await session.denoiseHdrFrame(clean, aov);
        const regression = await metric(converged);
        const native = await session.denoiseHdrFrame(clean, aov, { edgeStopping: 0 });
        const nativeRegression = await metric(native);
        const cpu = await atrousDenoise({ width, height, color: noisy.data, albedo: aov.albedo(), normal: aov.normal() });
        return {
          size: [width, height],
          peak,
          before,
          after,
          regression,
          nativeRegression,
          gpuCpuMaxAbs: maxAbs(denoised.data, cpu) / peak,
        };
      }

      const w06 = {
        async analytic() {
          const { session, node } = await analyticSession("w06-analytic");
          const previousCamera = {
            ...ANALYTIC_CAMERA,
            position: [0.5, 5, 0],
            target: [0.5, 0, 0],
          };
          const cap = await session.capture({ aovs: "all", previousCamera });
          session.render();
          const display = await session.readRgba();
          const width = ANALYTIC_WIDTH;
          const cx = 40;
          const cy = 30;
          const i = cy * width + cx;
          const base = [0.5, 0.25, 0.5];
          const expected = base.map((b) => Math.fround(Math.fround(b * 0.08) + Math.fround(b * Math.fround(1 / Math.PI)) * 20));
          const hdr = cap.hdrFrame.data;
          const hdrError = Math.max(...expected.map((e, c) => Math.abs(hdr[i * 4 + c] - e)));
          const depthExpected = Math.fround((5 - 0.5) / (20 - 0.5));
          const camera = new Camera(ANALYTIC_CAMERA);
          const previous = new Camera(previousCamera);
          const viewport = { width, height: ANALYTIC_HEIGHT };
          const now = camera.worldToScreen([0, 0, 0], viewport);
          const before = previous.worldToScreen([0, 0, 0], viewport);
          const motion = cap.aovFrame.motion();
          let displayMax = 0;
          for (let p = 0; p < display.length; p += 1) {
            if (p % 4 === 3) continue;
            displayMax = Math.max(displayMax, Math.abs(display[p] - cap.frame.data[p]));
          }
          // Overlay covers pixels (2..8, 2..6); the HDR composite is premultiplied.
          const o = (3 * width + 3) * 4;
          const bgExpected = [0.5 * 1 + 0.1 * 0.5, 0.2 * 0.5, 0.3 * 0.5];
          const result = {
            hdrError,
            hdrMax: Math.max(...Array.from(hdr.slice(i * 4, i * 4 + 3))),
            albedo: Array.from(cap.aovFrame.albedo().slice(i * 3, i * 3 + 3)),
            normal: Array.from(cap.aovFrame.normal().slice(i * 3, i * 3 + 3)),
            depthError: Math.abs(cap.aovFrame.depth()[i] - depthExpected),
            linearDepthError: Math.abs(cap.aovFrame.linearDepth()[i] - 5),
            id: cap.aovFrame.id()[i],
            expectedId: aovObjectId(node),
            backgroundId: cap.aovFrame.id()[width * (ANALYTIC_HEIGHT - 1)],
            backgroundDepth: cap.aovFrame.depth()[width * (ANALYTIC_HEIGHT - 1)],
            backgroundHdr: Array.from(hdr.slice((width * (ANALYTIC_HEIGHT - 1)) * 4, (width * (ANALYTIC_HEIGHT - 1)) * 4 + 4)),
            overlayError: Math.max(...bgExpected.map((e, c) => Math.abs(hdr[o + c] - e))),
            motion: [motion[i * 2], motion[i * 2 + 1]],
            expectedMotion: [now.x - before.x, now.y - before.y],
            displayMax,
            channels: cap.aovFrame.channels(),
            sizes: {
              frame: cap.frame.data.length,
              hdr: hdr.length,
              depth: cap.aovFrame.depth().length,
              motion: motion.length,
            },
          };
          // No offline allocations remain after the capture session.
          const memory = session.getMemoryReport();
          result.memoryCurrent = memory.currentBytes;
          session.dispose();
          return result;
        },

        async offline() {
          const session = await offlineSession("w06-offline");
          const result = {};
          const a = await session.renderOffline({ settings: settings({ batchSize: 4 }), samples: 16, seed: 12345 });
          const b = await session.renderOffline({ settings: settings({ batchSize: 4 }), samples: 16, seed: 12345 });
          result.deterministic = maxAbs(a.frame.data, b.frame.data) === 0 && maxAbs(a.hdrFrame.data, b.hdrFrame.data) === 0;
          result.samplesUsed = [a.metadata.samplesUsed, b.metadata.samplesUsed];
          const baseline = await session.renderOffline({ settings: settings({ batchSize: 4 }), samples: 1, seed: 7 });
          const improved = await session.renderOffline({ settings: settings({ batchSize: 4 }), samples: 12, seed: 7 });
          const reference = await session.renderOffline({ settings: settings({ batchSize: 8 }), samples: 32, seed: 7 });
          result.psnr = {
            baseline: psnrRgb(baseline.hdrFrame.data, reference.hdrFrame.data),
            improved: psnrRgb(improved.hdrFrame.data, reference.hdrFrame.data),
          };
          // Single-sample offline equals a manual one-sample session.
          session.beginOfflineAccumulation({ samples: 1, seed: 77 });
          const batch = await session.accumulateBatch(1);
          const manual = await session.resolveOfflineHdr();
          session.endOfflineAccumulation();
          const oneShot = await session.renderOffline({ settings: settings({ batchSize: 1 }), samples: 1, seed: 77 });
          result.manualBatch = batch.totalSamples;
          result.manualEqual =
            maxAbs(manual.frame.data, oneShot.frame.data) === 0 &&
            maxAbs(manual.hdrFrame.data, oneShot.hdrFrame.data) === 0 &&
            maxAbs(manual.aovFrame.albedo(), oneShot.aovFrame.albedo()) === 0 &&
            maxAbs(manual.aovFrame.depth(), oneShot.aovFrame.depth()) === 0;
          // One-sample offline "display" frame equals the realtime frame.
          session.render();
          const display = await session.readRgba();
          result.displayMax = maxAbs(display, oneShot.frame.data);

          // Session guards (native semantics).
          session.beginOfflineAccumulation({ samples: 8, seed: 5 });
          result.metricsBeforeSamples = await ERR(() => session.readAccumulationMetrics(0.002, 8));
          result.beginTwice = await ERR_DETAIL(() => session.beginOfflineAccumulation({ samples: 8 }));
          result.renderDuring = session.render();
          result.readDuring = await ERR(() => session.readRgba());
          const first = await session.accumulateBatch(4);
          const metrics = await session.readAccumulationMetrics(0.002, 8);
          result.firstBatch = first.totalSamples;
          result.metrics = metrics;
          session.setCamera({ ...OFFLINE_CAMERA, position: [2.5, 3.1, 2.6] });
          result.endReturned = [session.endOfflineAccumulation(), session.endOfflineAccumulation()];
          result.renderAfter = session.render();

          // Adaptive: complex scene respects min/max; progress matches metadata.
          session.setCamera(OFFLINE_CAMERA);
          const updates = [];
          const adaptive = await session.renderOffline({
            settings: settings({ adaptive: true, targetVariance: 0.001, maxSamples: 12, minSamples: 4, batchSize: 4, tileSize: 8, convergenceRatio: 0.95 }),
            samples: 32,
            seed: 41,
            onProgress: (progress) => updates.push(progress),
          });
          result.adaptiveComplex = {
            used: adaptive.metadata.samplesUsed,
            target: adaptive.metadata.targetSamples,
            updates: updates.length,
            allMax: updates.every((u) => u.maxSamples === 12),
            positive: updates.every((u) => u.samplesSoFar > 0 && u.elapsedMs >= 0),
            lastMatches: updates.at(-1).samplesSoFar === adaptive.metadata.samplesUsed,
            p95Matches: Math.abs(adaptive.metadata.finalP95Delta - updates.at(-1).p95Delta) <= 1e-6,
            ratioMatches: Math.abs(adaptive.metadata.convergedRatio - updates.at(-1).convergedRatio) <= 1e-6,
            denoiser: adaptive.metadata.denoiserUsed,
            adaptiveFlag: adaptive.metadata.adaptive,
          };
          // Progress callback exceptions clean up the session.
          result.callbackThrow = await ERR_DETAIL(() =>
            session.renderOffline({
              settings: settings({ adaptive: true, targetVariance: 0.002, maxSamples: 8, minSamples: 4, batchSize: 4, tileSize: 8 }),
              samples: 8,
              onProgress: () => {
                throw new Error("stop after first progress update");
              },
            }),
          );
          result.renderAfterThrow = session.render();
          // Cancellation.
          const controller = new AbortController();
          const cancelled = ERR(() =>
            session.renderOffline({
              settings: settings({ batchSize: 1 }),
              samples: 64,
              onProgress: (progress) => {
                if (progress.samplesSoFar >= 2) controller.abort("test");
              },
              signal: controller.signal,
            }),
          );
          result.cancelled = await cancelled;
          result.renderAfterCancel = session.render();
          result.disabledSettings = await ERR(() => session.renderOffline({ settings: { enabled: false } }));
          session.dispose();

          const flat = await offlineSession("w06-flat", true);
          const adaptiveFlat = await flat.renderOffline({
            settings: settings({ adaptive: true, targetVariance: 0.002, maxSamples: 32, minSamples: 4, batchSize: 4, tileSize: 8, convergenceRatio: 0.9 }),
            samples: 32,
            seed: 99,
          });
          const uniformFlat = await flat.renderOffline({ settings: settings({ batchSize: 4 }), samples: 32, seed: 99 });
          result.flat = { adaptive: adaptiveFlat.metadata.samplesUsed, uniform: uniformFlat.metadata.samplesUsed };
          flat.beginOfflineAccumulation({ samples: 16, seed: 123 });
          const ratios = [];
          for (let k = 0; k < 4; k += 1) {
            await flat.accumulateBatch(4);
            ratios.push((await flat.readAccumulationMetrics(0.002, 8)).convergedTileRatio);
          }
          flat.endOfflineAccumulation();
          result.flatRatios = ratios;
          const memory = flat.getMemoryReport();
          result.memoryAfter = memory.currentBytes;
          flat.dispose();
          return result;
        },

        async denoise() {
          const session = await Forge3DSession.create(document.getElementById("forge3d-w04-parity-canvas"), {
            runtime: { diagnostics: true, width: WIDTH, height: HEIGHT, devicePixelRatio: 1, clearColor: [0, 0, 0, 1], memoryBudgetBytes: 1 << 30 },
          });
          session.setScene(await buildParityScene());
          session.setCamera(cameraInput());
          const result = await denoiseAcceptance(session);
          const offlineDenoised = await session.renderOffline({
            settings: settings({ batchSize: 4 }),
            samples: 4,
            seed: 3,
            denoise: { enabled: true, method: "atrous", iterations: 3 },
          });
          const oidn = await session.renderOffline({
            settings: settings({ batchSize: 4 }),
            samples: 4,
            seed: 3,
            aovs: [],
            denoise: { enabled: true, method: "oidn" },
          });
          session.dispose();
          return {
            ...result,
            offline: offlineDenoised.metadata,
            oidn: { metadata: oidn.metadata, channels: oidn.aovFrame.channels() },
          };
        },

        async fixture() {
          // offline-denoise-v1: 1920x1080, samples [1, 4, 16, 64], all AOVs, 120 frames.
          const FW = 1920;
          const FH = 1080;
          const FIXTURE_BUDGET = 1536 * 1024 * 1024;
          const runtimeOptions = { diagnostics: true, width: FW, height: FH, devicePixelRatio: 1, clearColor: [0.1, 0.2, 0.3, 1], memoryBudgetBytes: 1536 * 1024 * 1024 };
          const result = {};
          {
            const session = await Forge3DSession.create(document.getElementById("w06-analytic"), { runtime: runtimeOptions, renderer: { memoryBudgetBytes: FIXTURE_BUDGET } });
            const { scene, node } = analyticScene();
            session.setScene(scene);
            session.setCamera(ANALYTIC_CAMERA);
            const cap = await session.capture({ aovs: "all" });
            const id = cap.aovFrame.id();
            const depth = cap.aovFrame.depth();
            const albedo = cap.aovFrame.albedo();
            const normal = cap.aovFrame.normal();
            const hdr = cap.hdrFrame.data;
            const base = [0.5, 0.25, 0.5];
            const expected = base.map((b) => Math.fround(Math.fround(b * 0.08) + Math.fround(b * Math.fround(1 / Math.PI)) * 20));
            const depthExpected = Math.fround((5 - 0.5) / (20 - 0.5));
            let covered = 0;
            let colorMax = 0;
            let aovMax = 0;
            let depthMax = 0;
            for (let p = 0; p < FW * FH; p += 1) {
              if (id[p] !== aovObjectId(node)) continue;
              covered += 1;
              for (let c = 0; c < 3; c += 1) {
                colorMax = Math.max(colorMax, Math.abs(hdr[p * 4 + c] - expected[c]));
                aovMax = Math.max(aovMax, Math.abs(albedo[p * 3 + c] - base[c]), Math.abs(normal[p * 3 + c] - (c === 1 ? 1 : 0)));
              }
              depthMax = Math.max(depthMax, Math.abs(depth[p] - depthExpected));
            }
            result.exact = { covered, colorMax, aovMax, depthMax, motion: cap.aovFrame.hasMotion, size: cap.frame.size() };
            session.dispose();
          }
          const session = await Forge3DSession.create(document.getElementById("w06-offline"), { runtime: { ...runtimeOptions, clearColor: [0.02, 0.03, 0.05, 1] }, renderer: { memoryBudgetBytes: FIXTURE_BUDGET } });
          const terrain = Forge3DScene.create();
          const size = 96;
          const dataset = TerrainDataset.fromArray({ width: size, height: size, heights: complexHeights(size), spacing: [2.2 / (size - 1), 2.2 / (size - 1)], colormap: "terrain" });
          terrain.addTerrain({ ...dataset.toTerrainInput(), exaggeration: 1.55, domain: [0, 1] });
          session.setScene(terrain);
          session.setCamera(OFFLINE_CAMERA);
          const ladder = {};
          const reference = await session.renderOffline({ settings: settings({ batchSize: 16 }), samples: 64, seed: 0, aovs: [] });
          for (const samples of [1, 4, 16]) {
            const run = await session.renderOffline({ settings: settings({ batchSize: 16 }), samples, seed: 0, aovs: [] });
            ladder[samples] = { used: run.metadata.samplesUsed, psnr: psnrRgb(run.hdrFrame.data, reference.hdrFrame.data) };
          }
          result.ladder = ladder;
          session.setScene(await buildParityScene());
          session.setCamera(cameraInput());
          result.denoise = await denoiseAcceptance(session);
          // 120-frame deterministic stream with exact timestamps; memory stays flat.
          const animation = new CameraAnimation([
            { time: 0, phiDeg: 138, thetaDeg: 63, radius: 5, fovDeg: 54, target: [0, 0, 0] },
            { time: 4, phiDeg: 168, thetaDeg: 58, radius: 5, fovDeg: 54, target: [0, 0, 0] },
          ]);
          const memoryBefore = session.getMemoryReport().currentBytes;
          const timestamps = [];
          let count = 0;
          let blank = 0;
          for await (const frame of renderFrames(session, { animation, fps: 30, endFrame: 120, mode: "display", cameraOptions: { near: 0.1, far: 6000 } })) {
            timestamps.push(frame.timestampUs);
            count += 1;
            if (frame.frame.data[(540 * FW + 960) * 4 + 1] === 0) blank += 1;
          }
          result.stream = {
            count,
            blank,
            exact: timestamps.every((t, i) => t === Math.round((i * 1e6) / 30)),
            last: timestamps.at(-1),
            memoryBefore,
            memoryAfter: session.getMemoryReport().currentBytes,
          };
          session.dispose();
          return result;
        },

        async exr() {
          const { session } = await analyticSession("w06-exr");
          const cap = await session.capture({ aovs: "all" });
          const blob = await cap.aovFrame.toExr(cap.hdrFrame);
          const image = await readExr(blob);
          const channel = (name) => image.channels.find((entry) => entry.name === name);
          const width = cap.hdrFrame.width;
          const pixels = width * cap.hdrFrame.height;
          const beautyR = channel("beauty.R").data;
          let beautyMax = 0;
          for (let p = 0; p < pixels; p += 1) beautyMax = Math.max(beautyMax, Math.abs(beautyR[p] - cap.hdrFrame.data[p * 4]));
          const albedo = cap.aovFrame.albedo();
          let albedoMax = 0;
          for (let p = 0; p < pixels; p += 1) albedoMax = Math.max(albedoMax, Math.abs(channel("albedo.G").data[p] - albedo[p * 3 + 1]));
          const depthMax = maxAbs(channel("depth.Z").data, cap.aovFrame.depth());
          const idChannel = channel("id");
          const hdrOnly = await cap.hdrFrame.toExr({ compression: "piz", metadata: { "forge3d:test": "w06" } });
          const roundTrip = await HdrFrame.fromExr(hdrOnly);
          const hdrImage = await readExr(hdrOnly);
          const malformed = await ERR(() => readExr(new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8])));
          const oversized = await ERR(() => readExr(blob, { maxDimension: 8 }));
          session.dispose();
          return {
            type: blob.type,
            names: image.channels.map((entry) => entry.name).sort(),
            size: [image.width, image.height],
            software: image.software,
            metadata: image.metadata,
            beautyMax,
            albedoMax,
            depthMax,
            idType: idChannel.type,
            idEqual: maxAbs(idChannel.data, cap.aovFrame.id()) === 0,
            roundTripMax: maxAbs(roundTrip.data, cap.hdrFrame.data),
            hdrCompression: hdrImage.compression,
            hdrMetadata: hdrImage.metadata,
            malformed,
            oversized,
          };
        },

        async tonemap() {
          const session = await offlineSession("w06-tonemap");
          const operators = ["display", "reinhard", "reinhard-extended", "aces", "uncharted2", "exposure", "filmic-terrain"];
          const result = {};
          for (const operator of operators) {
            session.beginOfflineAccumulation({ samples: 1, aovs: [] });
            await session.accumulateBatch(1);
            const gpu = await session.resolveOfflineHdr({ tonemap: { operator, whitePoint: 4 } });
            session.endOfflineAccumulation();
            const cpu = await gpu.hdrFrame.tonemap({ operator, whitePoint: 4 });
            result[operator] = { maxDiff: maxAbs(gpu.frame.data, cpu.data), mean: gpu.frame.data.reduce((s, v) => s + v, 0) / gpu.frame.data.length };
          }
          result.invalidOperator = await ERR(() => session.capture({ tonemap: { operator: "filmic" } }));
          session.dispose();
          return result;
        },

        async frames() {
          const session = await offlineSession("w06-frames");
          const animation = new CameraAnimation([
            { time: 0, phiDeg: 40, thetaDeg: 55, radius: 4.2, fovDeg: 50, target: [0, 0.2, 0] },
            { time: 1, phiDeg: 70, thetaDeg: 50, radius: 4.0, fovDeg: 50, target: [0, 0.2, 0] },
          ]);
          const progress = [];
          const sink = createMemoryFrameSink();
          const summary = await writeFrames(
            renderFrames(session, {
              animation,
              fps: 12,
              cameraOptions: { near: 0.1, far: 50 },
              capture: { aovs: ["motion", "depth"] },
              onProgress: (p) => progress.push([p.frame, p.totalFrames, p.outputPath]),
            }),
            sink,
          );
          const names = [...sink.files.keys()];
          const firstPng = new Uint8Array(await sink.files.get(names[0]).arrayBuffer());
          // Motion vectors chain previous cameras through the sequence.
          const frames = [];
          for await (const frame of renderFrames(session, { animation, fps: 12, endFrame: 3, cameraOptions: { near: 0.1, far: 50 }, capture: { aovs: ["motion"] } })) {
            frames.push(frame);
          }
          const motionMax = (frame) => frame.aovFrame.motion().reduce((m, v) => Math.max(m, Math.abs(v)), 0);
          // Display mode reproduces capture-mode frames.
          const displayFrames = [];
          for await (const frame of renderFrames(session, { animation, fps: 12, endFrame: 2, mode: "display", cameraOptions: { near: 0.1, far: 50 } })) {
            displayFrames.push(frame);
          }
          // Cancellation mid-stream.
          const controller = new AbortController();
          let seen = 0;
          const cancelled = await ERR(async () => {
            for await (const frame of renderFrames(session, { animation, fps: 12, signal: controller.signal, cameraOptions: { near: 0.1, far: 50 } })) {
              seen += 1;
              if (frame.index === 2) controller.abort("stop");
            }
          });
          const renderAfterCancel = session.render();
          // OPFS sink.
          let opfs = { supported: false };
          if (navigator.storage?.getDirectory !== undefined) {
            const root = await navigator.storage.getDirectory();
            const config = new RenderConfig({ outputDir: "w06-test/frames", filenamePrefix: "shot", fps: 12 });
            const opfsSink = await createOpfsFrameSink({ root, config });
            const written = await writeFrames(frames, opfsSink);
            const directory = await config.ensureOutputDir(root);
            const file = await (await directory.getFileHandle(written.names[0])).getFile();
            const bytes = new Uint8Array(await file.arrayBuffer());
            opfs = { supported: true, names: written.names, signature: Array.from(bytes.slice(0, 8)), size: file.size };
            await root.removeEntry("w06-test", { recursive: true });
          }
          // Download sink routes named blobs.
          const downloads = [];
          await writeFrames(frames.slice(0, 2), createDownloadFrameSink({ download: (blob, name) => downloads.push([name, blob.type]) }));
          // Native FrameDumper naming.
          const dumperSink = createMemoryFrameSink();
          const dumper = new FrameDumper(dumperSink, { prefix: "render" });
          dumper.startRecording();
          await dumper.captureFrame(frames[0].frame);
          await dumper.captureFrame(frames[1]);
          const dumpCount = await dumper.stopRecording();
          const dumperErrors = [await ERR(() => dumper.captureFrame(frames[0].frame)), await ERR(() => dumper.stopRecording())];
          // Deterministic PNG bytes (stored zlib).
          const pngA = new Uint8Array(await frames[0].frame.toPng({ compression: "none" }).then((b) => b.arrayBuffer()));
          const pngB = new Uint8Array(await frames[0].frame.toPng({ compression: "none" }).then((b) => b.arrayBuffer()));
          const bitmap = await createImageBitmap(new Blob([pngA], { type: "image/png" }), { colorSpaceConversion: "none", premultiplyAlpha: "none" });
          const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
          const context = canvas.getContext("2d");
          context.drawImage(bitmap, 0, 0);
          const decoded = context.getImageData(0, 0, bitmap.width, bitmap.height).data;
          session.dispose();
          return {
            summary,
            names,
            pngSignature: Array.from(firstPng.slice(0, 8)),
            progress,
            frameCount: animation.getFrameCount(12),
            motion: frames.map(motionMax),
            displayVsCapture: maxAbs(displayFrames[1].frame.data, frames[1].frame.data),
            cancelled,
            seen,
            renderAfterCancel,
            opfs,
            downloads,
            dumpCount,
            dumperNames: [...dumperSink.files.keys()],
            dumperErrors,
            pngDeterministic: maxAbs(pngA, pngB) === 0 && pngA.length === pngB.length,
            pngDecodeMax: maxAbs(decoded, frames[0].frame.data),
          };
        },

        async video() {
          const session = await offlineSession("w06-video");
          const animation = new CameraAnimation([
            { time: 0, phiDeg: 40, thetaDeg: 55, radius: 4.2, fovDeg: 50, target: [0, 0.2, 0] },
            { time: 1, phiDeg: 90, thetaDeg: 50, radius: 4.0, fovDeg: 50, target: [0, 0.2, 0] },
          ]);
          const frames = [];
          for await (const frame of renderFrames(session, { animation, fps: 12, mode: "display", cameraOptions: { near: 0.1, far: 50 } })) {
            frames.push(frame.frame);
          }
          session.dispose();
          const probes = await probeVideoCodecs({ width: OFFLINE_WIDTH, height: OFFLINE_HEIGHT, fps: 12 });
          const webmProbes = await probeVideoCodecs({ width: OFFLINE_WIDTH, height: OFFLINE_HEIGHT, fps: 12, container: "webm" });
          const result = { probes, webmProbes, frames: frames.length };
          const encodeFor = async (container) => {
            try {
              const encoded = await encodeVideo(frames, { fps: 12, container, keyFrameInterval: 6 });
              const bytes = new Uint8Array(await encoded.blob.arrayBuffer());
              const mb = await import("mediabunny");
              const input = new mb.Input({ source: new mb.BufferSource(bytes), formats: mb.ALL_FORMATS });
              const track = await input.getPrimaryVideoTrack();
              const sink = new mb.EncodedPacketSink(track);
              const timestamps = [];
              for await (const packet of sink.packets()) timestamps.push(Math.round(packet.timestamp * 1e6));
              timestamps.sort((x, y) => x - y);
              return {
                ok: true,
                codec: encoded.codec,
                mimeType: encoded.mimeType,
                frameCount: encoded.frameCount,
                timestampsUs: encoded.timestampsUs,
                durationUs: encoded.durationUs,
                keyFrames: encoded.keyFrames,
                demuxed: timestamps,
                demuxedCodec: await track.getCodecParameterString(),
                size: bytes.length,
              };
            } catch (error) {
              const normalized = Forge3DError.from(error);
              return { ok: false, code: normalized.code, message: normalized.message, details: normalized.details };
            }
          };
          result.mp4 = await encodeFor("mp4");
          result.webm = await encodeFor("webm");
          // Deterministic muxing: identical chunks produce identical bytes.
          const chunk = { data: new Uint8Array([0, 0, 0, 1, 9, 16]), type: "key", timestampUs: 0, durationUs: 83333 };
          const muxOptions = { codec: "vp9", container: "webm", width: 16, height: 16, fps: 12 };
          const muxA = new Uint8Array(await (await muxEncodedVideo([chunk], muxOptions)).arrayBuffer());
          const muxB = new Uint8Array(await (await muxEncodedVideo([chunk], muxOptions)).arrayBuffer());
          const mp4Options = { codec: "vp9", container: "mp4", width: 16, height: 16, fps: 12 };
          const mp4A = new Uint8Array(await (await muxEncodedVideo([chunk], mp4Options)).arrayBuffer());
          await new Promise((resolve) => setTimeout(resolve, 1100));
          const mp4B = new Uint8Array(await (await muxEncodedVideo([chunk], mp4Options)).arrayBuffer());
          result.muxDeterministic = { webm: maxAbs(muxA, muxB) === 0 && muxA.length === muxB.length, mp4: maxAbs(mp4A, mp4B) === 0 && mp4A.length === mp4B.length };
          // Typed unavailable-codec diagnostic when WebCodecs is absent.
          const saved = globalThis.VideoEncoder;
          globalThis.VideoEncoder = undefined;
          try {
            result.unavailable = await ERR_DETAIL(() => encodeVideo(frames.slice(0, 2), { fps: 12 }));
          } finally {
            globalThis.VideoEncoder = saved;
          }
          result.badContainer = await ERR(() => encodeVideo(frames.slice(0, 2), { fps: 12, container: "webm", codec: "avc" }));
          return result;
        },

        async parity() {
          const session = await Forge3DSession.create(document.getElementById("forge3d-w04-parity-canvas"), {
            runtime: { diagnostics: true, width: WIDTH, height: HEIGHT, devicePixelRatio: 1, clearColor: [0, 0, 0, 1], memoryBudgetBytes: 1 << 30 },
          });
          session.setScene(await buildParityScene());
          session.setCamera(cameraInput());
          const cap = await session.capture({ aovs: ["albedo", "normal", "depth"] });
          const manifest = await (await fetch("/tests/golden/w06-aov-native.json")).json();
          const bytes = new Uint8Array(await (await fetch("/tests/golden/w06-aov-native.bin")).arrayBuffer());
          const view = new DataView(bytes.buffer);
          const plane = (name) => {
            const entry = manifest.planes.find((p) => p.name === name);
            const count = WIDTH * HEIGHT * entry.channels;
            const out = new Float32Array(count);
            for (let i = 0; i < count; i += 1) out[i] = f16(view.getUint16(entry.offset + i * 2, true));
            return out;
          };
          const compare = async (name, ours, channels) => {
            const theirs = plane(name);
            let min = Infinity;
            let max = -Infinity;
            for (const v of theirs) {
              min = Math.min(min, v);
              max = Math.max(max, v);
            }
            const metrics = await compareImages(ours, theirs, { width: WIDTH, height: HEIGHT, channels, dataRange: max - min });
            return { ...metrics, range: max - min };
          };
          const golden = await decodeGolden();
          const beauty = await compareImages(rgbaToFloat(cap.frame.data), rgbaToFloat(golden), { width: WIDTH, height: HEIGHT, channels: 4, compareChannels: 3, dataRange: 1 });
          const result = {
            beauty,
            albedo: await compare("albedo", cap.aovFrame.albedo(), 3),
            normal: await compare("normal", cap.aovFrame.normal(), 3),
            depth: await compare("depth", cap.aovFrame.depth(), 1),
            manifestClip: manifest.clip,
            near: cap.aovFrame.near,
            far: cap.aovFrame.far,
          };
          session.dispose();
          return result;
        },

        async deviceLoss() {
          const created = [];
          setSessionRuntimeFactoryForTests(async (canvas, options) => {
            const runtime = await Forge3DRuntime.create(canvas, options);
            created.push(runtime);
            return runtime;
          });
          let session;
          try {
            session = await offlineSession("w06-loss");
            let lost = false;
            const failure = await ERR_DETAIL(() =>
              session.renderOffline({
                settings: settings({ batchSize: 2 }),
                samples: 64,
                onProgress: () => {
                  if (!lost) {
                    lost = true;
                    simulateRuntimeDeviceLossForTests(created.at(-1));
                  }
                },
              }),
            );
            await session.whenReady();
            const recovered = await session.capture({ aovs: ["depth"] });
            return {
              failure,
              runtimes: created.length,
              status: session.status,
              recoveredSize: recovered.frame.size(),
              recoveredDepth: recovered.aovFrame.hasDepth,
            };
          } finally {
            setSessionRuntimeFactoryForTests(undefined);
            session?.dispose();
          }
        },

        async memory() {
          // The runtime's native ledger accounts offline targets/buffers.
          const runtime = await Forge3DRuntime.create(document.getElementById("w06-memory"), {
            diagnostics: true,
            width: ANALYTIC_WIDTH,
            height: ANALYTIC_HEIGHT,
            devicePixelRatio: 1,
            clearColor: [0.1, 0.2, 0.3, 1],
          });
          const { scene } = analyticScene();
          runtime.setScene(scene.snapshot());
          runtime.setCamera(ANALYTIC_CAMERA);
          runtime.render();
          const baseline = runtime.getMemoryReport().currentBytes;
          let peak = 0;
          for (let cycle = 0; cycle < 30; cycle += 1) {
            const cap = await runtime.capture({ aovs: "all" });
            peak = Math.max(peak, runtime.getMemoryReport().peakBytes);
            if (cap.hdrFrame.width !== ANALYTIC_WIDTH) throw new Error("bad capture");
          }
          const after = runtime.getMemoryReport().currentBytes;
          runtime.beginOfflineAccumulation({ samples: 4, aovs: "all" });
          const during = runtime.getMemoryReport();
          const endedFlag = runtime.endOfflineAccumulation();
          const ended = runtime.getMemoryReport().currentBytes;
          runtime.dispose();
          return { baseline, after, during: during.currentBytes, duringTextures: during.categories.textures, ended, endedFlag, peak };
        },
      };

      window.__forge3dW06 = w06;
    </script>
