<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>W13 label acceptance</title
  ><canvas width="384" height="256"></canvas>
  <script type="module">
    const api = new URLSearchParams(location.search).has("dist")
      ? await import("../dist/index.js")
      : await import("../src-ts/index.ts");
    const {
      FontAtlas,
      LabelLayer,
      LabelPlan,
      Forge3DScene,
      Forge3DRuntime,
      Forge3DSession,
      Camera,
    } = api;
    const canvas = document.querySelector("canvas"),
      viewport = { width: 384, height: 256 };
    const camera = {
      position: [0, 0, 8],
      target: [0, 0, 0],
      up: [0, 1, 0],
      near: 0.1,
      far: 100,
      fovYDegrees: 45,
    };
    const hash = async (a) =>
      Array.from(
        new Uint8Array(await crypto.subtle.digest("SHA-256", a.buffer ?? a)),
        (v) => v.toString(16).padStart(2, "0"),
      ).join("");
    const covered = (rgba) => {
      let n = 0;
      for (let i = 0; i < rgba.length; i += 4)
        if (rgba[i] + rgba[i + 1] + rgba[i + 2] > 20) n++;
      return n;
    };
    const diff = (a, b) => {
      let sum = 0,
        max = 0;
      for (let i = 0; i < a.length; i++) {
        const d = Math.abs(a[i] - b[i]);
        sum += d;
        max = Math.max(max, d);
      }
      return { sum, max };
    };
    async function create() {
      const runtime = await Forge3DRuntime.create(canvas, {
        ...viewport,
        devicePixelRatio: 1,
        clearColor: [0, 0, 0, 1],
      });
      runtime.setCamera(camera);
      return runtime;
    }
    window.__w13 = {
      async render() {
        const atlas = await FontAtlas.create(),
          layer = new LabelLayer(atlas),
          scene = Forge3DScene.create(),
          runtime = await create();
        try {
          const plain = await runtime.readRgba();
          layer.addLabel("AV office", [20, 70, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 42,
          });
          layer.addLabel("مرحبا", [20, 130, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 40,
          });
          layer.addLabel("नमस्ते", [20, 195, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 40,
          });
          layer.addCallout("Peak", [275, 215, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 20,
            haloWidth: 1,
            underline: true,
          });
          const report = layer.attach(scene, { viewport });
          runtime.setScene(scene.snapshot());
          const pixels = await runtime.readRgba(),
            repeat = await runtime.readRgba();
          const capture = await runtime.capture({ samples: 1 });
          const capturePixels = capture.frame.toRgba8();
          const before = runtime.getMemoryReport();
          const replay = LabelLayer.fromJSON(atlas, layer.snapshot()),
            scene2 = Forge3DScene.create();
          replay.attach(scene2, { viewport });
          runtime.setScene(scene2.snapshot());
          const replayPixels = await runtime.readRgba();
          runtime.resize({ width: 768, height: 512, devicePixelRatio: 1 });
          const resized = await runtime.readRgba();
          runtime.resize({ ...viewport, devicePixelRatio: 1 });
          const back = await runtime.readRgba();
          layer.dispose();
          replay.dispose();
          runtime.setScene(scene.snapshot());
          const cleared = await runtime.readRgba(),
            after = runtime.getMemoryReport();
          const shaped = atlas.shape("مرحبا"),
            shapingHash = await hash(
              new TextEncoder().encode(JSON.stringify(shaped)),
            );
          return {
            covered: covered(pixels),
            accepted: report.accepted,
            glyphCount: report.glyphCount,
            bytes: report.vertexBytes,
            deterministic: (await hash(pixels)) === (await hash(repeat)),
            replay: (await hash(pixels)) === (await hash(replayPixels)),
            resizeRoundTrip: (await hash(pixels)) === (await hash(back)),
            resizedCovered: covered(resized),
            captureCovered: covered(capturePixels),
            captureDiff: diff(pixels, capturePixels),
            clearMatches: (await hash(plain)) === (await hash(cleared)),
            before,
            after,
            shapingHash,
          };
        } finally {
          layer.dispose();
          atlas.dispose();
          runtime.dispose();
          scene.dispose();
        }
      },
      async outline() {
        const atlas = await FontAtlas.defaultLatin(),
          layer = new LabelLayer(atlas),
          scene = Forge3DScene.create(),
          runtime = await create();
        try {
          layer.addLabel("AO", [40, 170, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 120,
          });
          layer.attach(scene, { viewport });
          runtime.setScene(scene.snapshot());
          const pixels = await runtime.readRgba();
          const reference = new OffscreenCanvas(384, 256),
            ctx = reference.getContext("2d");
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, 384, 256);
          ctx.fillStyle = "white";
          const shape = atlas.shape("AO", {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 120,
          });
          for (const glyph of shape.glyphs) {
            ctx.save();
            ctx.translate(40 + glyph.x, 170 + glyph.y);
            ctx.scale(1, -1);
            const path = new Path2D(
              glyph.path
                .map((c) => c.type + " " + c.values.join(" "))
                .join(" "),
            );
            ctx.fill(path);
            ctx.restore();
          }
          const expected = ctx.getImageData(0, 0, 384, 256).data;
          let agree = 0,
            count = 0,
            holes = 0,
            expectedCount = 0;
          for (let y = 70; y < 180; y++)
            for (let x = 35; x < 225; x++) {
              const i = (y * 384 + x) * 4,
                a = pixels[i] > 127,
                b = expected[i] > 127;
              if (a === b) agree++;
              if (a) count++;
              if (b) expectedCount++;
              else if (x > 120 && x < 175 && y > 100 && y < 150) holes++;
            }
          return {
            agreement: agree / (110 * 190),
            covered: count,
            expectedCovered: expectedCount,
            holes,
            negativeControlAgreement: 1 - expectedCount / (110 * 190),
          };
        } finally {
          layer.dispose();
          atlas.dispose();
          runtime.dispose();
          scene.dispose();
        }
      },
      async depth() {
        const atlas = await FontAtlas.defaultLatin(),
          layer = new LabelLayer(atlas),
          scene = Forge3DScene.create(),
          runtime = await create();
        try {
          const id = layer.addLabel("VISIBLE", [0, 0, -2], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 48,
            depthTest: true,
          });
          layer.attach(scene, { viewport, camera: Camera.fromInput(camera) });
          runtime.setScene(scene.snapshot());
          const visible = await runtime.readRgba();
          // A black world text rectangle at z=0 is a depth-writing occluder in front of the label at z=-2.
          scene.addNode({
            kind: "text-mesh",
            name: "occluder",
            text: "X",
            size: 12,
            color: [0, 0, 0, 1],
            transform: { translation: [-6, -6, 0] },
          });
          runtime.setScene(scene.snapshot());
          const hidden = await runtime.readRgba();
          const capture = await runtime.capture({ samples: 1, aovs: ["id"] });
          return {
            visible: covered(visible),
            hidden: covered(hidden),
            capture: covered(capture.frame.toRgba8()),
            id: id.id,
          };
        } finally {
          layer.dispose();
          atlas.dispose();
          runtime.dispose();
          scene.dispose();
        }
      },
      async session() {
        const atlas = await FontAtlas.defaultLatin(),
          layer = new LabelLayer(atlas),
          scene = Forge3DScene.create(),
          session = await Forge3DSession.create(canvas, {
            runtime: {
              ...viewport,
              devicePixelRatio: 1,
              clearColor: [0, 0, 0, 1],
            },
          });
        try {
          layer.addLabel("Session", [30, 100, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 40,
          });
          layer.attach(scene, { viewport });
          session.setScene(scene);
          session.setCamera(camera);
          const a = await session.capture({ samples: 1 });
          const copy = session.getScene();
          const before = covered(a.frame.toRgba8());
          layer.setLabelsEnabled(false);
          layer.attach(scene, { viewport });
          const b = await session.capture({ samples: 1 });
          return {
            before,
            disabled: covered(b.frame.toRgba8()),
            copiedNodes: copy.getNodes().length,
          };
        } finally {
          layer.dispose();
          atlas.dispose();
          session.dispose();
          scene.dispose();
        }
      },
      async viewer() {
        const atlas = await FontAtlas.defaultLatin(),
          layer = new LabelLayer(atlas),
          viewer = await api.Forge3DViewer.create(canvas, {
            runtime: {
              width: 384,
              height: 256,
              devicePixelRatio: 1,
              clearColor: [0, 0, 0, 1],
              diagnostics: true,
            },
            controls: false,
            resize: false,
          });
        try {
          layer.addLabel("Viewer", [0, 0, 0], {
            color: [1, 1, 1, 1],
            haloWidth: 0,
            horizonFadeAngle: 0,
            fontSize: 40,
          });
          viewer.setCamera(camera);
          viewer.setLabels(layer);
          const image = async (blob) => {
            const bitmap = await createImageBitmap(blob),
              c = new OffscreenCanvas(bitmap.width, bitmap.height),
              ctx = c.getContext("2d");
            ctx.drawImage(bitmap, 0, 0);
            bitmap.close();
            return ctx.getImageData(0, 0, c.width, c.height).data;
          };
          const before = covered(await image(await viewer.screenshot()));
          layer.setLabelsEnabled(false);
          const disabled = covered(await image(await viewer.screenshot()));
          layer.setLabelsEnabled(true);
          viewer.resize({ width: 512, height: 320, devicePixelRatio: 1 });
          const resized = covered(await image(await viewer.screenshot()));
          const { simulateViewerDeviceLossForTests } = await import(
            "../src-ts/viewer.ts"
          );
          const recovery = new Promise((resolve) => {
            const unsubscribe = viewer.addRecoveryListener(() => {
              unsubscribe();
              resolve();
            });
          });
          simulateViewerDeviceLossForTests(viewer);
          await recovery;
          const recovered = covered(await image(await viewer.screenshot()));
          const report = viewer.getLabelReport();
          viewer.dispose();
          return {
            before,
            disabled,
            resized,
            recovered,
            accepted: report.accepted,
            viewerDisposed: viewer.disposed,
            fontStillAlive: !atlas.disposed,
          };
        } finally {
          viewer.dispose();
          layer.dispose();
          atlas.dispose();
        }
      },
      async contracts() {
        const atlas = await FontAtlas.create(),
          layer = new LabelLayer(atlas);
        try {
          const id = layer.addLineLabel(
              "ROAD",
              [
                [10, 60, 0],
                [370, 60, 0],
              ],
              {
                color: [1, 1, 1, 1],
                haloWidth: 0,
                horizonFadeAngle: 0,
                repeatDistance: 90,
                fontSize: 18,
                placement: "along",
              },
            ).id,
            report = layer.render({ viewport });
          const plan = LabelPlan.compile({
            labels: [
              {
                id: "terrain",
                text: "Peak",
                position: [20, 30, 0],
                requires_terrain: true,
              },
            ],
            viewport: [384, 256],
            terrain: {
              sample: (x, y, z) => ({
                elevation: 40 + x * 0.1,
                source: "fixture-dem",
                visible: true,
              }),
            },
          });
          return {
            id,
            glyphCount: report.glyphCount,
            nodes: report.nodes.length,
            curved: layer.addCurvedLabel("River", [
              [0, 0, 0],
              [1, 2, 0],
              [4, 0, 0],
            ]),
            elevated: layer.addLineLabel(
              "Ridge",
              [
                [0, 0, 0],
                [10, 0, 1],
              ],
              {},
              "sample",
            ),
            terrain: plan.accepted[0].candidate.anchor,
            pick: layer.pick(15, 55),
            serialized:
              LabelPlan.fromJSON(plan.serialize()).serialize() ===
              plan.serialize(),
            fonts: atlas.fontIds,
            shapingHash: await hash(
              new TextEncoder().encode(JSON.stringify(atlas.shape("مرحبا"))),
            ),
          };
        } finally {
          layer.dispose();
          atlas.dispose();
        }
      },
    };
  </script>
</html>
